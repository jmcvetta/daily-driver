# Per-token prices, in USD, for harnesses that report token counts but no
# price -- Omp and Codex. `scripts/evals-record.py` computes a replicate's
# price from these rates and the token counts its run row carries. Claude
# Code reports its own price, so its models need no entry here.
#
# Keyed by requested model id, without trailing `:<level>` thinking suffix.
# Priced entries carry four rates -- uncached `input`, `output`, `cache_read`
# and `cache_write` (USD per token, not per million). All entries cite the
# source URL and date read (`read_on`, YYYY-MM-DD).
#
# A subscription-billed model with no applicable per-token rate may instead
# declare `unpriced_reason`, `source` and `read_on`. Its tokens remain recorded;
# its dollar cost stays unavailable, never zero.
#
#   vercel-ai-gateway/zai/glm-5.3:
#     input: <USD per uncached input token>
#     output: <USD per output token>
#     cache_read: <USD per cached input token read>
#     cache_write: <USD per input token written to cache>
#     source: <URL of the published price list>
#     read_on: <YYYY-MM-DD>

models:
  openai-codex/gpt-6.1-sol:
    unpriced_reason: Codex subscription usage has no per-token dollar rate.
    source: https://developers.openai.com/codex/pricing
    read_on: 2026-10-06
  google-antigravity/gemini-3.8-flash:
    unpriced_reason: Antigravity quota is a subscription allowance with no applicable per-token USD rate.
    source: https://antigravity.google/docs/plans
    read_on: 2026-10-08
  google-antigravity/gemini-3.1-pro:
    unpriced_reason: Antigravity quota is a subscription allowance with no applicable per-token USD rate.
    source: https://antigravity.google/docs/plans
    read_on: 2026-10-08
