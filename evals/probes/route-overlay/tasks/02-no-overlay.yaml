task_id: probe-route-overlay-02-no-overlay
description: >-
  Control: no overlay, so the reasoning agent takes the plugin default.
tags: [probe]

initial_prompt: >-
  Call the `task` tool exactly once. Use the agent `reasoning` and this
  assignment: "Reply with the single word PONG and nothing else." Call no other
  tool. Then quote the task tool's whole result verbatim, including any
  error text and any model name it reports.

success_criteria:
  - type: command_executed
    description: The task tool is called
    tool_name: Agent
    command_pattern: 'reasoning'
    min_count: 1
