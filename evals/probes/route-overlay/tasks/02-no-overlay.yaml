task_id: probe-route-overlay-02-no-overlay
description: >-
  Control: no overlay. The reasoning agent resolves through its frontmatter role and the plugin default, whose provider this sandbox may not have.
tags: [probe]

initial_prompt: >-
  Call the `task` tool exactly once. Use the agent `reasoning` and this
  assignment: "Reply with the single word PONG and nothing else." When the
  task result is delivered, write it verbatim, error text included, to
  `result.txt` with the write tool. Call no other tool, and do not retry the
  task.

success_criteria:
  - type: command_executed
    description: The reasoning agent is dispatched exactly once
    tool_name: Agent
    command_pattern: '"agent":\s*"reasoning"'
    min_count: 1
    max_count: 1

  - type: file_matches_regex
    description: The reasoning agent runs and replies
    path: result.txt
    pattern: '(?m)^\s*"?PONG"?\s*$'
