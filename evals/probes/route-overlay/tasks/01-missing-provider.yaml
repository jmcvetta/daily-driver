task_id: probe-route-overlay-01-missing-provider
description: >-
  The overlay points the reasoning agent at a selector with no provider.
tags: [probe]

sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: overlay.yml
          content: |
            task:
              agentModelOverrides:
                reasoning: no-such-provider/no-such-model

agent:
  type: omp
  extra_args: [--config, overlay.yml]

initial_prompt: >-
  Call the `task` tool exactly once. Use the agent `reasoning` and this
  assignment: "Reply with the single word PONG and nothing else." When the
  task result is delivered, write it verbatim, error text included, to
  `result.txt` with the write tool. Call no other tool, and do not retry the
  task.

success_criteria:
  - type: command_executed
    description: The reasoning agent is dispatched exactly once
    tool_name: Agent
    command_pattern: '"agent":\s*"reasoning"'
    min_count: 1
    max_count: 1

  - type: file_matches_regex
    description: The spawn fails for want of a model
    path: result.txt
    pattern: 'No model selected'
