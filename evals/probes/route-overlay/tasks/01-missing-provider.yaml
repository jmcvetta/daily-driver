task_id: probe-route-overlay-01-missing-provider
description: >-
  The overlay points the reasoning agent at a selector with no provider.
tags: [probe]

sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: overlay.yml
          content: |
            task:
              agentModelOverrides:
                reasoning: no-such-provider/no-such-model

agent:
  type: omp
  extra_args: [--config, overlay.yml]

initial_prompt: >-
  Call the `task` tool exactly once. Use the agent `reasoning` and this
  assignment: "Reply with the single word PONG and nothing else." Call no other
  tool. Then quote the task tool's whole result verbatim, including any
  error text and any model name it reports.

success_criteria:
  - type: command_executed
    description: The task tool is called
    tool_name: Agent
    command_pattern: 'reasoning'
    min_count: 1
