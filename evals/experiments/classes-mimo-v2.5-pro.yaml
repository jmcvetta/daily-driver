# The model-classes capability arm for the mimo-v2.5-pro Omp overlay.
#
# Measures whether this model, in the role it plays for delegated implementation
# work (its `default` role, this overlay names no separate `task` role), clears the mechanical/standard cases the suite builds from
# real merged pull requests -- see `scripts/evals-cases-from-prs.py` and
# `evals/tasks/model-classes/`. One variant: there is no plugin ablation here,
# only the question "does this model finish this task and leave its own tests
# passing". `make evals-run-classes MODEL=mimo-v2.5-pro` runs it.

experiment_id: classes-mimo-v2-5-pro
description: >-
  Model-class capability on real merged-pull-request cases, vercel-ai-gateway/xiaomi/mimo-v2.5-pro:high in the
  `task` role.

defaults:
  repeats: 3

  run_limits:
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600

  agent:
    type: omp
    model: vercel-ai-gateway/xiaomi/mimo-v2.5-pro:high
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]

variants:
  - variant_id: default
    description: This model against the model-classes suite.
