# The model-classes capability arm for Claude Sonnet 5.5 at `low` effort, on Claude Code.
#
# Measures whether this model, in the role it plays for delegated implementation
# work (its `task` role), clears the mechanical/implementation cases the suite builds from
# real merged pull requests -- see `scripts/evals-cases-from-prs.py` and
# `evals/tasks/model-classes/`. One variant: there is no plugin ablation here,
# only the question "does this model finish this task and leave its own tests
# passing". `make evals-run-classes MODEL=sonnet-low` runs it.
#
# One of three files that price the Claude route table for `embark`'s workflow
# dispatch (issue #435): this one is the `mechanical` route the table names.
# The three `mechanical` cases are the floor it must clear; its
# `implementation` cases say how far above that floor it reaches. Read pass
# rate and cost per completed task together.
#
# Sonnet 5.5 recalibrated the effort levels from Sonnet 5, so a `low` run here
# is not comparable with a Sonnet 5 `low` run.
#
# It runs on `claude-code`, the harness the route table is for. The session is
# the bare one `with-without.yaml` measures against: no plugin, and project
# settings only, so the user's own settings -- an advisor, an enabled plugin --
# never reach the model under test.

experiment_id: classes-sonnet-low
description: >-
  Model-class capability on real merged-pull-request cases, claude-sonnet-5-5 at `low` effort
  on Claude Code in the `task` role.

defaults:
  repeats: 3

  run_limits:
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600

  agent:
    type: claude-code
    model: claude-sonnet-5-5
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]
    plugins: []
    setting_sources: [project]
    sdk_options:
      effort: low

variants:
  - variant_id: default
    description: This model against the model-classes suite.
