# The Codex arm: the same suites, the same plugin, a third harness.
#
# **Why this is its own file rather than a third variant of
# `with-without.yaml`.** The same reason `omp.yaml` is its own file. Rows that
# cannot be graded identically across harnesses are forked and routed by tag,
# and a `coder_eval` variant applies to every task in the run — so one
# invocation carrying more than one arm's rows would grade one harness's routes
# under another's and pay for it. Three invocations, filtered by tag, is what
# separates them: `make evals-run` excludes `omp-only` and `codex-only`,
# `make evals-run-omp` excludes `claude-only` and `codex-only`, and
# `make evals-run-codex` excludes both of the others.
#
# **One variant, not two.** There is no bare-Codex control here, for the reason
# `omp.yaml` gives: a second variant doubles what the arm costs per run, and
# this arm has no ablation delta to read yet. The control is within the arm — a
# positive row and a negative row in the same run, which together say whether
# the skills reached the session at all.
#
# **`agent: {type: codex-daily-driver}` is not the built-in `codex` kind.** It
# comes from `coder-eval-codex/`, a `coder_eval` plugin in this repository,
# installed beside the pinned harness by `make evals-install`. It subclasses the
# built-in agent and adds the one thing the built-in does not do: the
# `[RESULT - …]` transcript every judge rubric under `tasks/` anchors on.
# Pointed at the built-in `codex` instead, the suite runs, costs money, and
# scores every judged row 0.0. See `../coder-eval-codex/README.md`.
#
# `coder-eval plan` does NOT fail when it cannot resolve a variant — it prints
# the failure and still exits 0 — so `make evals-plan` runs
# `scripts/evals-variants.py` first, as a prerequisite, which is what actually
# catches a misconfigured arm. See docs/notes/0015-the-codex-arm.md.

experiment_id: codex
description: >-
  Trigger accuracy and reference routing, with the daily-driver plugin's skills
  loaded into Codex.

defaults:
  # Matched to `with-without.yaml` and `omp.yaml` on purpose: the arms differ in
  # the harness, and a different replicate count would make them differ in the
  # confidence interval too.
  repeats: 5

  run_limits:
    # The same two clocks, and the same 180s grading window between them, as the
    # other two experiments. Every task restates what it actually needs.
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600

  agent:
    type: codex-daily-driver

    # Pinned so a report says which model produced it, and so the arms differ
    # only in the harness. `coder_eval` leaves this unset and falls back to
    # `CODEX_MODEL`, which makes two operators' runs incomparable.
    #
    # NOT verified against a live run — nothing in this repository has started a
    # Codex session through the SDK. It is the first field to correct if the
    # account's Codex model is named otherwise.
    model: gpt-5-codex

    # Recorded and NOT enforced. `CodexAgent._log_config_enforcement` logs this
    # and `permission_mode` and confines nothing: the agent's own security
    # notice says Codex runs full-access on every mode. The trust boundary is
    # `coder_eval`'s per-run sandbox.
    permission_mode: acceptEdits

    # `allowed_tools` is deliberately absent, where the other two experiments
    # set `[Skill]`. It would be wrong twice over here. Codex has no `Skill`
    # tool — a skill is engaged by reading `.agents/skills/<name>/SKILL.md` with
    # the shell — so the list would name a tool that does not exist and omit the
    # one the engagement runs through. And it is unenforced anyway, so writing
    # it would only mislead a reader of this file. The cost is the same one the
    # Omp arm records: the no-fire rows are weaker here, because
    # `disallowed_tools` cannot remove the shell the engagement would be typed
    # into. See "The Codex arm" in ../README.md.

variants:
  # The treated arm. `path` is the PLUGIN ROOT and is resolved against the
  # process working directory, so `coder-eval` must run from `evals/` — which is
  # the other reason all three eval targets `cd evals` first.
  #
  # It stays relative here, matching the other two experiments, and
  # `CodexDailyDriverAgent.start` makes it absolute before the built-in agent
  # sees it. That step is not optional: `_setup_skills` symlinks each skill by
  # the path it was handed, and a relative one links every skill back at itself.
  # `../coder-eval-codex/src/coder_eval_codex/plugins.py` has the measurement.
  #
  # `CodexAgent._setup_skills` scans this root and the `skills/` directory under
  # it, and symlinks each skill into `<task cwd>/.agents/skills/<name>/`, where
  # Codex discovers it. That is skills alone: the hooks, the agents and the
  # rules are not installed, which is why `tasks/constitution/*` carries
  # `skip:codex` and is not in this run.
  - variant_id: codex
    description: A Codex session with the daily-driver plugin's skills loaded.
    agent:
      plugins:
        - type: local
          path: ".."
