# The Codex arm: GPT-6.1 Sol through the installed `codex` executable.
#
# **This is a harness comparison, not a twentieth provider pair.** The same
# subscription, the same model and the same plugin treatment are measured
# through Omp (an `omp-gpt-6.1-sol-*` experiment) and through the Codex CLI.
# That is the question the user replaced the SDK comparison with on 2026-10-31.
#
# **Why a separate file rather than a variant of `with-without.yaml`.** Each
# harness has its own invocation: the other two arms are `coder_eval` agent
# kinds, this one is the CLI adapter in `../coder-eval-codex/`. Experiment
# variants apply to every task in the run, so one invocation carrying more than
# one harness's rows would grade one harness under another's settings and pay
# for it. The three run targets separate the arms with `--exclude-tags`:
# `evals-run` excludes `omp-only` and `codex-only`, `evals-run-omp` excludes
# `claude-only` and `codex-only`, and `evals-run-codex` excludes both others.
#
# **One treated variant.** The Omp ablation already measures bare against
# treated on the same subscription; this arm isolates the harness by matching
# the treated arm. Its own bare control would answer a different question.
#
# **`agent: {type: codex-daily-driver}` is not the built-in `codex` kind.** The
# built-in drives the Codex SDK and hands the judge bare reply text, so every
# judged row would score 0.0. This kind spawns `codex exec --json`, reduces the
# documented event stream, renders the `[RESULT - …]` transcript every rubric
# anchors on, and records its own CLI version, auth mode, model catalog and
# skill links. See `../coder-eval-codex/README.md`.
#
# `coder-eval plan` does NOT fail when it cannot resolve a variant — it prints
# the failure and still exits 0 — so `make evals-plan` runs
# `scripts/evals-variants.py` first, as a prerequisite. See
# docs/notes/0015-the-codex-arm.md.

experiment_id: codex
description: >-
  GPT-6.1 Sol at high effort through the installed Codex CLI, with the
  daily-driver plugin's skills loaded.

defaults:
  # Matched to the Omp Sol ablation on purpose: the arms differ in the harness,
  # and a different replicate count would make them differ in the confidence
  # interval too.
  repeats: 5

  run_limits:
    # The same two clocks, and the same 180s grading window between them, as
    # the other two arms. Every task restates what it actually needs.
    max_turns: 60
    task_timeout: 1080
    turn_timeout: 900

  agent:
    type: codex-daily-driver

    # The dated, current Sol model. The catalog is checked at `start()`, so a
    # pin the installed CLI does not list fails before the first turn rather
    # than falling back to a provider default. The stale `gpt-5-codex` pin this
    # replaces was never verified against a live session.
    model: gpt-6.1-sol
    effort: high

    # The subscription is the authorized route. The adapter refuses
    # `CODEX_API_KEY`/`OPENAI_API_KEY` and a login it cannot identify as a
    # ChatGPT subscription, so a metered API key cannot silently bill the run.
    require_subscription_auth: true

    # Recorded and NOT enforced: `codex exec` has no tool allowlist. The trust
    # boundary is the eval sandbox plus the CLI sandbox mode (`workspace-write`,
    # or `read-only` for a PLAN-mode task). `allowed_tools` is deliberately
    # absent for the same reason it is absent from the Omp arm's probe: writing
    # a list the CLI cannot enforce would mislead a reader of this file.
    permission_mode: acceptEdits

variants:
  # `path` is the PLUGIN ROOT and is resolved against the process working
  # directory, so `coder-eval` must run from `evals/` — which is why every eval
  # target `cd evals` first. The adapter makes it absolute and then links each
  # skill into `<task cwd>/.agents/skills/<name>`, where the CLI discovers it.
  # A declared root that yields no readable skill is fatal, not a warning.
  - variant_id: cli
    description: A Codex CLI session with the daily-driver plugin's skills loaded.
    agent:
      plugins:
        - type: local
          path: ".."
