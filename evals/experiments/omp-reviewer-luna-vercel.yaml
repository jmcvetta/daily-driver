# The GPT-6 Luna reviewer arm.
#
# Same shape as omp-reviewer-deepseek-v4-pro-vercel: fixed parent, helpers and
# judge, one reviewer route, first-party upstreams only.
experiment_id: omp-reviewer-luna-vercel
description: >-
  Reviewer finding quality on eight frozen local diffs. GPT-6 Luna at high
  effort; parent and helpers fixed to GPT-6.1 Sol.
defaults:
  repeats: 5
  run_limits:
    max_turns: 16
    turn_timeout: 900
    task_timeout: 900
  agent:
    type: omp
    model: vercel-ai-gateway/openai/gpt-6.1-sol:low
    vercel_gateway_only:
      vercel-ai-gateway/openai/gpt-6.1-sol: [openai]
      vercel-ai-gateway/openai/gpt-6-luna: [openai]
    record_reviewer_telemetry: true
    permission_mode: acceptEdits
    allowed_tools: [Read, Bash, Task, Write, wait]
    record_task_dispatches: true
    settle_on_async_handoff: false
    extra_args: [--config, routes/vercel-luna.yml]
  post_run:
    - command: 'cat omp-task-dispatches.json'
    - command: 'cat omp-protocol-observations.json'
    - command: 'cat omp-reviewer-telemetry.json'
variants:
  - variant_id: reviewer
    description: Fixed plugin, parent and helpers; GPT-6 Luna reviewer on the Vercel gateway.
    agent:
      plugins:
        - type: local
          path: ".."
