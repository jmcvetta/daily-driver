# Paired skill and workflow ablation on the Codex subscription.
experiment_id: omp-gpt-6-1-terra
description: GPT 6.1 Terra at high effort, with and without the plugin.
defaults:
  repeats: 5
  run_limits:
    max_turns: 60
    task_timeout: 1080
    turn_timeout: 900
  agent:
    type: omp
    model: openai-codex/gpt-6.1-terra
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent:
      plugins: []
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
