# The Omp arm for one model, measured with and without daily-driver.
#
# The earlier Omp experiment carried one treated Claude variant. The delta is
# now the thing readers need: each configured model has its own experiment and
# the same `bare` and `with-plugin` variants. A variant applies to every task,
# so separate files keep reports attributable to one model family.
#
# `agent: {type: omp}` resolves only when `coder-eval-omp` is installed beside
# `coder-eval`. `coder-eval plan` prints resolution failures but exits 0, so
# `make evals-plan` runs `scripts/evals-variants.py` first.

experiment_id: omp-deepseek-v4-1-flash
description: >-
  Trigger accuracy and constitution delivery on DeepSeek
  V4.1 Flash 1017, with daily-driver loaded and without it.

defaults:
  repeats: 5

  run_limits:
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600

  agent:
    type: omp
    # The dated catalog entry Vercel lists, and only DeepSeek's first-party
    # upstream may serve it. The suffix is the adapter's thinking-level
    # setting, stripped before `set_model`; the full-rerun protocol uses high.
    model: vercel-ai-gateway/deepseek/deepseek-v4.1-flash-1017:high
    vercel_gateway_only: [deepseek]
    permission_mode: acceptEdits
    # Enforced as `omp --tools=read`: `Skill` needs `read`, which is how Omp
    # engages a skill. A row that restates this field replaces it.
    allowed_tools: [Skill]

variants:
  - variant_id: bare
    description: An Omp session with no plugin loaded.
    agent:
      plugins: []

  - variant_id: with-plugin
    description: An Omp session with the daily-driver plugin installed.
    agent:
      plugins:
        - type: local
          path: ".."
