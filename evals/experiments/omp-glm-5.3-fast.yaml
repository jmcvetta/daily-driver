experiment_id: omp-glm-5-3-fast
description: GLM 5.3 Fast on Vercel, with and without the plugin.
defaults:
  repeats: 5
  run_limits: {max_turns: 60, task_timeout: 1080, turn_timeout: 900}
  agent:
    type: omp
    model: vercel-ai-gateway/zai/glm-5.3-fast
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent: {plugins: []}
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
