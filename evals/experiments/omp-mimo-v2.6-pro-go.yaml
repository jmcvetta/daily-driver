experiment_id: omp-mimo-v2-6-pro-go
description: MiMo V2.6 Pro on Go, with and without the plugin.
defaults:
  repeats: 5
  run_limits: {max_turns: 30, task_timeout: 780, turn_timeout: 600}
  agent:
    type: omp
    model: opencode-go/mimo-v2.6-pro
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent: {plugins: []}
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
