experiment_id: omp-kimi-k3-1-pro-code
description: Kimi K3.1 Pro on Kimi Code, with and without the plugin.
defaults:
  repeats: 5
  run_limits: {max_turns: 30, task_timeout: 780, turn_timeout: 600}
  agent:
    type: omp
    model: kimi-code/k3.1-pro
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent: {plugins: []}
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
