experiment_id: with-without-667-rerun-with-plugin
description: Trigger accuracy, constitution delivery and review-depth routing, with
  the daily-driver plugin loaded and without it.
defaults:
  repeats: 5
  run_limits:
    max_turns: 60
    task_timeout: 1080
    turn_timeout: 900
  agent:
    type: claude-code
    model: claude-sonnet-5
    permission_mode: acceptEdits
    allowed_tools:
    - Skill
variants:
- variant_id: with-plugin
  description: The same session with the daily-driver plugin loaded.
  agent:
    plugins:
    - type: local
      path: ..
    - type: local
      path: dependencies/worktrunk/plugins/worktrunk
