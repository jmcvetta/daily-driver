# The Omp arm: the same suites, the same plugin, a second harness.
#
# **Why this is its own file rather than another variant of
# `with-without.yaml`.** Eleven rows cannot be graded identically on both
# harnesses — the call they name differs, or the rule itself is Claude Code
# only — so each of those is two files, tagged `claude-only` and `omp-only`.
# A variant applies to every task in the run, so one invocation carrying both
# sets would grade Omp's routes under a Claude arm and pay for it. One
# invocation per arm, filtered by tag, is what separates them, and there are
# three arms now: `make evals-run-omp` excludes `claude-only` and `codex-only`,
# and each of the other two targets excludes this arm's tag. `codex.yaml` is
# the third file, and `scripts/check-eval-arms.py` holds all three in step.
#
# **One variant, not two.** There is no bare-Omp control here, so this arm
# reports no ablation delta of its own; issue #173 asked for the arm and named
# the control it wanted instead — a positive row and a negative row in the same
# run, which together say whether the plugin loaded and whether the skill
# engagement normalisation works. A `bare` Omp variant would double what the
# arm costs per run, and it is the obvious thing to add the day the delta is
# what someone is reading.
#
# `agent: {type: omp}` resolves only when `coder-eval-omp` is installed beside
# `coder-eval`. `coder-eval plan` does NOT fail when it cannot resolve a
# variant — it prints the failure and still exits 0 — so `make evals-plan` runs
# `scripts/evals-variants.py` first, as a prerequisite, which is what actually
# catches a misconfigured arm. See docs/notes/0013-the-omp-arm.md.

experiment_id: omp
description: >-
  Trigger accuracy, constitution delivery and review-depth routing, with the
  daily-driver plugin loaded into Oh My Pi.

defaults:
  # Matched to `with-without.yaml` on purpose: the two arms differ in the
  # harness, and a different replicate count would make them differ in the
  # confidence interval too.
  repeats: 5

  run_limits:
    # The same two clocks, and the same 180s grading window between them, as
    # `with-without.yaml`. Every task restates what it actually needs.
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600

  agent:
    type: omp

    # Omp's `provider/modelId` form, applied with a `set_model` command once
    # the session is up. The provider half must name a provider the resolved
    # Omp home configures — the agent borrows the real `~/.omp/agent/` for
    # exactly that reason.
    model: anthropic/claude-sonnet-5

    permission_mode: acceptEdits

    # Recorded, and NOT enforced: Omp's RPC mode has no per-session tool
    # allowlist, so the agent warns once per task rather than letting a row
    # believe it constrained anything. A no-fire row is therefore weaker here
    # than on Claude Code — see "The Omp arm" in ../README.md.
    allowed_tools: [Skill]

variants:
  # The treated arm. `path` is the PLUGIN ROOT and is resolved against the
  # process working directory, so `coder-eval` must run from `evals/` — which
  # is the other reason both eval targets `cd evals` first. The agent installs
  # this root with `omp plugin link`, so the skills, the extension and the
  # rules all reach the session; a skills-only mapping would leave the
  # constitution out and score `tasks/constitution/*` zero for the wrong
  # reason.
  - variant_id: omp
    description: An Omp session with the daily-driver plugin installed.
    agent:
      plugins:
        - type: local
          path: ".."
