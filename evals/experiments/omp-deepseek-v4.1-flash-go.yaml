experiment_id: omp-deepseek-v4-1-flash-go
description: DeepSeek V4.1 Flash on Go, with and without the plugin.
defaults:
  repeats: 5
  run_limits: {max_turns: 60, task_timeout: 1080, turn_timeout: 900}
  agent:
    type: omp
    model: opencode-go/deepseek-v4.1-flash
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent: {plugins: []}
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
