# Frozen cohort manifest for issue #695.
#
# This file is the protocol: every applicable case, the arm it runs on, why a
# case is excluded, the experiment and settings tuple that measures it, and the
# exact command that starts it. Read `evals/README.md`, "The frozen cohort",
# for the operating rules. Change this file only by a deliberate new cohort;
# records are immutable evidence and are never edited to match a new manifest.
#
# `baseline.inputs_sha256` pins the experiments, tasks, fixtures and judges this
# protocol was frozen against. Before dispatch, record `git rev-parse HEAD` in
# the dispatch log; the manifest hashes must match that revision.
#
