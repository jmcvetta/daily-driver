experiment_id: classes-minimax-m3-vercel
description: Fixed merged-PR cases on MiniMax M3 through Vercel at high effort.
defaults:
  repeats: 3
  run_limits: {max_turns: 30, task_timeout: 780, turn_timeout: 600}
  agent:
    type: omp
    model: vercel-ai-gateway/minimax/minimax-m3
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]
variants:
  - variant_id: default
