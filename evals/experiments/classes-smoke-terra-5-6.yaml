experiment_id: classes-smoke-terra-5-6
description: One-repeat route smoke for GPT-5.6 Terra at high effort.
defaults:
  repeats: 1
  run_limits:
    max_turns: 30
    task_timeout: 780
    turn_timeout: 600
  agent:
    type: omp
    model: openai-codex/gpt-5.6-terra
    extra_args: ["--thinking", "high"]
    permission_mode: acceptEdits
    allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]
variants:
  - variant_id: default
    description: The model against the smoke-tagged model-class cases.
