# Claude Opus 5.5 at low effort; historical records retain their original settings.
experiment_id: with-without-opus-5-5
description: Opus 5.5 skill and workflow ablation.
defaults:
  repeats: 5
  run_limits:
    max_turns: 60
    task_timeout: 1080
    turn_timeout: 900
  agent:
    type: claude-code
    model: claude-opus-5-5
    sdk_options:
      effort: low
    permission_mode: acceptEdits
    allowed_tools: [Skill]
variants:
  - variant_id: bare
    agent:
      plugins: []
  - variant_id: with-plugin
    agent:
      plugins:
        - type: local
          path: ".."
        - type: local
          path: "dependencies/worktrunk/plugins/worktrunk"
