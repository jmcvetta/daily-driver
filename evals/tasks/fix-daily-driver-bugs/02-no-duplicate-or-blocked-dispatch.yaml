agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash, Task]
  disallowed_tools: [WebFetch, WebSearch]

run_limits:
  max_turns: 24
  turn_timeout: 600
  task_timeout: 1200

initial_prompt: >-
  Run the repository-local fix-daily-driver-bugs workflow against only issues
  #990003 through #990008. These are offline fixtures. Use the supplied fake
  gh only. Leave the unresolved decision, duplicate, blocked issue, claimed
  issue, existing task/PR, and injected body-write failure unlaunched. The
  verifier checks fixture state and recorded GitHub actions; run
  `python3 .fixture/verify_state.py`. Do not access a live tracker.

success_criteria:
  - type: skill_triggered
    description: The repository-local bug triage skill is loaded
    expected_skill: fix-daily-driver-bugs
    skill_name: fix-daily-driver-bugs

  - type: command_executed
    description: The verifier confirms preserved reports and no unsafe edits
    tool_name: Bash
    command_pattern: 'python3 .fixture/verify_state.py'
    min_count: 1
    require_success: true
    weight: 2

  - type: file_matches_regex
    description: Fixture states and recorded GitHub operations pass
    path: fixture-verification.txt
    pattern: '^PASS$'
    weight: 2

  - type: command_executed
    description: No excluded issue is dispatched
    tool_name: Agent
    command_pattern: 'undertake #99000[3-8]'
    min_count: 0
    max_count: 0
    weight: 2
