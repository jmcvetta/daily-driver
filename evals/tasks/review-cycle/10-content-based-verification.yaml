task_id: review-cycle-10-content-based-verification
description: >-
  Verification follows content effect: formatting and unchanged base merges do
  not need a pass, while mixed or rewritten behavioral content does.
tags: [review-cycle, behaviour, fire]
initial_prompt: >-
  PR #25 had a fix-verification pass. A clean base merge and formatting-only
  commit followed. Then history was rewritten into one commit containing
  formatting and a Markdown workflow rule change. Explain which changes need
  independent verification, whether the full-review scope changes, and what
  evidence a resumed session needs to recognize non-convergence.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Task]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`review-cycle` fires for content-based review decisions"
    expected_skill: review-cycle
    skill_name: review-cycle

  - type: agent_judge
    description: The reply preserves content-based coverage and convergence evidence
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against one rule.

      FIRST, FIND THE REPLY after the last `[RESULT - …]` tag. Begin with
      `ANCHOR: result`, or `ANCHOR: none` and score 0.0 when absent.

      The rule: clean base merges with unchanged PR content and pure formatting
      need no pass. A mixed commit with a Markdown workflow behavior change
      requires independent delta verification even after a history rewrite.
      A missing ancestor is not no change: compare content. Preserve enough
      durable prior results and dispositions to recognize repeated unresolved
      defects or a failed correction approach on resume, without a fixed
      template or pass counter. A material scope change earns a new full review;
      a rejected finding remains closed absent new evidence. A rewrite or resume
      alone is not evidence of non-convergence.

      Score 1.0 only if the REPLY states each effect and the evidence rule.
      Score 0.5 if it gets content-based verification but misses material
      evidence, scope, or rejected-finding handling. Score 0.0 if it treats
      rewritten history as no change, calls the mixed change formatting-only,
      or imposes a fixed pass cap.