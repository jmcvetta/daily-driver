task_id: review-cycle-22-triaged-routine-fix-batch
description: >-
  After triage, two mechanical corrections use one routine batch while the
  owner retains dispositions and the independent fix-delta pass.
tags: [review-cycle, behaviour, fire, omp-only]
sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: format.py
          content: |
            def format_name(name):
                return name.upper()
        - path: test_format.py
          content: |
            import unittest
            from format import format_name

            class FormatNameTests(unittest.TestCase):
                def test_plain_name(self):
                    self.assertEqual(format_name("Ada"), "ADA")

                def test_outer_whitespace_is_removed(self):
                    self.assertEqual(format_name(" Ada "), "ADA")

            if __name__ == "__main__":
                unittest.main()
        - path: README.md
          content: |
            # Name formatting

            `format_name(" Ada ")` returns `" ADA "`.
agent:
  allowed_tools: [Read, Grep, Glob, Bash, Write, Edit, Agent, Task, Skill]
  disallowed_tools: [WebFetch, WebSearch]
run_limits:
  max_turns: 40
  turn_timeout: 600
  task_timeout: 1200
initial_prompt: >-
  Continue `Fix, answer, resolve, push` for PR #827 within issue #1120's
  undertaking. Set the session title to `#1120 Delegate settled work` before
  dispatch. The independent full review at `aaa111` found two actionable
  defects, and the owner has already triaged both as accepted mechanical
  corrections with no open design or disposition question:
  `format_name(" Ada ")` returns `" ADA "` instead of `"ADA"`, and README.md's
  example documents the same incorrect padded output. The source correction,
  regression test, and documentation update form one substantial settled batch
  that is economical to assign to one `routine` worker; no finding needs its
  own worker. Fix the implementation and regression test in `format.py` and
  `test_format.py`, and correct the example in `README.md`. Acceptance: trimming
  occurs before uppercasing, the regression test passes, and the README agrees.
  Owned files are exactly those three. The worker runs `python3 -m unittest
  test_format.py` and returns the exact observed output. After integrating the
  batch, the owner runs that command once to accept the integrated state. In
  the final report, distinguish the worker's returned result from the owner's
  run; do not attribute the owner's check to the worker. If the worker result
  omits its output, ask the same worker to provide it before accepting the
  batch. The owner is authorized only to edit those files and run that local
  test; do not change other files. Return the fixes and any unresolved
  exception.
  The owner keeps thread answers and dispositions and integrates the batch.
  This offline fixture has no GitHub publication or push surface: do not claim
  a push, thread reply, or completed fix-delta verification. After an authorized
  push, the owner obtains an independent `Verify the fix delta`; do not run a
  full review or treat your own work as independently verified.
success_criteria:
  - type: command_executed
    description: Exactly one component worker handles the fix batch
    tool_name: Agent
    min_count: 1
    max_count: 1
  - type: command_executed
    description: The focused acceptance test runs
    tool_name: Bash
    command_pattern: 'python3\s+-m\s+unittest\s+test_format\.py'
    min_count: 1
    weight: 1
  - type: agent_judge
    description: One triaged batch preserves owner dispositions and independent review
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Inspect the successful Agent call and final reply. Score 1 only if one
      routine worker receives both triaged fixes, the three-file boundary,
      acceptance and named check, then the owner reports the worker's returned
      test output separately from the owner's passing integration rerun. The
      owner keeps dispositions and thread answers, integrates the batch, and
      explicitly states that independent `Verify the fix delta` remains due
      after an authorized push. The worker cannot perform that review. Score 0
      for an unsupported claim that the worker ran tests, attribution of the
      owner's test to the worker, a missing future-verification handoff,
      per-finding workers, delegated judgment, a full re-review, publication,
      or scope expansion. Do not score by matching skill prose.
