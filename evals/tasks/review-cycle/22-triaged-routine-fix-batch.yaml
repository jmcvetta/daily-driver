task_id: review-cycle-22-triaged-routine-fix-batch
description: >-
  After triage, two mechanical corrections use one routine batch while the
  owner retains dispositions and the independent fix-delta pass.
tags: [review-cycle, behaviour, fire, omp-only]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/routine-worker-dispatch/shared
      mount_point: .fixture
    - type: starter_files
      files:
        - path: format.py
          content: |
            def format_name(name):
                return name.upper()
        - path: test_format.py
          content: |
            import unittest
            from format import format_name

            class FormatNameTests(unittest.TestCase):
                def test_plain_name(self):
                    self.assertEqual(format_name("Ada"), "ADA")

                def test_outer_whitespace_is_removed(self):
                    self.assertEqual(format_name(" Ada "), "ADA")

            if __name__ == "__main__":
                unittest.main()
        - path: README.md
          content: |
            # Name formatting

            `format_name(" Ada ")` returns `" ADA "`.
        - path: .fixture/worker-test-output.txt
          content: "not-run\n"
agent:
  type: omp
  allowed_tools: [Read, Grep, Glob, Bash, Write, Edit, Agent, Task, Skill, wait]
  disallowed_tools: [WebFetch, WebSearch]
  record_task_dispatches: true
run_limits:
  max_turns: 40
  turn_timeout: 600
  task_timeout: 1200
initial_prompt: >-
  Continue `Fix, answer, resolve, push` for PR #827 within issue #1120's
  undertaking. Set the session title to `#1120 Delegate settled work` before
  dispatch. The independent full review at `aaa111` found two actionable
  defects, already triaged as accepted mechanical corrections with no open
  design or disposition question: `format_name(" Ada ")` returns `" ADA "`
  instead of `"ADA"`, and README.md documents the same incorrect output.
  This is one substantial component batch, not a second `/undertake`: exactly
  one `routine` worker is the sole writer to the three product files. The owner
  does not edit them concurrently and integrates after completion. Do not spawn
  a second worker or split findings into separate tasks. Fix trim-before-
  uppercase, preserve and run the regression test, and correct the README.
  Acceptance: the test passes and docs agree. The sandbox provides
  `.fixture/worker-test-output.txt` as an evaluation-only artifact. The worker
  captures its named test output and exit status there and returns the result.
  Immediately after dispatch, call `wait` for the worker to finish, then read
  the artifact before integration. The owner runs
  `PYTHONDONTWRITEBYTECODE=1 python3 -m unittest test_format.py` once to accept
  the integrated state. The owner is authorized only to edit the three product
  files, use that evidence artifact, and run the local test. No network,
  tracker, claim, branch, or PR access is authorized; no push or publication is
  authorized. Return changes, observed verification, and any unresolved
  exception. The owner keeps thread answers and dispositions. After an
  authorized push, independent `Verify the fix delta` remains due; do not run a
  full review or claim self-review. In the final reply, report the worker's
  observed test result and your own integrated test result separately, state
  that the owner retains dispositions and thread replies, and name `Verify the
  fix delta` as pending rather than claiming publication or completion.
success_criteria:
  - type: command_executed
    description: Exactly one component worker handles the fix batch
    tool_name: Agent
    min_count: 1
    max_count: 1
  - type: file_matches_regex
    description: Routine worker records passing focused test output
    path: .fixture/worker-test-output.txt
    pattern: '(?is)(?=.*exit[ _]status[ =:]+0)(?=.*Ran \d+ tests? in )(?=.*\nOK\b)'
    weight: 2
  - type: command_executed
    description: Owner runs the integrated acceptance test
    tool_name: Bash
    command_pattern: 'PYTHONDONTWRITEBYTECODE=1\s+python3\s+-m\s+unittest\s+test_format\.py'
    min_count: 1
    weight: 1
  - type: command_executed
    description: Owner reads the worker verification artifact
    tool_name: Read
    command_pattern: 'worker-test-output\.txt'
    min_count: 1
  - type: run_command
    description: Recorded Omp task evidence proves one routine batch and complete brief
    command: python3 .fixture/check_component_dispatch.py --scenario review-fix
    timeout: 30
    weight: 2
  - type: agent_judge
    description: Owner preserves review responsibilities and future verification
    include_agent_output: true
    include_tool_calls: false
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade only the owner's final reply. The structured dispatch checker,
      worker-output artifact and command criteria verify assignment, brief and
      tests. Score 1 only if the owner reports worker and owner test evidence
      separately, keeps dispositions and thread replies with the owner, does
      not claim publication or completion, and names the independent `Verify
      the fix delta` as pending after an authorized push. Score 0 if the owner
      attributes its own test to the worker, omits the future independent pass,
      delegates judgment, proposes per-finding workers, or expands scope.
