# Reviewing only the implementation misses scenario, binding and allocation defects.
task_id: review-cycle-20-specification-allocation
description: Review scenarios, trusted bindings and delivery against task allocation.
tags: [review-cycle, discovery, behaviour, fire]
initial_prompt: >-
  Use review-cycle to explain independent review of a PR containing agreed
  offline editing scenarios, bindings and implementation. The issue allocates
  saving edits but excludes conflict resolution. The implementation violates an
  agreed scenario, a binding misstates another, and a reviewer proposes a
  missing case that changes behavior. Explain how CI provides evidence, how
  an ambiguous scenario and material scope change are handled, and where an
  agreed change lands. Explain only; do not perform or submit a review.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Allocation and exclusions constrain review without silently adding acceptance
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer explains reviewing the agreed scenarios,
      their trusted bindings, implementation, allocated saving behavior and
      excluded conflict resolution together, using ordinary current-head CI as
      deterministic evidence without an extra acceptance-evidence gate.
      Do not require the agent to perform a review; the prompt forbids it.
      An implementation violation requires an implementation fix; a faulty binding or fixture is
      repaired without pausing for a product decision. A missing case is
      proposed to the operator, not made mandatory by reviewer edits or
      withholding the PR without agreement. A wrong or ambiguous scenario
      pauses only affected behavior for operator agreement, recorded on the
      task or specification issue; unaffected review continues. Agreed changes
      remain in the same branch and PR, with existing full review for material
      scope changes. Score 0 for silently adding acceptance or claiming a
      submitted review; otherwise 0.5 for a material omission.
