task_id: review-cycle-12-fallback-review-publication
description: >-
  A local reviewer result is published durably, with relevant prior context,
  valid anchors, and explicit failure handling rather than transcript output.
tags: [review-cycle, behaviour, fire]
initial_prompt: >-
  A harness reviewer returned two line-specific findings for PR #25 at
  `aaa111`, but nothing appears on the pull request. One finding has no valid
  diff anchor. The run may have resumed after a successful publication, and
  the PR head could change while I prepare the review. I need the findings
  recorded on the PR; what is the status?

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Task]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash]
run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200
success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`review-cycle` fires for fallback review publication"
    expected_skill: review-cycle
    skill_name: review-cycle
  - type: agent_judge
    description: The reply preserves durable fallback publication
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against one rule.

      FIRST, FIND THE REPLY after the last `[RESULT - …]` tag. Begin with
      `ANCHOR: result`, or `ANCHOR: none` and score 0.0 when absent.

      The rule: findings returned locally must be recorded durably on the PR.
      The reviewer uses relevant existing review context and checks whether the
      result was already published so a resume does not duplicate it. Re-read
      the head and validate diff anchors immediately before publication.
      Attribute findings to the reviewed commit, and anchor line-specific
      findings to a valid path, side, and line or range. Record the
      unanchorable finding in a durable summary rather than inventing an
      anchor. On an absent client, changed head, invalid anchor, permission
      problem, or GitHub failure, retain the findings and report incomplete
      publication rather than claiming a durable review.

      Grade the substance of the reply, not its vocabulary. A reply states a
      part when it conveys it in its own words; do not require the rule's
      phrasing, and do not deduct for a part the reply covers compactly.

      Score 0.0, whatever else the reply gets right, if it leaves the result in
      a transcript alone, posts duplicates, anchors the unanchorable finding,
      or treats a failed publication as done.

      Otherwise score by coverage of four things: relevant existing review
      context; durable findings attributed to the reviewed SHA with valid
      anchors and a summary for the unanchorable finding; the head re-read and
      anchors re-validated immediately before publication, with a resume checked
      against what is already recorded; and explicit failure reporting.
      Score 1.0 for all four, 0.75 for three, 0.5 for two, 0.25 for one.
