task_id: review-cycle-09-bounded-fix-verification
description: >-
  A behavior-changing batch of review fixes is independently checked; distinct
  repairable defects do not trigger a pass-count wall, but repeated failure to
  fix the same defect can establish non-convergence.
tags: [review-cycle, behaviour, fire]
initial_prompt: >-
  On PR #25, the full review at aaa111 found two defects. I fixed both plus a
  CI-reported Markdown workflow regression in one batch and pushed bbb222; CI
  is green. Explain the next review action, the evidence it must use, and what
  you record. Three successive passes found distinct repairable defects; may a
  fourth correction and targeted pass proceed? What if instead corrections
  repeatedly fail to fix the same defect?

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Task]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`review-cycle` fires for review-fix verification"
    expected_skill: review-cycle
    skill_name: review-cycle

  - type: agent_judge
    description: The reply describes the bounded independent delta-pass protocol
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block is a whole-turn transcript.
      The reply starts after the last `[RESULT - …]` tag. If there is no such
      tag, begin with `ANCHOR: none` and score 0.0. Otherwise begin with
      `ANCHOR: result`.

      The rule: a behavior-changing batch, including a Markdown workflow fix,
      gets ONE independent reviewer delta pass; it may overlap CI. The reviewer
      has context about reviewed and current content, findings, and dispositions
      to check fixes and regressions, not conduct a whole-PR audit or solicit
      style work. Record the result durably with enough evidence to identify
      scope and outcome, without fixed record fields, and name that pass's own
      verifier separately from the publisher and the full reviewer; unknown
      execution identity is reported as unreported. A defect earns a batched
      correction and independent confirmation. The first clean pass ends the
      loop. Three distinct repairable defects do not bar a fourth correction
      and targeted pass. Repeated failure to fix the same defect or a
      demonstrated failed approach may stop unattended progress: record the
      evidence and resume path, and keep the PR draft. A late bot finding or
      unavailable reviewer alone is not non-convergence; unavailable verification
      remains incomplete and cannot approve the head. CI is never verification.

      Score 1.0 only if the REPLY states all parts. Score 0.5 if it describes
      independent batch verification and permits the fourth correction but
      misses material record or escalation details. Score 0.0 if it imposes a
      fixed pass wall, treats distinct defects as non-convergence, offers a
      full re-review, verifies per finding, accepts CI as verification,
      attributes the pass to the publisher or the full reviewer, or approves
      after a defect.