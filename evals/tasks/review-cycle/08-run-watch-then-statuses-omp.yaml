# The Omp half of `08-subscribe-before-first-read`, which is tagged
# `claude-only` because the mechanism it names is Claude's. `SKILL.md`'s
# `How to wait` says only that "the mechanism is the harness's" and points at
# the reference files. `skills/review-cycle/references/omp.md` names the Omp
# mechanism: a named `bash` service runs `gh pr checks --watch` under a
# fifteen-minute `timeout`, `write proc://<name>/mode` makes it durable, `wait`
# blocks until it completes, then `gh api` reads the head commit's check runs
# and commit statuses, and the head's workflow runs.
# The final two reads are both needed because `reported` means their union, and
# zero check runs plus an empty `statuses` array is an empty result, not green.
#
# Why the Claude sibling could not be reused: it grades
# `mcp__github__subscribe_pr_activity` taken once before the first read. Omp
# has no subscription and needs none — `hub` holds the process and its cap.
# An Omp run against that rubric would fail for waiting the way its own harness
# waits.
#
# What this row can and cannot see. The sandbox has no GitHub client, so the
# watch and endpoint reads cannot actually be run here. What is observable is
# what the agent says it will do, so the graded assertion is an `agent_judge`
# on the reply, plus the skill having fired. A positive check needs a live pull
# request and a working GitHub client, which is not a sandbox this harness can
# build.
#
# Why this fails the `without` arm: a model with no plugin loaded may use
# `gh pr checks` alone or poll in a loop. What it has no reason to know is that
# Omp must use a named bash service and `wait`, then read the head commit's
# check runs, statuses and workflow runs.
# That shape lives only in this skill's own reference file.
#
task_id: review-cycle-08-run-watch-then-statuses-omp
description: >-
  Waiting on CI runs the PR check watch as a bounded named bash service, waits
  on it, then reads the head commit's check runs and statuses.
tags: [review-cycle, references, fire, behaviour, omp-only, forks:review-cycle-08-subscribe-before-first-read]

initial_prompt: >-
  PR #30 is open on this branch and CI just started running. Review the head
  and bring me the findings once it's green — but first, walk me through the
  exact sequence of calls you're going to make to notice when CI finishes,
  in order.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash, Write, wait]
  disallowed_tools: [Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`review-cycle` fires on a pull request whose CI is being waited on"
    expected_skill: review-cycle
    skill_name: review-cycle

  # The finding.
  - type: agent_judge
    description: The reply watches checks as a named bash service, waits, then reads all three sources
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must name a bounded, ordered wait. It starts
      `gh pr checks --watch` as a named `bash` service under a fifteen-minute
      `timeout`, makes it durable with `write proc://<name>/mode`, blocks with
      `wait`, then reads ALL THREE head-commit sources:
      `/commits/{sha}/check-runs`, `/commits/{sha}/status` and the
      `actions/runs?head_sha={sha}` workflow runs. It must reject zero check
      runs plus an empty statuses array as an empty result, not success, and
      must treat a nonterminal workflow run as unfinished.

      Score 1.0 if the REPLY names, in this order: the bounded watcher started
      as a named `bash` service with the fifteen-minute `timeout`; persistence
      through `write proc://<name>/mode`; waiting with `wait`; all three
      source reads after the watcher exits; and rejecting an empty pair.
      Score 0.0 if the reply polls in a loop, sleeps, names `hub` or
      `github.run_watch`, names fewer than the three sources, reads the endpoints before
      the watch, accepts an empty result, or names no specific call at all.
