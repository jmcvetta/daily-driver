task_id: review-cycle-11-standalone-inline-review
description: >-
  A review-only request records its result as a submitted GitHub review without
  turning into a fix, resolution, draft-state, or merge workflow.
tags: [review-cycle, behaviour, fire]
initial_prompt: >-
  CI is green on PR #25 at bbb222. Review it only: do not fix code, resolve
  findings, alter draft state, or merge. The pull request has two pages of
  review history, including a resolved outdated thread that rejected a proposed
  retry and an earlier inline finding. Record the review on GitHub. Explain the
  required history, publication, and response if the earlier recommendation now
  appears wrong.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Task]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash]
run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600
success_criteria:
  - type: skill_triggered
    description: "`review-cycle` fires for a standalone pull-request review"
    expected_skill: review-cycle
    skill_name: review-cycle
  - type: agent_judge
    description: The reply preserves standalone inline-review recording
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against one rule.

      FIRST, FIND THE REPLY after the last `[RESULT - …]` tag. Begin with
      `ANCHOR: result`, or `ANCHOR: none` and score 0.0 when absent.

      The rule: a standalone review reads every page of submitted reviews and
      threads before reviewing, including resolved and outdated threads, replies,
      dispositions, reviewed SHAs, and the current head. It gives that record to
      the reviewer. Each actionable line-specific finding becomes an inline
      thread in a submitted COMMENT review, anchored to the reviewed SHA, path,
      side, and valid diff line or range. A clean or unanchorable result belongs
      in the submitted review summary; no anchor is invented. A repeated rejected
      finding links to its earlier disposition. A reversal names the prior
      decision and new evidence or changed constraint. The review-only request
      then stops: no code fix, thread resolution, draft-state change, or merge.

      Score 1.0 only if the REPLY states all of this. Score 0.5 if it publishes
      inline findings and stops correctly but misses material history, summary,
      or reversal handling. Score 0.0 if it treats a transcript or loose issue
      comment as sufficient, ignores resolved/outdated history, invents an
      anchor, reopens a prior rejection without new evidence, or starts fixing.
