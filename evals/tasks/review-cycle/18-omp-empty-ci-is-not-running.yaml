# Unlike the renewal cases, all current-head inventories are empty. A timeout
# alone does not prove that there is a running check to observe again.
task_id: review-cycle-18-omp-empty-ci-is-not-running
description: Empty CI inventory is incomplete, not green or known-running CI.
tags: [review-cycle, behaviour, fire, omp-only]
initial_prompt: >-
  Review acme/widgets PR #25 when its checks are ready. This is an offline
  sandbox; the local gh client represents the pull request and its CI. Continue
  using the available evidence.
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-readiness/shared
      mount_point: .fixture
    - type: template_dir
      path: ../../fixtures/owner-continuation/shared
      mount_point: .continuation
  mock_path_dirs: [.continuation/bin, .fixture/bin]
pre_run:
  - command: bash .continuation/setup.sh empty
    timeout: 60
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash, Write, wait, Task, Agent]
  disallowed_tools: [Edit, NotebookEdit]
run_limits:
  max_turns: 30
  turn_timeout: 600
  task_timeout: 1200
success_criteria:
  - type: run_command
    description: All current-head inventories are read without repeated watches
    command: python3 .continuation/verify.py empty
    timeout: 30
    weight: 3
  - type: agent_judge
    description: Empty CI evidence is not declared green or known-running
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the actual tool calls and final answer. Begin `ANCHOR: result` if
      the final answer exists; otherwise `ANCHOR: none` and score 0. The local
      current-head check runs, statuses, and workflow inventory are all empty.
      Score 1 only if the owner identifies CI as incomplete or unregistered and
      does not claim green, start review, publish a completion notice, or treat
      timeout alone as evidence of a running workflow. Score 0 otherwise.
