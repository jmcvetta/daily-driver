# The Omp half of `07-wait-for-ci-is-not-a-sleep`, which is tagged
# `claude-only` because the wait it stands in front of is Claude's. The rule
# is the same on both harnesses — the round is entered with CI still running,
# and the wait must not be a shell `sleep` — and what replaces the sleep is
# not. On Claude it is the read-wake-read loop `How to wait` prescribes. On
# Omp, `hub` supervises `gh pr checks --watch` for a bounded fifteen minutes;
# after it exits, `gh api` reads the head commit's check runs and statuses.
# `skills/review-cycle/references/omp.md` names all three calls.
#
# Why the Claude sibling could not be reused: the two rows grade the same
# negative but stand in front of different mechanisms, and the comment that
# explains the row has to name the right one. The sibling's account of what
# the sandbox cannot see is Claude's too — it turns on a missing
# `mcp__Claude_Code_Remote__send_later`, a tool this harness never had.
#
# What this row can and cannot see. The sandbox has no GitHub client, so
# neither the watch nor the endpoint reads can actually be run here. What is
# observable is the no-sleep rule plus the skill having fired. A positive check
# that the supervised watcher and both endpoint reads were used needs a live
# pull request and a working GitHub client, which is not a sandbox this harness
# can build.
#
# `Bash` is deliberately open. A negative control on a tool the model was never
# offered passes vacuously, and this one has to be able to fail.

task_id: review-cycle-07-wait-for-ci-is-not-a-sleep-omp
description: >-
  A round entered while CI is still running waits without sleeping the shell.
tags: [review-cycle, behaviour, fire, omp-only, forks:review-cycle-07-wait-for-ci-is-not-a-sleep]

initial_prompt: >-
  I have pushed the branch and PR #25 is open on it. CI is still running.
  Review the head and bring me the findings.

agent:
  allowed_tools: [Bash, Hub, Read, Grep, Glob, Skill, Agent, Task]

run_limits:
  max_turns: 12
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 300
  task_timeout: 480

success_criteria:
  # The finding itself. `sleep [0-9]` rather than bare `sleep`, so that a
  # command merely naming the word — a grep for it, a script that prints it —
  # does not score as having slept.
  - type: command_executed
    description: The wait was not a shell sleep
    tool_name: Bash
    command_pattern: 'sleep [0-9]'
    min_count: 0
    max_count: 0
    weight: 2
    # A sleep has already lost the row, so ending the run on it costs nothing.
    stop_early: {}

  # Without this, a run that did nothing at all scores a pass on the criterion
  # above. Armed, and armed for the reason `evals/README.md` gives: a bare
  # block leaves `on_pass` at `continue`, so it truncates nothing — it puts
  # this criterion in the watcher's pass-capable set, which is what defers the
  # sleep guard's fail-stop until the skill has had its chance to fire. Left
  # unarmed, the armed set holds only that guard, and a row with no
  # pass-capable armed criterion fail-stops on the first `sleep` — freezing
  # this one at 0 on a trajectory that ended before the skill could fire.
  - type: skill_triggered
    description: "`review-cycle` fires on a pull request whose head needs reviewing"
    expected_skill: review-cycle
    skill_name: review-cycle
    stop_early: {}
