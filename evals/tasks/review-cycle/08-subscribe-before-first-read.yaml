# This guards the reading, for issue #146's late requirement. `SKILL.md`'s
# `How to wait` says only that "the mechanism is the harness's" and points at
# the reference file; it never names `subscribe_pr_activity` or says where in
# the sequence it belongs. `references/claude.md` names both: "Subscribe with
# `mcp__github__subscribe_pr_activity`, once, before the first read." — the
# order matters, because the point of subscribing first is that a webhook
# arriving between the subscribe and the first read is not missed, and
# because subscribing after reading would mean the first read ran on
# assumptions no wake had confirmed yet. A row that passes without the
# reference file being read is wrong, so the graded content is the tool name
# and that specific ordering.
#
# What this row can and cannot see. The sandbox has no GitHub MCP, so neither
# `subscribe_pr_activity` nor `pull_request_read` can actually be called here
# — there is no live pull request and no webhook to receive. What is
# observable is what the agent says it will do, so the graded assertion is an
# `agent_judge` on the reply, plus the skill having fired at all. A positive
# check that the subscription was taken before a real read went out needs a
# live pull request and the GitHub MCP, which is not a sandbox this harness
# can build — this is the same limit `review-cycle/07`'s comment states for
# the sleep guard, applied to the other half of `How to wait`.
#
# Why this fails the `without` arm: `mcp__github__subscribe_pr_activity` is a
# plausible guess for a model that already has the GitHub MCP in its tool
# list — the schema description alone explains what it does. What is not
# guessable without this skill's own reference file is that it comes FIRST,
# before any read of the checks: a model reasoning from the tool descriptions
# alone has just as much reason to read the current state before deciding
# whether a subscription is even worth taking, which is the ordering this row
# actually grades.

task_id: review-cycle-08-subscribe-before-first-read
description: >-
  Waiting on CI subscribes to the pull request's activity once, before the
  first read of its checks — not the other way around.
tags: [review-cycle, references, fire, behaviour, claude-only]

initial_prompt: >-
  PR #30 is open on this branch and CI just started running. Review the head
  and post the findings once it's green — but first, walk me through the
  exact sequence of calls you're going to make to notice when CI finishes,
  in order.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`review-cycle` fires on a pull request whose CI is being waited on"
    expected_skill: review-cycle
    skill_name: review-cycle

  # The finding.
  - type: agent_judge
    description: The reply subscribes to PR activity once, before the first check read
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # The empty tool surface and the permission mode are both load-bearing --
    # see docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose. `AgentJudgeCriterion` defaults to `max_turns: 50`,
    # and with an empty tool surface the judge's own system prompt still tells
    # it to reach for Bash and Read -- so a compliant judge can spend turns on
    # calls it cannot make. `task_timeout` wraps criteria checking, so a judge
    # that overruns cancels the replicate as a TIMEOUT rather than scoring it,
    # and a cancelled replicate shrinks the sample behind a reported mean. Two
    # turns is what a verdict takes: read the pre-attached transcript, call
    # `submit_verdict`. Five is margin, not budget.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must describe an ordered sequence of calls in which
      subscribing to the pull request's activity (`subscribe_pr_activity`, or
      plainly "subscribe to the PR's activity/events") happens ONCE, and
      BEFORE the first read of the checks (`pull_request_read` /
      "reading the check runs and status"). A sequence that reads the checks
      first and only subscribes afterward, or that never mentions
      subscribing at all, does not satisfy the rule.

      Score 1.0 if the REPLY names a one-time subscription step that
      precedes the first check read in the stated order.
      Score 0.0 if the reply reads the checks before subscribing, subscribes
      more than once per wait, or never mentions a subscription step.
