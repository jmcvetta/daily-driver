task_id: review-cycle-14-incomplete-verification
description: >-
  A review cycle remains incomplete while CI, findings, or required verification
  leave evidence incomplete.
tags: [review-cycle, behaviour, fire]
initial_prompt: >-
  A PR has a full review with findings at `aaa111`, but the fixes were pushed at
  `bbb222` and the independent fix-delta reviewer is unavailable. CI is green
  and the threads are resolved. Is the review round complete? Would the answer
  change if CI were pending, repeated corrections had failed to fix the same
  defect, the fixes materially changed scope, or this were a clean standalone
  review?

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Task]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash]
run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200
success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`review-cycle` fires for incomplete verification"
    expected_skill: review-cycle
    skill_name: review-cycle
  - type: agent_judge
    description: The reply rejects incomplete review evidence
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the reply after the last `[RESULT - …]` tag. Score 1.0 only when it
      says the review remains incomplete for unavailable verification, pending
      CI, evidenced non-convergence, or a material scope change awaiting its new
      full review. An unavailable reviewer alone is not non-convergence.
      A clean standalone review needs no invented delta pass. Preserve ordinary
      review records and do not publish a completion marker.
      Score 0.0 if it treats an unavailable pass as clear or claims green CI
      alone establishes completion. Otherwise score 0.5.
