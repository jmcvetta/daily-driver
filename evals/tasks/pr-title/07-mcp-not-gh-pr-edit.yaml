# This guards the reading, for issue #146's late requirement: `SKILL.md`
# never names a call at all for revising a title — it says only "the call
# that sets the title … differs by harness" and points at the reference
# files. `references/claude.md` is where the Claude Code call actually lives:
# "Revising the title of an existing pull request. `mcp__github__update_pull_request`
# with `title` set." `gh pr edit --title` is named in the OMP file and in
# `SKILL.md`'s own description only as the route "a harness that still
# reaches for them" takes — i.e. not this one. A row that passes without the
# reference file being read is wrong, so the graded content is the MCP call
# named specifically instead of the `gh` command a generic answer reaches for.
#
# What this row can and cannot see. The sandbox has no GitHub MCP (and no
# `gh` — the binary is not on the PATH here), so
# `mcp__github__update_pull_request` cannot actually be invoked. What is
# observable is what the agent says it would call, so the graded assertion is
# an `agent_judge` on the reply, plus the skill having fired at all. A positive
# check that the real MCP call went out needs a live pull request and the
# GitHub MCP, which is not a sandbox this harness can build.
#
# Why this fails the `without` arm: "fix the PR title" is one of the most
# common GitHub tasks there is, and a capable model with no plugin loaded
# answers it with `gh pr edit --title "…"` almost by reflex — that is the
# ordinary, well-known command. Nothing about general knowledge says this
# particular Claude Code session should instead reach for
# `mcp__github__update_pull_request`; that routing choice is this skill's own
# reference file's, and nowhere else's.

task_id: pr-title-07-mcp-not-gh-pr-edit
description: >-
  Fixing the title of an existing pull request on this harness is a named MCP
  call, not the generic `gh pr edit --title`.
tags: [pr-title, references, fire, behaviour, claude-only]

initial_prompt: >-
  The title on PR #14 doesn't follow our convention — fix it. Before you do,
  tell me the exact call you're going to make to change it.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`pr-title` fires on correcting the title of an existing pull request"
    expected_skill: pr-title
    skill_name: pr-title

  # The finding.
  - type: agent_judge
    description: The reply names update_pull_request, not gh pr edit --title
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # The empty tool surface and the permission mode are both load-bearing --
    # see docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose. `AgentJudgeCriterion` defaults to `max_turns: 50`,
    # and with an empty tool surface the judge's own system prompt still tells
    # it to reach for Bash and Read -- so a compliant judge can spend turns on
    # calls it cannot make. `task_timeout` wraps criteria checking, so a judge
    # that overruns cancels the replicate as a TIMEOUT rather than scoring it,
    # and a cancelled replicate shrinks the sample behind a reported mean. Two
    # turns is what a verdict takes: read the pre-attached transcript, call
    # `submit_verdict`. Five is margin, not budget.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: on this Claude Code session, the reply must name
      `mcp__github__update_pull_request` (or plainly "update_pull_request" /
      "the update-pull-request MCP call") with `title` set as the call it will
      make. It must not propose `gh pr edit --title` as the call it will
      actually run.

      Score 1.0 if the REPLY names `update_pull_request` with a title field
      as the call, and does not propose `gh pr edit` as the actual mechanism.
      Score 0.0 if the reply proposes `gh pr edit --title` (or bare `gh pr
      edit`) as what it will run, or names no specific call at all.
