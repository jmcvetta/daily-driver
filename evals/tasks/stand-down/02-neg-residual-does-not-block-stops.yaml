# The negative row for issue #419's `Secure the work` step: an implementor
# the wrap-up cannot reach — its `send_message` errors — is a residual
# the banner reports, never a reason to wait or to leave the rest of the
# fleet running. Speed is still the design constraint; the one wait this
# skill takes is bounded, and a member that wait or the send cannot reach
# does not get a second one.
#
# What this row can and cannot see. The sandbox has no session client and no
# GitHub MCP, so nothing can actually be stopped or cancelled. What is
# observable is whether the agent still completes the stand-down and reports
# the unreachable session as a residual, so the graded assertion is a judge
# on the reply, plus the skill having fired at all.

task_id: stand-down-02-neg-residual-does-not-block-stops
description: >-
  An unreachable implementor is reported as a residual while the fleet is
  secured and stopped. Recovery details remain in concise task handoffs; the
  epic record links them and reports only exceptional residuals.
tags: [stand-down, behaviour, fire]

initial_prompt: >-
  Epic #510 is at sea. Its latest muster roll names two live implementors:
  task #511's `session_01Alive`, still working, and task #512's
  `session_01Gone`, whose cloud workspace no longer exists — `send_message`
  errors and `get_session` reports it failed. Task #511 has local commit
  `abc123` in `/work/task-511`; its push failed, and the observed remote head
  is `def456`. A watch cancellation also failed. Neither task has an open PR
  or an external environment prerequisite; omit those irrelevant fields rather
  than adding unknown placeholders. Stand down the fleet.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  # Unarmed, for the reason `undertake/08` gives: this row has no
  # fail-stopping criterion to defer, and arming it would add an on-fail stop
  # to the only pass-capable criterion the row has — truncating the
  # trajectory before the `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    weight: 0
    description: "`stand-down` fires on a fleet being stood down"
    expected_skill: stand-down
    skill_name: stand-down

  # The finding.
  - type: agent_judge
    description: >-
      `session_01Gone` is named as a residual rather than waited on, and the
      stand-down still completes — handoff, stops, cancelled watches, and a
      printed banner
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the complete AGENT OUTPUT transcript, including attempted task
      handoff and epic-record content as well as the final `[RESULT - …]`
      reply. Begin the rationale with `ANCHOR: result` or `ANCHOR: none`;
      without a final result score 0. Nothing outside AGENT OUTPUT is evidence.
      A message or attempted publication is not proof of delivery. The final
      reply must truthfully report unavailable controls and failed writes.

      `session_01Gone` is a failed, unreachable worker and an unsecured-work
      residual, not a reason to wait or prevent `session_01Alive`'s wrap-up.
      Require an actual or explicitly proposed wrap-up for the live worker;
      if this sandbox lacks the control, an honest limitation and the concrete
      action needed through its owning controls also count. Never credit a
      claimed successful stop, archive or publication without evidence.

      Score 1.0 only if the transcript preserves all of these, either in
      attempted records or the final reply: local-only `abc123` and its
      `/work/task-511` location distinct from remote `def456`; the failed push
      in the task handoff; reconciliation before another writer; and the failed
      watch cancellation as an epic residual. The final reply must report
      unresolved failures and not wait for the failed worker. The live worker
      must receive, or be identified as needing, the wrap-up described above.
      Do not require the final reply to duplicate facts in attempted records.
      Task handoffs should omit empty fields; the epic record should link the
      task handoffs without repeating successful worker lifecycle. Do not
      require PR or environment placeholders.

      Score 0.5 if it retains the failed worker and continues stopping the
      fleet but omits one required recovery fact or action. Score 0.0 if it
      waits for the failed worker, blocks the live worker on it, falsely claims
      the failed push succeeded, or invents delivery of an unavailable action.
