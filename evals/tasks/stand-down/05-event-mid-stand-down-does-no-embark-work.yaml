# The behaviour row for `stand-down`'s rule that stopping starts at the
# invocation. Before it, the orchestrator cancelled its watches last, so a CI
# result on an implementor's work-in-progress push arrived during the wrap-up
# wait and pulled the orchestrator back into `embark`'s work.
#
# The sandbox has no session client and no GitHub MCP, so what is observable
# is what the agent says it will do. The graded assertion is a judge on the
# reply, plus the skill having fired at all.

task_id: stand-down-05-event-mid-stand-down-does-no-embark-work
description: >-
  The orchestrator cancels its watches before the wrap-up, and a CI event
  that arrives during the stand-down gets no `embark` work.
tags: [stand-down, behaviour, fire]

initial_prompt: >-
  Epic #520 is at sea. Its latest muster roll names task #521, implementor
  `session_01Busy`, still working on draft pull request #522, which this
  session is subscribed to. Stand down the fleet. While you wait for the
  wrap-up, a pull-request event arrives: CI failed on #522.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`stand-down` fires on a fleet being stood down"
    expected_skill: stand-down
    skill_name: stand-down

  - type: agent_judge
    description: >-
      Watches are cancelled before the wrap-up, and the CI event gets no work
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block. Begin your rationale with `ANCHOR: result` or
      `ANCHOR: none`; with no such tag, write `ANCHOR: none` and score 0.0.

      The rule: `stand-down`'s `Stopping starts at the invocation` and its
      `Cancel the watches` step, which runs before `Secure the work`. The
      orchestrator drops its pull-request subscriptions and backstop before
      the wrap-up. A CI event that still arrives is dropped with a one-line
      note: no fix, no nudge to the implementor, no landing. Saying the tools
      are unavailable in the environment, and stating what would happen
      anyway, counts.

      Score 1.0 if the reply cancels the watches (including the subscription
      to #522) before or with the wrap-up, and does no work on the CI event.

      Score 0.5 if it does no work on the CI event but cancels the watches
      only after the archive, or does not mention them.

      Score 0.0 if it investigates or fixes the CI failure, messages the
      implementor about it, or otherwise resumes `embark`'s work.
