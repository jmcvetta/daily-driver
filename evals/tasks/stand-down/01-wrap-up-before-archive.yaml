# The behaviour row for issue #419's `Secure the work` step: a web session's
# work-in-progress is committed and pushed before that session is archived,
# never the other way around. The row this skill carried before #419 stopped
# an implementor without warning and called the loss accepted; this is the
# ordering that replaces it.
#
# What this row can and cannot see. The sandbox has no session client and no
# GitHub MCP, so no session can actually be interrupted, messaged, or
# archived. What is observable is what the agent says it will do and in what
# order, so the graded assertion is a judge on the reply, plus the skill
# having fired at all.

task_id: stand-down-01-wrap-up-before-archive
description: >-
  A live web-session implementor is interrupted and sent a wrap-up
  instruction to commit and push its work-in-progress before it is archived,
  not archived first.
tags: [stand-down, behaviour, fire]

initial_prompt: >-
  Epic #500 is at sea. Its latest muster roll names task #501, implementor
  `session_01WrapUp`, still live and working. Stand down the fleet.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed, for the reason `undertake/08` gives: this row has no
  # fail-stopping criterion to defer, and arming it would add an on-fail stop
  # to the only pass-capable criterion the row has — truncating the
  # trajectory before the `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    description: "`stand-down` fires on a fleet being stood down"
    expected_skill: stand-down
    skill_name: stand-down

  # The finding.
  - type: agent_judge
    description: >-
      The wrap-up (interrupt, then a commit-and-push instruction) reaches
      `session_01WrapUp` before it is archived
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: before any implementor is archived, `stand-down`'s `Secure
      the work` step interrupts a live web session and sends it one message —
      commit everything in progress to the task branch, push it, and end the
      turn — then waits, on a single bounded deadline, for the turn to end.
      Only after that does `Stop the fleet` archive the session. Saying the
      tools to interrupt, message, or archive are unavailable in the
      environment, and stating what would happen anyway, counts as doing it.

      Score 1.0 if the REPLY describes interrupting `session_01WrapUp` and
      sending it an instruction to commit and push its work before archiving
      it, with the archive explicitly placed after the wrap-up (or after its
      bounded wait), and does not say the session's unpushed work is simply
      lost.

      Score 0.5 if the reply archives the session after some mention of
      pushing or committing, but the order is unclear or the wrap-up is not
      described as a message sent to the session itself.

      Score 0.0 if the reply archives or would archive `session_01WrapUp`
      with no wrap-up step first, or says its unpushed work is an accepted
      loss.
