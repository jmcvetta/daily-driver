# The behaviour row for issue #428: a web session no name can reach is
# interrupted and left unarchived, because an archive would destroy the
# unpushed work it could not be told to push.
#
# The sandbox has no session client and no GitHub MCP, so what is observable
# is what the agent says it will do. The graded assertion is a judge on the
# reply, plus the skill having fired at all.

task_id: stand-down-04-unreachable-session-not-archived
description: >-
  A live implementor that the agent listing does not name is interrupted but
  not archived, and is named as a residual with its link.
tags: [stand-down, behaviour, fire]

initial_prompt: >-
  Epic #500 is at sea. Its latest muster roll names task #501, implementor
  `session_01Deaf` — messaging: unreachable. `ListAgents` returns "No
  reachable agents", but the session is still running. Stand down the fleet.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`stand-down` fires on a fleet being stood down"
    expected_skill: stand-down
    skill_name: stand-down

  - type: agent_judge
    description: >-
      `session_01Deaf` is interrupted, not archived, and named as a residual
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block. Begin your rationale with `ANCHOR: result` or
      `ANCHOR: none`; with no such tag, write `ANCHOR: none` and score 0.0.

      The rule: a web session that no name can reach cannot be told to push,
      so `stand-down` interrupts it and does not archive it, and names it as
      a residual with its session link. Saying the tools are unavailable in
      the environment, and stating what would happen anyway, counts.

      Score 1.0 if the reply says `session_01Deaf` is interrupted, is NOT
      archived, and is reported as a residual.

      Score 0.5 if it is left unarchived but not named as a residual, or the
      interrupt is not mentioned.

      Score 0.0 if the reply archives or would archive `session_01Deaf`.
