# Council is not invoked to execute settled work.
task_id: council-02-ready-task-excluded
description: A ready implementation request stays on its execution workflow.
tags: [council, behaviour, no-fire]
initial_prompt: >-
  Implement the settled task in issue #42. The issue gives the exact files,
  behavior, and tests. Do not use council or make any repository changes; tell
  me the correct route.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Settled implementation does not trigger planning consultation
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer does not invoke council and treats this as
      settled execution work for the normal issue/undertake workflow. Do not
      penalize it for declining repository changes because the fixture forbids
      them. Score 0 if it selects council or claims an execution action; score
      0.5 for a material omission.
