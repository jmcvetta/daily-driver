# Scenario agreement alone must not promote or dispatch unready staged work.
task_id: epic-08-discovery-promotion
description: Discovery preserves lineage and uses ordinary promotion gates.
tags: [epic, discovery, behaviour, fire]
initial_prompt: >-
  Use epic: parent #10 is a discovery with two completed research children and
  an interactive specification child. The operator agrees to scenarios for an
  implementation child, whose task branch and handoff are recorded but not
  merged. How do we promote without losing parent identity? Explain only; do
  not write or claim external actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Promotion follows complete staging and verification
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer retains parent #10 and lineage, agrees scope
      and decomposition, stages ready assignable children, verifies readiness,
      references, parent and blocked-by edges and sequencing, and promotes
      discovery to epic only after ordinary gates pass. Staged tasks cannot
      dispatch while the parent is discovery; each behavioral child needing
      interactive scenario agreement must complete that activity and have its
      issue and handoff ready before unattended dispatch. Scenario files need
      not merge before promotion and no scenario SHA or requirement IDs are
      pinned for promotion. Score 0 for promotion solely on scenario agreement,
      premature task dispatch, or a merged-scenario prerequisite; otherwise
      0.5 for a material omission.
