task_id: epic-07-mixed-child-kind-contracts
description: >-
  A mixed-kind decomposition preserves the epic format and gives each child
  its own body contract without imposing task metadata on other kinds.
tags: [epic, behaviour, fire]

initial_prompt: |
  Please draft an update to the agreed epic and all three child issues. The
  epic issue already opens with this quatrain:

  *The questions cross the morning rain,*
  *The answers find the shore;*
  *The tasks return with clear refrain,*
  *Then guide what follows more.*

  Child A is a settled code change: expose the already-decided retry limit
  in the configuration file. Child B asks whether the audit log must include
  denied requests; the compliance rule is not known and a bounded review of
  the existing policy documents should answer it. Child C is a release owner
  approval that agents cannot provide. Show me the proposed epic and child
  bodies without posting them.

  Also describe the result of this offline graph operation: the agreed
  parent repo/plan#10 includes repo/app#11 and repo/app#12; #11 is not
  ready because a product decision remains open, while #12 is ready.
  The #11 parent edge was written and verified from both ends; the #12 write
  failed. Report this operation once, without claiming the failed edge exists
  or dispatching either child. Do not perform live tracker operations.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`epic` and child body contract skills fire for mixed-kind decomposition"
    expected_skill: epic
    skill_name: epic

  - type: agent_judge
    description: Mixed child bodies use each kind's contract and preserve epic completion gate
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the final reply. Begin rationale with `ANCHOR: result` or
      `ANCHOR: none`; score 0 if no final result exists. The epic must retain
      the supplied four-line ballad quatrain verbatim, an outcome and
      justification, relevant scheduling constraints, and a concise end-state
      brief; it must not copy
      child progress checklists. Where the epic has nontrivial components,
      flow, state, or data movement, the Human brief
      should include one Mermaid diagram revealing that structure, but the
      diagram is optional and must not be demanded for trivial or purely
      prose-clear work; no decorative or duplicate diagrams, progress
      checklists, or a second hand-maintained dependency record, and the
      diagram must not replace the textual acceptance criteria or the
      dependency graph. With no blocked-by edges, do not invent a dependency
      or require a maintained wave list.
      The settled code child is a task with an ordinary model class and settled
      acceptance. The question child is research with purpose, bounded source
      scope, evaluation and answer deliverable, not an assumed compliance
      answer or task template. A research child may carry a valid model class;
      it needs one before dispatch, not before membership. The reserved approval
      is a human child with safe action evidence, not agent work or a class.
      Epic completion requires
      evidence for the coordinated outcome; closed children alone, a canceled
      child, or inconclusive research do not suffice.
      The graph operation must have one concise report naming both repository-
      qualified ends of the verified #10 → #11 edge, its membership evidence,
      and the failed #10 → #12 write. It must not claim both writes succeeded,
      suppress #11 because it is unready, invent a blocker or user approval,
      or dispatch during authoring.
      Score 1.0 if these distinctions hold, 0.5 for a mostly correct
      decomposition with a material omission, and 0.0 if task format/classes
      spread to all children or closure is treated as success by itself.