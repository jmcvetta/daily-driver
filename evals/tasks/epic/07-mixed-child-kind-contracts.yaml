task_id: epic-07-mixed-child-kind-contracts
description: >-
  A mixed-kind decomposition preserves the epic format and gives each child
  its own body contract without imposing task metadata on other kinds.
tags: [epic, behaviour, fire]

initial_prompt: >-
  This agreed work needs three independently reviewable outcomes, so plan an
  epic and show the bodies for the epic and its children without posting.
  Child A is a settled code change: expose the already-decided retry limit in
  the configuration file. Child B asks whether the audit log must include
  denied requests; the compliance rule is not known and a bounded review of the
  existing policy documents should answer it. Child C is a release owner
  approval that agents cannot provide. Keep the existing epic quatrain and
  exactly Summary, Justification, and Sequencing sections. Assign task,
  research, and human kinds respectively. The task's model class is
  `implementation`; do not invent a class for the other children. State that
  the epic is complete only when its coordinated outcome is evidenced, not
  merely when every child is closed.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 12
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`epic` and child body contract skills fire for mixed-kind decomposition"
    expected_skill: epic
    skill_name: epic

  - type: agent_judge
    description: Mixed child bodies use each kind's contract and preserve epic completion gate
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the final reply. Begin rationale with `ANCHOR: result` or
      `ANCHOR: none`; score 0 if no final result exists. The epic must retain a
      ballad quatrain, exactly the three required sections, a concise end-state
      Summary and graph-derived sequencing; it must not copy child progress
      checklists. The settled code child is a task with an implementation class
      and settled acceptance. The question child is research with purpose,
      bounded source scope, evaluation and answer deliverable, not an assumed
      compliance answer or task class. The reserved approval is a human child
      with safe action evidence, not agent work or a class. The reply must not
      require Model class metadata on the research or human child. Epic
      completion requires evidence for the coordinated outcome; closed children
      alone, a canceled child, or inconclusive research do not suffice. Score
      1.0 if these distinctions hold, 0.5 for a mostly correct decomposition
      with a material omission, and 0.0 if task format/classes spread to all
      children or closure is treated as success by itself.