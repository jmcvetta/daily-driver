# An amendment must not silently change active implementation contracts.
task_id: epic-09-substantive-amendment
description: Demote and reconcile a specification-backed epic for substantive amendment.
tags: [epic, discovery, behaviour, fire]
initial_prompt: >-
  Use epic: a promoted specification-backed epic has running implementation
  for two independent requirements. The operator proposes changing only one
  requirement. Describe the amendment lifecycle; explain only and do not
  perform external actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Same-parent demotion and scoped reconciliation
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer demotes the same parent to discovery, preserves
      lineage, pauses affected work while allowing independent active work,
      requires interactive amendment and renewed operator approval and merge,
      reconciles allocations and contracts to the exact merged SHA with original
      user authority for material amendments, verifies graph and readiness, then
      atomically re-promotes. Score 0 for silent adoption; otherwise 0.5.
