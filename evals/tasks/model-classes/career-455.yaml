initial_prompt: "This is jmcvetta/career, checked out at a past commit. Implement the change the issue below describes. Work from this checkout and the issue text alone: do not fetch from jmcvetta/career, and do not look it up on GitHub.\n\n# Split the infra CI leg by what each step reads, so a Makefile edit stops provisioning OpenTofu\n\nThe `infra` job runs four unrelated checks under one filter, so a change to `.github/**`, `Makefile` or `tests/**` provisions OpenTofu and runs every suite in the leg.\n\n*A Makefile edit*\n*provisions OpenTofu —*\n*nothing asked it to.*\n\n## Summary\n\n`infra` is not one suite. It validates the release-please config, installs OpenTofu and validates the stack, and runs five pytest files covering the workflow wiring, the release-delta script, the session hooks, the kokoro selector script and the coverage-comment script. Its paths-filter is the union of everything those read, so any one input starts all of them.\n\nThe expensive part is the one with the narrowest real inputs: nothing but `infra/github/**` and its `.opentofu-version` feeds the Tofu steps, yet they download a toolchain and a provider whenever the Makefile changes. This is the failure CLAUDE.md already records — *`config` was two unrelated suites sharing a job, so its filter was the union of their inputs and a `CLAUDE.md` typo provisioned OpenTofu* — recurring inside the job that split produced.\n\n## Model class\n\n`standard`\n\nThe design and contracts are settled; implementation requires routine multi-file changes and test updates.\n\n## Detail\n\n### What runs today\n\n`.github/workflows/test.yml`, job `infra`, gated on `needs.detect-changes.outputs.infra`:\n\n1. `make check-release-config` — validates `release-please-config.json` against the upstream schema.\n2. `opentofu/setup-opentofu` plus `make check-infra` — `tofu fmt`/`validate` over `infra/github/**`, preceded by reading `infra/github/.opentofu-version`.\n3. `make test-python-infra` — `uv run pytest` over `tests/test_infra_github.py`, `tests/test_release_delta.py`, `tests/test_session_hooks.py`, `tests/test_kokoro_select.py`, `tests/test_coverage_comment_body.py`.\n\nThe `infra` filter is their union: `.github/**`, `.claude/hooks/**`, `.claude/settings.json`, `infra/github/**`, `agent-cli/bin/**`, `agent-cli/scripts/**`, `release-please-config.json`, `.release-please-manifest.json`, the five `package.json` files, the three kokoro `pyproject.toml` files, `tests/**`, `conftest.py`, `pytest.ini`, `viewer/pyproject.toml`, `viewer/uv.lock`, `Makefile`.\n\n### The change\n\nSplit the job by what each step reads, and give each new job its own filter naming only those inputs.\n\n- **The Tofu check gets its own job and filter** — `infra/github/**` alone. It is the only step that installs a toolchain, and it is the only one whose inputs are unambiguous. This part is settled: make this cut whether or not the rest is worth making.\n- **The remaining steps group by the inputs their suites actually read.** Derive each suite's inputs from what the test file opens, the way the existing filters were derived, rather than from where the file sits. `test_infra_github.py` reads `.github/**` and `infra/github/main.tf`; `test_session_hooks.py` reads `.claude/hooks/**` and `.claude/settings.json`; `test_kokoro_select.py` reads the selector script; `test_coverage_comment_body.py` reads `.github/scripts/coverage-comment-body.sh`; `test_release_delta.py` reads `.github/scripts/release-delta.sh` and the manifest. Where two suites share their inputs, they share a job — a job per test file pays a runner start-up each and is not the goal.\n- **`Makefile` and `tests/**` stay inputs only where a suite genuinely reads them.** They are what makes the current filter fire on this epic's every pull request.\n- **`.release-please-manifest.json` stays an input to whichever job carries `test_infra_github.py`**, deliberately, per CLAUDE.md: a hand-edited manifest on an ordinary branch must still run the key-agreement check.\n\n### Scope\n\n- `.github/workflows/test.yml` — the `detect-changes` filter table and the `infra` job.\n- `infra/github/main.tf` and `tests/test_infra_github.py` where a required context changes. **A required context is half of a pair spanning two files**, so a renamed or added job that is required must be updated in both, or the pull request blocks forever on a check nothing reports.\n- `Makefile` only if a target is split to match; prefer leaving the targets alone and changing what the workflow invokes.\n- Not the `boundary`, `kokoro`, `corpus` or TypeScript filters.\n- Not the question of whether CI should invoke `make` at all — that is #451.\n\n### Settled design\n\n- **`CI Success` gates the new jobs.** Every new leg is named in its `needs`, its `env` and its results array — the three places `tests/test_infra_github.py` asserts — because a leg wired into `needs` alone is waited for and then ignored.\n- **The required context stays the rollup**, never a new leg, so a skipped leg still passes.\n- **Exclusions stay inside a single pattern** as the extglob form the existing filters use; a sibling `!` entry does not subtract under the action's default quantifier.\n\n### Acceptance and verification\n\n- A pull request touching only `Makefile` does not start the Tofu steps.\n- A pull request touching only `infra/github/**` does start them.\n- A pull request touching only `.claude/hooks/**` runs the session-hook suite and not the release-delta or selector suites.\n- `make test-python-infra` still runs every one of the five files locally, so a contributor's one command is unchanged.\n- `tests/test_infra_github.py` passes, including its rollup-wiring and required-context assertions, and gains a case per new job.\n- CI green on the pull request itself, which by construction exercises the filter being changed.\n"

