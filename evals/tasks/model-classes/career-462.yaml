initial_prompt: "This is jmcvetta/career, checked out at a past commit. Implement the change the issue below describes. Work from this checkout and the issue text alone: do not fetch from jmcvetta/career, and do not look it up on GitHub.\n\n# Rename Projected Releases CI job to projection\n\nThe Projected Releases check appears as `Projected Releases / projection` instead of `Projected Releases / project`.\n\n*One name shifts today*\n*Projection states its purpose*\n*Checks speak what they mean*\n\n## Summary\n\nRename the Projected Releases workflow job from `project` to `projection`. The repository already defines the operation as a projection, and the action step uses `projection`; the current check name is the remaining inconsistent term.\n\nThis is a naming-only change. Workflow behavior and release projection results remain unchanged.\n\n## Model class\n\n`mechanical`\n\nThe transformation is explicit, the affected references are identified, and the existing infrastructure test directly checks the workflow job.\n\n## Detail\n\n### Scope\n\n- Rename the job key in `.github/workflows/projected-releases.yml` from `project` to `projection`.\n- Update `tests/test_infra_github.py::test_projected_releases_skips_release_prs` to read `workflow[\"jobs\"][\"projection\"]` while preserving its release-branch guard assertions.\n- Update both records of the check name in `CLAUDE.md` from `Projected Releases / project` to `Projected Releases / projection`.\n\nDo not change workflow triggers, concurrency, permissions, conditions, steps, the `projection` step ID, or the `jmcvetta/projected-releases-action@v0` reference. Do not make the advisory check required.\n\n### Acceptance\n\n- GitHub reports the workflow check as `Projected Releases / projection`.\n- The renamed job retains the existing configuration and release-please branch guard.\n- No stale `Projected Releases / project` check name or `jobs[\"project\"]` lookup remains.\n- The existing infrastructure and repository-memory checks pass in CI; no new test is needed because the current workflow test covers the affected job and guard.\n"

success_criteria:
  - type: run_command
    description: No test file present at the base SHA was deleted
    command: bash .fixture/check-no-deleted.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: No skip or xfail marker was added to a test file
    command: bash .fixture/check-no-skip.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: The pull request's own tests pass after applying tests.patch
    command: bash .fixture/apply-tests.sh && cd viewer && uv run pytest ../tests/test_infra_github.py
    timeout: 720
    weight: 3
