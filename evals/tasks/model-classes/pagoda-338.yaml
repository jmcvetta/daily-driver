task_id: model-classes-pagoda-338
description: >-
  Green-Pagoda/pagoda#338: fix(usd2oz-web): say "calculator" in the methodology back link
tags: [model-classes, class:mechanical, smoke]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/model-classes/shared
      mount_point: .fixture
    - type: template_dir
      path: ../../fixtures/model-classes/cases/pagoda-338
      mount_point: .fixture

pre_run:
  - command: bash .fixture/case.sh
    timeout: 120

agent:
  type: omp
  allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]

run_limits:
  max_turns: 30
  task_timeout: 780
  turn_timeout: 660

initial_prompt: >-
  This is Green-Pagoda/pagoda, checked out at its state before pull request #338. Implement the change described by issue #337 (title: 'fix(usd2oz-web): say "calculator" in the methodology back link').

success_criteria:
  - type: run_command
    description: No test file present at the base SHA was deleted
    command: bash .fixture/check-no-deleted.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: No skip or xfail marker was added to a test file
    command: bash .fixture/check-no-skip.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: The pull request's own tests pass after applying tests.patch
    command: git apply --whitespace=nowarn .fixture/tests.patch && pnpm install --frozen-lockfile --filter @pagoda/usd2oz-web... && pnpm --filter @pagoda/usd2oz-web exec vitest run src/shell.test.ts
    timeout: 720
    weight: 3
