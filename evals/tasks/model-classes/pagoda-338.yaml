task_id: model-classes-pagoda-338
description: >-
  Green-Pagoda/pagoda#338: fix(usd2oz-web): say "calculator" in the methodology back link
tags: [model-classes, class:mechanical, smoke]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/model-classes/shared
      mount_point: .fixture

# The answer key. coder_eval stages it outside the sandbox and names it in
# REFERENCE_DIR for the criteria alone, so the agent cannot find it in its tree.
reference:
  directory: ../../fixtures/model-classes/cases/pagoda-338

pre_run:
  - command: bash .fixture/clone-base.sh Green-Pagoda/pagoda 7eb6d254230e28036ed4a4f57adbd1eff67a0c3c
    timeout: 120

agent:
  allowed_tools: [Bash, Read, Write, Edit, Grep, Glob]

run_limits:
  max_turns: 30
  task_timeout: 780
  turn_timeout: 660

initial_prompt: "This is Green-Pagoda/pagoda, checked out at a past commit. Implement the change the issue below describes. Work from this checkout and the issue text alone: do not fetch from Green-Pagoda/pagoda, and do not look it up on GitHub.\n\n# Methodology page footer link should say \"back to calculator\"\n\nThe footer link at the bottom of the usd2oz methodology page reads \"← Back to the converter\". It should read \"back to calculator\" instead.\n\n`apps/usd2oz-web/src/pages/methodology.astro:125`\n\n**Definition of done:** the methodology page footer link text says \"Back to the calculator\".\n"

success_criteria:
  - type: run_command
    description: No test file present at the base SHA was deleted
    command: bash .fixture/check-no-deleted.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: No skip or xfail marker was added to a test file
    command: bash .fixture/check-no-skip.sh
    timeout: 30
    weight: 1

  - type: run_command
    description: The pull request's own tests pass after applying tests.patch
    command: bash .fixture/apply-tests.sh && pnpm install --frozen-lockfile --filter @pagoda/usd2oz-web... && pnpm --filter @pagoda/usd2oz-web exec vitest run src/shell.test.ts
    timeout: 720
    weight: 3
