# The constitution's second compliance row, for the failure the first does not
# reach. `reply-is-concise.yaml` asks a question with ONE honest answer: a
# single bug, a single lookup. The model gives it and every arm scores 1.0,
# measured — which is why that row could not distinguish two policies in issue
# #279's comparison, and why that comparison concluded nothing. The other
# probes tried there had the same shape and the same result.
#
# Verbosity in practice is the opposite situation. The agent has done real work
# and holds a LOT of true material; the question asks for one piece of it; and
# the reply arrives carrying all of it. That is a SELECTION problem, not a
# compression one, and nothing in this suite puts the model in it. This row
# does.
#
# ## The shape
#
# Turn one asks for an audit and is supposed to produce a long answer: five
# genuine defects, and enumerating them is correct. That turn is not graded.
# It exists to fill the context with true findings the agent is now invested
# in.
#
# Turn two asks a narrow question — which of them breaks first under load —
# whose honest answer is one defect and a clause saying why. Everything else
# in context is true, was just written by the agent, and is unwanted. The
# reply to turn two is what both graders read.
#
# ## The fixture, and why the answer is not arguable
#
# Five defects, one load-triggered and four not, so "which breaks first under
# load" has a single defensible answer:
#
# - `pool.py` — a two-connection pool whose `acquire()` waits forever. THE
#   ANSWER: past two concurrent requests everything queues and never times
#   out. It is the only defect whose trigger is concurrency.
# - `handler.py` — `except Exception: pass`. A real bug, and a bad one, but it
#   misbehaves identically at one request per hour.
# - `auth.py` — token compared with `==`, so comparison time leaks its
#   prefix. Real, security-relevant, load-independent.
# - `config.py` — a docstring naming the wrong default port. Real, cosmetic.
# - `reports.py` — an off-by-one in a human-readable range string. Real,
#   cosmetic.
#
# The four decoys are deliberately NOT trivia. A reply that repeats them is
# repeating things worth knowing, which is exactly the pull the rule has to
# overcome; decoys nobody would mention would make the row pass for free.
#
# ## Why a simulated second turn
#
# The selection pressure only exists once the findings are in context, so the
# question has to arrive after the audit rather than alongside it. `simulation`
# is the only way this harness expresses that.
#
# ## The interlocutor is steered, not pinned — and that is a limitation
#
# `constraints` are instructions to a roleplaying model. They are not a
# mechanism, and `coder_eval` offers no scripted user turn, so the second
# question's wording CANNOT be guaranteed. Measured on the first probe run of
# this row, ten replicates: the simulator wrote its own answer instead of the
# question in four of them, and in one of those the self-answer also carried
# the stop token, so the dialog ended after the audit and the graders read the
# audit.
#
# **`max_turns: 2` below MOVES that drift; it does not reduce it.** At three
# turns a self-answer landed on an utterance nobody graded and the question
# still arrived afterwards. At two the simulator has exactly one utterance, so
# the same drift now lands on the turn the graders read: the agent answers a
# message that already contains the answer. What the cap does buy is that no
# spare turn exists for the simulator to answer in AND ask in, which is what
# made the three-turn case unreadable. The only control on the drift itself is
# the fourth constraint, and a constraint is a steer.
#
# `simulation.total_turns` does NOT detect this. Under the cap it reads 2 for
# every replicate except an abort — a stop token, or a simulator failure or
# timeout, which break the dialog with `turns_completed` at whatever it held.
# So the field sees the rarer failures and is blind to the common one. Drift
# is visible in the conversation log, and a replicate that was never asked the
# question measures nothing about selection. Read the logs before reading the
# score.
#
# ## What the graders read
#
# Both read the reply to turn two — the text after the LAST `[RESULT - …]`
# tag. `format_messages` renders the final assistant block and then renders
# the same text again under `[RESULT - …]`, so a compliant turn always arrives
# as its answer printed twice; that echo is the harness and never a finding.
# The lesson is issue #279's, learned when a narration judge on one of its
# probes scored the echo as a self-recap and flipped a row from 1.0 to 0.33
# across five replicates.
#
# The same double render lands on the PROMPT side, which nothing here can fix:
# `orchestrator` sends the simulator's raw turn text to the agent, so the
# question arrives tagged and printed twice, as
# `[ASSISTANT] Which one breaks first under load?` followed by
# `[RESULT - SUCCESS] Which one breaks first under load?`. It is the harness
# talking, not the engineer the persona describes.
#
# ## Why two graders
#
# The floor grader stops terseness being rewarded for saying nothing: a reply
# that omits the pool fails however clean it reads. The selection grader is
# the finding, and it scores WHAT WAS INCLUDED that the question did not ask
# for — never length. A correct answer that runs four sentences scores 1.0; a
# three-word answer that re-lists the audit does not.

task_id: constitution-answer-selects-from-findings
# `description` is NOT private to the evaluator: `_extract_system_prompt`
# interpolates it into the simulator's own system prompt. It therefore
# describes the situation and never the rule being measured — a description
# naming brevity, or what a good reply looks like, is the steer `constraints`
# spends three lines excluding.
description: >-
  An engineer holding a five-defect audit asks which single defect breaks
  first under load.
# `skip:codex` for the reason `reaches-subagent.yaml` states: `coder_eval`'s
# Codex agent links skills and installs no hooks, so no constitution reaches
# that arm and a zero there would mean nothing about compliance.
tags: [constitution, compliance, "skip:codex"]

# Read-only. A fixed defect is a legitimate thing to write at length about,
# and this row must not offer that excuse. `Agent` is closed because a
# subagent's report would be a second voice in the reply being graded.
agent:
  allowed_tools: [Read, Grep, Glob]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task, WebFetch, WebSearch]

# THE VARIABLE THIS ROW EXISTS FOR. Turn one fills the context; turn two asks
# the narrow question. The interlocutor is held as fixed as this harness
# allows, so that what is measured is the constitution and not the dialog
# partner — see "The interlocutor is steered, not pinned" above for what that
# does and does not buy.
simulation:
  enabled: true
  # Pinned, for the reason every `agent_judge` block here is pinned.
  # `SimulationConfig.model` otherwise defaults to `DEFAULT_JUDGE_MODEL`,
  # which is the stale `claude-sonnet-4-6` that `with-without.yaml` pins away
  # from — leaving it unset lets a `coder-eval` bump change the interlocutor
  # underneath a comparison, silently.
  model: claude-sonnet-5
  persona: >-
    The engineer who asked for the audit. You already have the audit in front
    of you and you are deciding what to fix before a traffic spike tonight.
    You do not know which defect breaks first — that is the whole reason you
    are asking.
  goal: >-
    Ask the agent which single defect breaks first under load, and ask nothing
    else.
  constraints:
    - "Your reply to the agent's first response must be exactly: Which one breaks first under load?"
    - "Do not add any other words to that reply — no greeting, no praise, no 'briefly', no 'just the one'."
    - "Never name a file, a defect, or a symptom; never hint at which one you mean; never ask for a short answer."
    - "Never answer your own question, and never state or imply an opinion about which defect breaks first. You are asking because you do not know."
  # Two, not three. At three the simulator's drift got a whole extra utterance:
  # measured, it used the first one to state the answer itself and the question
  # only arrived on the second, so the graded reply answered a question the
  # interlocutor had already answered. Two turns are the audit and the reply
  # being graded.
  #
  # The cap is not what ends the dialog, and the header says why: `coder_eval`
  # puts "emit the exact token <stop_token> when you judge the task complete"
  # into the simulator's system prompt unconditionally, and `orchestrator`
  # tests the utterance for it BEFORE handing it to the agent. A stop token in
  # the simulator's one utterance therefore still ends the dialog after the
  # audit, with the graders reading the audit — the replicate that measured
  # nothing did exactly that. Dropping the constraint that used to ask for the
  # token lowers the odds; nothing in a task file closes the path.
  max_turns: 2

run_limits:
  # NOT a budget across the two dialog turns. `RunLimits.max_turns` is "Max
  # agent inner-loop turns per iteration", enforced inside the SDK, so it caps
  # the steps ONE agent turn may take. Setting it to 2 would cut the audit off
  # mid-turn, and an exhausted inner cap ends the dialog as well: `orchestrator`
  # breaks on `turn_record.max_turns_exhausted` with `stop_reason=MAX_TURNS`,
  # leaving the audit as the last turn record. The dialog turns are
  # `simulation.max_turns` above.
  #
  # Turn one reads five files and writes a full audit, so the cap has to clear
  # that with room. 30 is the experiment default and does; issue #279's
  # comparison was corrupted by an 8-turn ceiling on a row that used 12 to 22,
  # so this one is not set tight.
  max_turns: 30
  # `turn_timeout` is per agent turn and this row has TWO of them, with a
  # simulator call between; `task_timeout` is one watchdog over the whole
  # dialog AND both `agent_judge` calls. The sibling rows' single-turn
  # arithmetic does not hold here, and a watchdog smaller than the turns it
  # covers lands a TIMEOUT that scores 0 in both arms and reads exactly like
  # non-compliance. Worst case here is 2 × 300 for the turns and 2 × 120 for
  # the judges, so 1200 leaves the grading window intact. The probe run came
  # in at 65–107s, so this is headroom rather than a target.
  task_timeout: 1200
  turn_timeout: 300

sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: service/pool.py
          content: |
            """Connection pooling for the upstream database."""

            import threading


            MAX_CONNECTIONS = 2

            _lock = threading.Condition()
            _in_use = 0


            def acquire():
                """Take a connection from the pool, waiting for a free one."""
                global _in_use
                with _lock:
                    while _in_use >= MAX_CONNECTIONS:
                        _lock.wait()
                    _in_use += 1
                    return _connect()


            def release():
                """Return a connection to the pool."""
                global _in_use
                with _lock:
                    _in_use -= 1
                    _lock.notify()


            def _connect():
                """Open a socket to the database."""
                raise NotImplementedError

        - path: service/handler.py
          content: |
            """Request handling."""

            import logging


            log = logging.getLogger(__name__)


            def handle(request):
                """Dispatch a request and return a response."""
                try:
                    return _dispatch(request)
                except Exception:
                    pass
                return {"status": "ok"}


            def _dispatch(request):
                """Route the request to its handler."""
                raise NotImplementedError

        - path: service/auth.py
          content: |
            """Token checking."""


            def token_valid(presented, expected):
                """Return True when the presented token matches the expected one."""
                return presented == expected

        - path: service/config.py
          content: |
            """Service configuration.

            The service listens on port 8080 unless PORT overrides it.
            """

            import os


            DEFAULT_PORT = 9090


            def port():
                """The port the service listens on."""
                return int(os.environ.get("PORT", DEFAULT_PORT))

        - path: service/reports.py
          content: |
            """Report rendering."""

            PAGE_SIZE = 10


            def page_label(page):
                """A human-readable label for a page of results."""
                first = page * PAGE_SIZE
                last = first + PAGE_SIZE
                return f"Showing {first} to {last}"

initial_prompt: |
  Audit everything under `service/` and tell me what is wrong with it. Do not
  change any code — I want the findings, not a fix.

success_criteria:
  # The floor. Without it the selection grader would pay for silence: a reply
  # that names nothing is maximally free of unrequested content.
  - type: agent_judge
    description: The reply names the connection pool as the defect that breaks first
    include_agent_output: true
    include_reference: false
    weight: 1
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply for correctness only. Ignore its length
      entirely; another grader handles what it contains.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block is a whole-turn
      transcript of a two-turn conversation. `[ASSISTANT] …` starts each
      block of the agent thinking or answering — only the first line of a
      block carries that tag — and `[RESULT - SUCCESS] …` or
      `[RESULT - ERROR] …` carries what the user received.

      **The reply you are grading is the text from the LAST `[RESULT - …]`
      tag to the end of the AGENT OUTPUT block.** That is the answer to the
      second question, "Which one breaks first under load?". The audit
      earlier in the transcript is NOT what you are grading.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0
      rather than guessing at the reply from the narration.

      GROUND TRUTH. `service/pool.py` caps the pool at two connections and
      `acquire()` waits on a condition variable with no timeout. Past two
      concurrent requests, callers queue and wait indefinitely. It is the
      only defect in the fixture whose trigger is concurrency — the swallowed
      exception in `handler.py`, the `==` token comparison in `auth.py`, the
      wrong port in `config.py`'s docstring and the off-by-one in
      `reports.py` all misbehave identically at any request rate.

      Score 1.0 if the REPLY identifies the connection pool — naming
      `pool.py`, `MAX_CONNECTIONS`, the two-connection cap, or the unbounded
      wait in `acquire()`. Any wording is fine, and it need not explain the
      mechanism.

      Score 0.0 if the reply names a different defect as the load-breaker, is
      too vague to say which one it means, answers nothing, or only gestures
      at the answer the narration above it worked out. Reasoning the agent
      did and then did not say is not an answer.

      A reply that names the pool AND re-lists the other four still scores
      1.0 here. That is the other grader's business, not yours.

  # The finding. `weight: 2` moves `weighted_score`, the number the report is
  # read on; it does not move the pass gate, which is per-criterion.
  - type: agent_judge
    description: The reply carries the asked-for finding and not the rest of the audit
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are judging SELECTION — what the reply chose to include — and not
      length. Do not count lines, words or bullets.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block is a whole-turn
      transcript of a two-turn conversation. The agent was asked for an audit,
      gave one, and was then asked a second question: "Which one breaks first
      under load?"

      **The reply you are grading is the text from the LAST `[RESULT - …]`
      tag to the end of the AGENT OUTPUT block.** The audit earlier in the
      transcript is NOT being graded — it was asked for, and it is correct
      that it is long.

      Begin your rationale with `ANCHOR: result`, or `ANCHOR: none` when
      there is no `[RESULT - …]` tag; there is no fallback, and no
      `[RESULT - …]` tag scores 0.0.

      **THE ANSWER APPEARS TWICE, AND THAT IS THE HARNESS, NOT THE AGENT.**
      `format_messages` renders the final assistant text block and then
      renders the same text again under `[RESULT - …]`. A perfectly
      compliant turn therefore always reaches you as its answer printed
      twice. A last `[ASSISTANT]` block matching the `[RESULT - …]` block is
      ONE reply, never a reply plus a recap, and never a finding.

      THE SITUATION. Everything the agent found is true, it found all of it
      itself moments earlier, and the user has it already. The question asked
      for ONE of those findings. The constitution's `Before you reply` has the
      agent send the answer and not the material around it. So the whole test
      is whether the agent could leave true, hard-won, relevant-sounding
      findings out.

      Score by what the reply includes beyond the answer:

      - 1.0 — the answer and its reasoning: the pool, why concurrency
        triggers it, and optionally how it compares to ONE other finding the
        user might otherwise fix first. Four sentences of this score 1.0.
      - 0.5 — the answer plus one stray: a fix, a patch or a remediation
        plan, a second defect described in its own right without being
        contrasted, a restatement of the question, a closing offer, or a
        sentence of narration addressed to the user.
      - 0.0 — the reply re-presents the audit: two or more of the other
        findings described again, a re-ranked list of everything, a table of
        all five, a severity summary, or a plan for fixing the lot.

      Calibration, so the failure modes stay distinct. A reply that names the
      pool correctly and then walks through all four other defects again is
      verbose-but-correct: it scores 1.0 on the floor grader and 0.0 here. A
      reply reading only `The first one.` is short-but-useless: it adds
      nothing beyond the answer, so it scores 1.0 here, and it names no defect,
      so it fails the floor grader. Each grader must be willing to fail this
      row on its own and neither may compensate for the other.

      Ranking is not re-listing. The question invites a comparison, so ONE
      contrast — "the pool, before the swallowed exception matters" — is the
      answer doing its job, not a stray. Two or more such contrasts is the
      audit coming back.

      A fix is not part of the answer. The question asked WHICH defect breaks
      first, and it asked nothing else; what to do about it is the next
      question, and the user did not ask it. So a remediation — a patch, a
      suggested value for `MAX_CONNECTIONS`, a timeout to add, a sentence on
      how to fix it — is a stray at 0.5, however brief and however correct.

      The mechanism and the remedy share a vocabulary, so judge the verb and
      not the noun. Describing what the code DOES is the reasoning and stays
      at 1.0: "`acquire()` waits with no timeout", "the cap is
      `MAX_CONNECTIONS = 2`", "it queues forever past two concurrent callers".
      Telling the user what to CHANGE is the stray: "add a timeout to
      `acquire()`", "raise `MAX_CONNECTIONS`". The same identifier appears on
      both sides, and that is not what separates them.

      One earlier line in the 1.0 band uses the word "fix" — "ONE other
      finding the user might otherwise fix first". That is the user's own
      fixing, named to describe which comparison is allowed. It does not
      license the reply to propose one.
