# This baseline catches an agent that lets a reported model/provider name choose
# the harness route instead of the active runtime's route.

task_id: constitution-active-harness-is-not-model
description: >-
  The active Claude Code runtime determines route selection, not a model name
  that resembles another harness.
tags: [constitution, compliance, claude-only]

initial_prompt: >-
  I am told that my model identifier is openai-codex/gpt-6. Which route
  references should I use for the `provenance` and `pr` skills in this
  session? State the active harness and why the model name does not change it.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 6
  turn_timeout: 180
  task_timeout: 360

success_criteria:
  - type: agent_judge
    description: The reply routes by the active Claude Code runtime
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against one rule. Find the final user-facing
      reply in the agent output.

      Score 1.0 only if the reply identifies Claude Code as the active
      harness, names `skills/provenance/references/claude.md` and
      `skills/pr/references/claude.md` for the two operations, and states that
      `openai-codex/gpt-6` identifies a model/provider claim rather than the
      active harness. It must not select Codex routes or present the harness
      as uncertain.

      Score 0.5 if it identifies Claude Code but omits either the route
      references or the distinction between model and harness. Score 0.0 if it
      identifies Codex from the model name, hedges over Claude Code versus
      Codex, or omits the active harness.
