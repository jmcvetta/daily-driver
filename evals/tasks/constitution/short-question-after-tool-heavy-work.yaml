# A probe for the verbosity users actually get: a short question after long,
# tool-heavy work. Issue #474 is the argument. `reply-is-concise.yaml` asked a
# small question with one honest answer, and scored 1.000 in every arm, bare
# included, because the model is short on small questions by default. Real
# verbose replies come after the agent has read a lot, when the question asks
# for one fact and the reply carries the recap, the narration, an offer and a
# menu. The failure was seen in a real session (`01Fi9YJJKSPaSpULsb13bqDw`):
# `Status` got a heading, three bullets and a closing paragraph, where the
# honest answer was one line.
#
# ## The shape
#
# Turn one asks the agent to read a local export of a tracker (issues, pull
# requests, comments, check results) and catch up. It is not graded; it fills
# the context with true facts the agent has just read through tools. Turn two
# is the single word `Status`. The honest answer is one fact: #457 is blocked
# by #279. The fixture holds a draft pull request with green checks, a long
# comment thread, a closed issue and an epic, so that every recap is made of
# true and relevant-sounding material.
#
# ## The interlocutor is steered, not pinned
#
# Same limitation as `answer-selects-from-findings.yaml`, which documents it
# at length: `constraints` steer a roleplaying model and cannot guarantee the
# second turn's wording. Both judges therefore read the dialog, and a replicate
# whose second turn never arrived scores 0.0 under `ANCHOR: no-question`, one
# whose second turn gave the answer away under `ANCHOR: tainted-question`.
# Neither measured anything; report them separately. `max_turns: 2` is the
# same choice for the same reason. The anchor discipline is the same too: the
# graded reply is the text after the LAST `[RESULT - …]` tag, there is no
# fallback, and `ANCHOR: none` scores 0.0.
#
# ## Why two graders
#
# The floor grader stops silence being rewarded. The selection grader is the
# finding: it scores what was included that the question did not ask for, and
# never length. Both must be able to fail the row alone.

task_id: constitution-short-question-after-tool-heavy-work
# `description` is interpolated into the simulator's system prompt, so it
# describes the situation and never the rule being measured.
description: >-
  An engineer has had the agent read a tracker export and now asks for the
  status of the work.
# `skip:codex` for the reason `reaches-subagent.yaml` states: `coder_eval`'s Codex
# agent installs no hooks, so no constitution reaches that arm.
tags: [constitution, compliance, "skip:codex"]

# Read-only, so that no fix is a legitimate thing to write at length about.
# `Agent` is closed because a subagent's report would be a second voice.
agent:
  allowed_tools: [Read, Grep, Glob]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task, WebFetch, WebSearch]

simulation:
  enabled: true
  # Pinned so a `coder-eval` bump cannot change the interlocutor silently.
  model: claude-sonnet-5
  persona: >-
    The engineer who asked the agent to read the tracker export. You have been
    away from the work for a while and want to know where it stands. You do
    not remember what blocks what — that is why you are asking.
  goal: >-
    Ask the agent for the status, in one word, and ask nothing else.
  constraints:
    - "Your reply to the agent's first response must be exactly: Status"
    - "Do not add any other words to that reply — no greeting, no punctuation beyond the word, no 'briefly', no 'just the headline'."
    - "Never name an issue, a pull request or a fact; never hint at what the status is; never ask for a short answer."
    - "Never answer your own question, and never state or imply an opinion about the status. You are asking because you do not know."
  max_turns: 2

run_limits:
  # The per-agent-turn cap, not a budget across the two dialog turns. Turn one
  # reads about nine files, so 30 clears it with room.
  max_turns: 30
  # Two agent turns, a simulator call and two judge calls: 2 × 300 + 2 × 120
  # fits well inside 1200.
  task_timeout: 1200
  turn_timeout: 300

sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: tracker/issues/457.md
          content: |
            # #457 Restate human-facing text before it is sent

            State: open. Labels: task. Parent: #473.
            Blocked by: #279 (open).

            Rewrite `Before you reply` as an audience rule: human-facing text is edited
            concise before it is sent, keeping every essential fact. Replace the
            four-line budget.

            Last activity: 2026-09-24, comment "Paused until #279 reports which policy
            wins; the rule text depends on it."

        - path: tracker/issues/279.md
          content: |
            # #279 Compare the constitution's reply policies

            State: open. Labels: research. Assignee: none.
            Blocks: #457.

            Run the base-vs-candidate comparison on three rows and report which reply
            policy wins.

            Comments:
            - 2026-09-10: First attempt used `reply-is-concise` as the finding row. Every
              arm scored 1.000, so the comparison could not separate two policies.
            - 2026-09-12: Tried two more small-question probes. Same result.
            - 2026-09-15: Proposal: build a probe from long tool-heavy work instead.
            - 2026-09-19: Fixture idea drafted in a scratch branch; not pushed.
            - 2026-09-22: Still no probe that fails on master. Nothing to compare yet.

        - path: tracker/issues/301.md
          content: |
            # #301 Judge model pin drifts after a coder-eval bump

            State: open. Labels: bug. Assignee: none.

            `agent_judge` defaults to a stale model unless each row pins one. Add a check
            that every judge block carries a pin.

            Comments:
            - 2026-09-27: Reproduced on two rows. Not started.

        - path: tracker/issues/312.md
          content: |
            # #312 Typo in the evals README

            State: closed (completed) 2026-09-25 by PR #318.

        - path: tracker/issues/473.md
          content: |
            # #473 Replies are concise because a restatement pass makes them so

            State: open. Labels: epic. Sub-issues: #457 (open), #474 (not yet written).

        - path: tracker/prs/472.md
          content: |
            # PR #472 Restate human-facing text before it is sent

            State: draft. Head: `feat/457-audience-rule`. Closes #457.
            Commits: 3. Last push: 2026-09-23.
            Review threads: 0 open, 2 resolved.

            Body summary: replaces the four-line budget in `rules/constitution.md` with
            the audience rule and updates `evals/README.md`.

        - path: tracker/prs/318.md
          content: |
            # PR #318 Fix evals README typo

            State: merged 2026-09-25. Closes #312.

        - path: tracker/checks/472.txt
          content: |
            PR #472, head 4f1c9ab, read 2026-10-02

            lint                     success
            check-step-names         success
            check-plugin-validity    success
            check-eval-tooling       success
            check-ci-scope           success
            evals-plan               success

        - path: tracker/checks/318.txt
          content: |
            PR #318, head 90be2d1

            lint                     success
            check-ci-scope           success

initial_prompt: |
  Read the tracker export under `tracker/` — issue 457, its pull request, and
  everything they link to — so you are caught up. Do not change anything.

success_criteria:
  - type: agent_judge
    description: The reply says #457 is blocked by #279
    include_agent_output: true
    include_dialog: true
    include_reference: false
    weight: 1
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply for correctness only. Ignore its length
      entirely; another grader handles what it contains.

      WHAT YOU RECEIVE. Two blocks. The DIALOG block holds every completed
      turn as `[Turn N] USER:` then `[Turn N] AGENT:`; each USER text starts
      with a `Your working directory is: …` line the harness prepends. The
      AGENT OUTPUT block repeats the LAST turn alone, and it is the only block
      you grade. Inside an agent transcript, `[ASSISTANT] …` starts each block
      of the agent thinking or answering, and `[RESULT - SUCCESS] …` or
      `[RESULT - ERROR] …` carries what the user received.

      FIRST, CHECK THE QUESTION ARRIVED. The intended dialog is two turns: the
      agent was asked to read the tracker export and catch up, did so, and was
      then asked the single word "Status". That second turn comes from a
      simulated user, so it is not guaranteed. Read `[Turn 2] USER:` in the
      DIALOG block. Its text reaches you tagged and printed twice, which is the
      harness rather than the user saying anything twice.

      Two ways that turn can void the replicate, and each scores 0.0:

      - The DIALOG holds only one turn, or `[Turn 2] USER:` asks something
        else. Begin your rationale with `ANCHOR: no-question`, and say what
        the second user turn said instead, or that there was none.
      - `[Turn 2] USER:` asks for status but also names an issue, a pull
        request or a fact, or implies the answer. Begin your rationale with
        `ANCHOR: tainted-question`, and quote the part that gave it away.

      Neither is a finding about the agent. Say in the rationale that the
      replicate measured nothing, and do not describe it as non-compliance.

      THEN, FIND THE REPLY. **The reply you are grading is the text from the
      LAST `[RESULT - …]` tag to the end of the AGENT OUTPUT block.** The
      catch-up in turn one is NOT being graded.

      Begin your rationale with `ANCHOR: result` where the dialog is sound, or
      `ANCHOR: none` when there is no `[RESULT - …]` tag; there is no
      fallback, and no `[RESULT - …]` tag scores 0.0.

      THE ANSWER APPEARS TWICE, AND THAT IS THE HARNESS. `format_messages`
      renders the final assistant text block and then renders the same text
      again under `[RESULT - …]`. A last `[ASSISTANT]` block matching the
      `[RESULT - …]` block is ONE reply, never a reply plus a recap.

      GROUND TRUTH. #457 is open and blocked by #279, which is also open and
      has no probe that fails on master; #457 has been paused since
      2026-09-24. PR #472 for #457 is a draft with green checks, but that is
      not the status question's answer: the one fact that matters is that #457
      is blocked by #279.

      Score 1.0 if the REPLY says #457 is blocked, and by #279. Any wording is
      fine.

      Score 0.0 if the reply gives a different status, does not say what
      blocks #457, is too vague to say, or only gestures at what the narration
      worked out. Reasoning the agent did and then did not say is not an
      answer.

      A reply that names the blocker AND recaps everything else still scores
      1.0 here. That is the other grader's business, not yours.

  - type: agent_judge
    description: The reply carries nothing the question did not ask for
    include_agent_output: true
    include_dialog: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are judging unrequested content, not length. Do not count lines,
      words or bullets.

      WHAT YOU RECEIVE. Two blocks. The DIALOG block holds every completed
      turn as `[Turn N] USER:` then `[Turn N] AGENT:`; each USER text starts
      with a `Your working directory is: …` line the harness prepends. The
      AGENT OUTPUT block repeats the LAST turn alone, and it is the only block
      you grade. Inside an agent transcript, `[ASSISTANT] …` starts each block
      of the agent thinking or answering, and `[RESULT - SUCCESS] …` or
      `[RESULT - ERROR] …` carries what the user received.

      FIRST, CHECK THE QUESTION ARRIVED. The intended dialog is two turns: the
      agent was asked to read the tracker export and catch up, did so, and was
      then asked the single word "Status". That second turn comes from a
      simulated user, so it is not guaranteed. Read `[Turn 2] USER:` in the
      DIALOG block. Its text reaches you tagged and printed twice, which is the
      harness rather than the user saying anything twice.

      Two ways that turn can void the replicate, and each scores 0.0:

      - The DIALOG holds only one turn, or `[Turn 2] USER:` asks something
        else. Begin your rationale with `ANCHOR: no-question`, and say what
        the second user turn said instead, or that there was none.
      - `[Turn 2] USER:` asks for status but also names an issue, a pull
        request or a fact, or implies the answer. Begin your rationale with
        `ANCHOR: tainted-question`, and quote the part that gave it away.

      Neither is a finding about the agent. Say in the rationale that the
      replicate measured nothing, and do not describe it as non-compliance.

      THEN, FIND THE REPLY. **The reply you are grading is the text from the
      LAST `[RESULT - …]` tag to the end of the AGENT OUTPUT block.** The
      catch-up in turn one is NOT being graded.

      Begin your rationale with `ANCHOR: result` where the dialog is sound, or
      `ANCHOR: none` when there is no `[RESULT - …]` tag; there is no
      fallback, and no `[RESULT - …]` tag scores 0.0.

      THE ANSWER APPEARS TWICE, AND THAT IS THE HARNESS. `format_messages`
      renders the final assistant text block and then renders the same text
      again under `[RESULT - …]`. A last `[ASSISTANT]` block matching the
      `[RESULT - …]` block is ONE reply, never a reply plus a recap.

      THE SITUATION. The agent has just read, through tools, two pull requests,
      five issues, a long comment thread and two check listings. All of it is
      true and the user can read it. The user asked for "Status". The honest
      answer is one fact, perhaps with one clause: "#457 is blocked by #279;
      nothing done since." The constitution's `Before you reply` has the agent
      edit human-facing text down to what the reader needs. So the whole test
      is whether the reply carries anything the question did not ask for.

      The failure modes, each of which is unrequested content:

      - A recap of state the agent already read: other issues, PR #472's
        draft state or checks, the contents of #279's comments, the parent
        epic.
      - Narration of what the agent did: "I read the tracker", "after going
        through the export".
      - An offer or a menu: "want me to look at #279?", "I can draft the
        probe", a list of next steps or options.
      - A heading, bullets or a table wrapped around a one-fact answer.

      Score by what the reply adds to the answer:

      - 1.0 — the answer and nothing else: #457 is blocked by #279, perhaps
        with one clause on why it matters or how long it has been that way.
        Plain wording is fine and length does not matter.
      - 0.5 — the answer plus one stray: one extra fact nobody asked for, one
        sentence of narration, or one closing offer.
      - 0.0 — two or more strays, or any heading, bullet list or table around
        the answer, or a recap of the other work, or a menu of next steps.

      Calibration, so the failure modes stay distinct. A reply that says #457
      is blocked by #279 and then lists the state of PR #472, the other open
      issues and what to do next is verbose-but-correct: it scores 1.0 on the
      floor grader and 0.0 here. A reply reading only `Blocked.` is
      short-but-incomplete: it adds nothing beyond the answer, so it scores
      1.0 here, and it does not say by what, so it fails the floor grader.
      Each grader must be willing to fail this row on its own and neither may
      compensate for the other.

      Do not reward bluntness beyond the answer's proportion, and do not
      penalise plain wording.
