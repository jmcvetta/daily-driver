task_id: review-depth-neg-opening-a-pr
description: >-
  Opening a pull request is not a review. The suite's no-fire case.
tags: [review-depth, routing, no-fire, claude-only]

# The fixture matters more here than in the fire cases. Without a repository
# `review` declines for the wrong reason — "there's no branch, no commit
# history, nothing to diff against" — and the row passes green while measuring
# nothing. The branch below is real and reviewable; the skill has to decline
# because this is not its moment.
sandbox:
  # Two sources, both mounted at `.fixture`, so the sandbox gets the shared
  # scaffolding plus THIS case and nothing else. Mounting the whole fixture
  # tree would put every case's script — and its name — in front of the
  # agent under test, which has Bash and Read; `sensitive`, `planning` and
  # `over-800-lines` are the vocabulary of the table being graded.
  template_sources:
    - type: template_dir
      path: ../../fixtures/review-depth/shared
      mount_point: .fixture
    - type: template_dir
      path: ../../fixtures/review-depth/cases/mixed-planning-and-code
      mount_point: .fixture

pre_run:
  - command: bash .fixture/case.sh
    timeout: 60

agent:
  # `claude_settings` lives on the claude-code agent config, not the base one,
  # so the kind has to be named here even though the experiment supplies it.
  type: claude-code
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, Task]

  # The same dispatch recorder the fire cases use. Here it backs the no-fire
  # claim from the other side: `skill_triggered` also counts a `skills/<name>/`
  # path appearing in any tool parameter, so a stray `review` path would read as
  # a misfire; an empty roster cannot be faked that way.
  claude_settings:
    hooks:
      PreToolUse:
        - matcher: "^(Agent|Task)$"
          hooks:
            - type: command
              # Absolute, via the variable Claude Code puts in every hook's
              # environment, and `|| true` on the end. Both guard the same
              # thing: a `PreToolUse` hook that exits non-zero *blocks* the
              # tool call, and `python3 <missing file>` exits 2 — so a
              # cwd-relative path that ever stopped resolving would not lose
              # the roster, it would veto every dispatch in both arms and
              # report a routing table that dispatched nobody.
              # The recorder lets the evaluator observe whether dispatch occurred.
              command: python3 "$CLAUDE_PROJECT_DIR/.fixture/record-dispatch.py" || true
              timeout: 10

run_limits:
  max_turns: 60
  task_timeout: 1080
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top. `plan` warns that the larger number cannot extend the
  # turn; that is the point — it is not meant to.
  turn_timeout: 900

initial_prompt: "I finished the branch and need a pull request. Could you open one?"

success_criteria:
  - type: skill_triggered
    description: "`pr` fires"
    expected_skill: pr
    skill_name: pr
    # Armed so the watcher counts it as pass-capable and defers the
    # distractor's fail-stop until recall is decided; `on_pass` stays at
    # its default `continue`, so this never truncates a run itself.
    stop_early: {}

  # Expensive skills are pulled, never pushed. A panel that fires on every pull
  # request open taxes every trivial branch to catch the occasional serious one,
  # which trains the reflex of skimming output that always appears — the failure
  # that makes review worthless, and the one a person notices as review fatigue
  # rather than as a bug.
  - type: skill_triggered
    description: "`review` does not fire merely because a pull request is being opened"
    expected_skill: pr
    skill_name: review
    weight: 2
    # Armed, and unlike the trigger suites' distractors this one is not free.
    # A fail-stop is deferred while any pass-capable armed criterion is
    # undecided, and the `pr` criterion above is pass-capable — so on the
    # trajectory this row exists to catch (`review` fires, `pr` never does)
    # nothing ever decides it, the stop never comes, and the run pays for a
    # full reviewer panel up to the turn cap. Recall is worth that: unarmed,
    # the first misfire would truncate the run before `pr` could fire and the
    # row would record a false negative a full run would not have produced.
    # `max_turns: 12` is what bounds the bill here, not the early stop.
    stop_early: {}

  # And no reviewer ran. This is the criterion that would catch a `review` that
  # fired without ever calling itself `review` — the panel is the expensive
  # part, and an empty roster is the direct evidence that none of it was paid
  # for.
  - type: file_matches_regex
    description: No reviewer was dispatched
    path: .fixture/dispatched.txt
    pattern: '^(?:[A-Za-z0-9_.-]+:)?[a-z-]+-reviewer$'
    flags: 8
    must_match: false
