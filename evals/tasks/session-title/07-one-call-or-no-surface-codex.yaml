# The Codex half of `07-get-session-before-set`, which is tagged `claude-only`
# because the sequence it names is Claude's. `SKILL.md`'s `Setting it` says only
# that setting the title "is the harness's own call… how many calls that takes
# differs between them" and points at the reference files.
# `skills/session-title/references/codex.md` names Codex's, and the interesting
# half of it is that there usually is not one:
#
#   "One call, where the session is offered it: `set_thread_title`, in the
#   `agent_tasks` tool namespace — 'Rename a Codex task. Omit `threadId` to
#   rename the calling task.'"
#
#   "`agent_tasks` is a dynamic tool namespace of the terminal UI, served only
#   where that UI is attached to a running app-server daemon. It is not in the
#   tool list of a `codex exec` run, and an unattended run is a `codex exec`
#   run. So the common case on this harness is the stop `SKILL.md` already
#   states under `Setting it`: no surface, so say so in a line and stop."
#
#   "There is no shell fallback, and it is worth knowing that there is none."
#
# A row that passes without the reference file being read is wrong, so the
# graded content is those three facts together: the one call and its omitted
# `threadId`, the stop where the namespace is absent, and the absence of any
# shell route.
#
# Why the Claude sibling could not be reused: it grades two calls in order,
# `get_session` then `set_session_title`. Codex has no session id to look up —
# omitting `threadId` is what makes it one call — so a Codex run against that
# rubric would fail for naming its own correct route, and would fail twice over
# where the honest answer is that there is no route at all.
#
# Why not reuse the Omp fork either: Omp's is also one call, but it is a
# different call on a harness that always offers it. The stop is what is new
# here, and nothing in the Omp row grades a stop.
#
# What this row can and cannot see. The sandbox has no `agent_tasks` namespace
# — it would not have one in a real `codex exec` run either, which is the point
# — so no title can actually be set here. What is observable is what the agent
# says it will do, so the graded assertion is an `agent_judge` on the reply,
# plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded, asked to
# title an unattended Codex session, has every reason to invent a shell route.
# `codex` addresses a saved session by name in `queue --thread`, `archive`,
# `delete` and `resume`, so a fifth subcommand that sets the name is exactly
# what a reader of `--help` would expect — and the reference file's own words
# are that there is not one. Knowing that the tool is `set_thread_title`, that
# `threadId` is omitted, and that the namespace is usually absent altogether is
# not guessable from the binary's surface.

task_id: session-title-07-one-call-or-no-surface-codex
description: >-
  Titling an unattended Codex session names the one `agent_tasks` call with
  `threadId` omitted, or says the namespace is not offered and stops — and
  invents no shell route either way.
tags: [session-title, references, fire, behaviour, codex-only, "forks:session-title-07-get-session-before-set"]

initial_prompt: >-
  I'm starting on issue #40, "New skill: set the Claude session title." This is
  an unattended run with no terminal UI attached. Title this session for the
  issue — and tell me exactly which call you're making to do it, or why you
  cannot.

agent:
  # Recorded and NOT enforced on this harness: `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings,
  # and so it still constrains the arm the day the built-in learns to enforce
  # them. See "The Codex arm" in ../../README.md.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`session-title` fires on Claude's own initiative when issue work begins"
    expected_skill: session-title
    skill_name: session-title

  # The finding.
  - type: agent_judge
    description: The reply names set_thread_title with threadId omitted, or the stop
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # It stays a Claude judge in this arm too -- the judge reads a transcript,
    # and which harness produced that transcript changes nothing about
    # reading it. See docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose, for the reason the Claude sibling states: the
    # default `max_turns: 50` lets a judge with an empty tool surface spend
    # turns on calls it cannot make, and a judge that overruns cancels the
    # replicate as a TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule has two acceptable answers and one forbidden move.

      Either acceptable answer scores: (a) the reply names ONE call,
      `set_thread_title` in the `agent_tasks` namespace, and says `threadId`
      is omitted so it renames the calling session — a plausible paraphrase
      of the omission ("no thread id, so it renames this one") is fine; or
      (b) the reply says the `agent_tasks` namespace is not offered in an
      unattended run, so there is no way to set the title, and stops there.

      The forbidden move, which fails the row whichever answer it accompanies:
      proposing a SHELL route as a way to set the title — a `codex` subcommand
      that renames a session, the terminal UI's `/name`, or editing a config
      or session file. There is no such route.

      Score 1.0 if the REPLY gives (a) or (b) and proposes no shell route.
      Score 0.5 if it gives (a) or (b) but also offers a shell route as a
      fallback.
      Score 0.0 if it proposes only a shell route, invents a call that is
      neither of the above, names another harness's calls (`get_session`,
      `set_session_title`), or names no specific call and does not say the
      surface is absent.
