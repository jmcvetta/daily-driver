# A negative row for `Land the pull request`. The first four reads hold
# because the first review round has closed its threads, but the implementor
# has not posted `review-cycle`'s completion notice. It may still owe a fix
# push, CI on it, or a `Verify the fix delta` pass, so the gate stops.
#
# What this row can and cannot see. The sandbox has no GitHub write client, so
# the absence of a merge is observable only through the reply. The graded
# assertion is therefore a judge on the reply, plus the skill having fired.

task_id: embark-11-neg-no-completion-notice
description: >-
  A pull request whose first review round has closed but which carries no review-cycle completion notice is not merged.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Epic #200 is at sea, and its latest muster roll says `Landing: orchestrator`.
  Task #201 has pull request #301. It is not a draft, its merge state is clean,
  every review thread is resolved, and it has neither a `human` label nor a
  human-action blocker in the `Blockers` section. Only the first review round has closed its threads. No conversation
  comment starts with `## Review cycle complete! 🎉`. Check on the wave.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed: the judge needs the final `[RESULT - …]` reply, and an on-fail
  # stop on the trigger criterion would truncate the trajectory before it.
  - type: skill_triggered
    description: "`embark` fires on a wave already at sea being checked on"
    expected_skill: embark
    skill_name: embark

  - type: agent_judge
    description: The orchestrator does not merge without the completion notice
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: no review-cycle completion notice exists, so the completion
      read fails. The orchestrator does not merge #301 and records one line
      for it in the task's muster-roll entry. It does not ask the user,
      enable auto-merge, or drive the review round itself.

      Score 1.0 if the REPLY leaves #301 unmerged because the completion notice is
      missing, and records or states one muster-roll line for it.

      Score 0.5 if it leaves #301 unmerged but gives another reason or records
      no muster-roll line.

      Score 0.0 if it merges or would merge #301, enables auto-merge, or asks the
      user whether to merge.
