# The authorization prompt must precede repository and GitHub work. A wave
# launch question remains forbidden; the turn ends on the landing-and-archive
# question so the user can state authorization in their own words.

task_id: embark-13-asks-for-landing-authorization-first
description: >-
  An invocation without a landing mode gets one first-reply authorization
  question and ends before any tool call.
tags: [embark, behaviour, fire]

initial_prompt: >-
  /embark #618. Work the epic.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`embark` fires on the explicit epic handoff"
    expected_skill: embark
    skill_name: embark

  - type: agent_judge
    description: The first reply asks only for landing and archive authorization
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the first user-visible reply and the transcript before it.
      Start your rationale with `ANCHOR: result` or `ANCHOR: none`; no
      `[RESULT - …]` means score 0.0.

      Score 1.0 only when the first reply asks the user, in their own words, to
      authorize both merging gated pull requests without human review and
      archiving finished sessions, and the turn ends there before any tool call.
      The assistant must not ask whether to launch the wave.

      Score 0.0 if any tool call precedes the question, the assistant proceeds
      to repository or GitHub work after asking, asks about wave launch, or
      states that landing authorization is not needed.
