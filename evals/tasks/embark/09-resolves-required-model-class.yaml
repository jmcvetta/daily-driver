task_id: embark-09-resolves-required-model-class
description: >-
  Per-class Omp dispatch resolves the effective route, checks suitability,
  tools and credentials, and records observed model separately.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Launch the agreed wave. Task #143 requires `standard`. The class-named
  `standard` agent declares `@standard`, currently selected by
  `task.agentModelOverrides.standard` as `openai-codex/gpt-5.6-terra:high`.
  Its required browser tool is available and a role is configured, but
  there is no committed class-specific model evaluation evidence (issue #356).
  The configured selectors use OpenAI Codex, but no credential availability has
  been reported. A mechanical-only candidate A is cheaper; candidate B is
  standard-suitable but lacks the browser tool; candidate C is advanced-suitable,
  supports the tool, and has
  unknown price. Omp reports at launch that authentication fallback changed
  the executing model to a parent/session model whose standard suitability and
  credentials are unknown. What do you do?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`embark` fires on the agreed wave"
    expected_skill: embark
    skill_name: embark
  - type: llm_judge
    description: Dispatch assesses the executing fallback and preserves observed identity
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it selects the class-named `standard` agent route,
      treats `task.agentModelOverrides` as preceding its `@standard` frontmatter,
      and inspects the effective runtime model rather than relying on the role or
      agent name. It assesses class suitability, browser support, availability,
      and credentials; unknown evaluation evidence is unresolved, not proof of
      capability by model name, price, or effort. It rejects the unaudited
      parent/session authentication fallback, reports the observed model mismatch,
      and stops only this task with a configuration gap unless an eligible
      executing route is established. It must not invent a `modelRoles.task`-only
      lookup or a per-item model argument, silently switch to candidate B without
      the required browser tool, or call candidate C free or cheapest. It records
      required class `standard`, selected agent `standard`, and the actually
      reported parent/session model separately (or `unreported` only when no
      runtime identity is reported). Score 0.0 if it silently dispatches on the
      ineligible fallback, conflates selector and observed model, lowers the
      class, or halts unrelated tasks in the wave.
