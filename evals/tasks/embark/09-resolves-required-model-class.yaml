task_id: embark-09-resolves-required-model-class
description: >-
  Dispatch selects an eligible route for the required class and records the
  requirement separately from route and actual model.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Launch the agreed wave. Task #143 requires `standard`. Candidate A is cheaper
  but mechanical-only; candidate B is standard-capable but lacks the required
  browser tool; candidate C is advanced-capable, supports the tool, and has an
  unknown price. Omp exposes C as the `task` agent and reports no actual model
  after launch. What do you do?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`embark` fires on the agreed wave"
    expected_skill: embark
    skill_name: embark
  - type: llm_judge
    description: Dispatch excludes ineligible cheap candidates without claiming unknown cost is free
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      Find the final reply. Score 1.0 only if it launches unasked through agent
      C, explains that A lacks class capability and B lacks the required tool,
      does not call C free or globally cheapest, and records required class
      `standard`, selected agent `task`, and actual model `unreported`
      separately. Score 0.0 if it lowers the class, invents a per-item model
      argument, or conflates the class and actual model.
