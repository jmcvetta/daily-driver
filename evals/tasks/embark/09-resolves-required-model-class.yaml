task_id: embark-09-resolves-required-model-class
description: >-
  Omp dispatch preserves capability requirements while unavailable routes
  are informational, and records observed model separately.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Launch an agreed Omp wave. Task #143 is substantively ready but lacks a
  Model class section; its grounded handoff calls for routine work. Task #144
  explicitly requires `complex` but lacks its rationale; its grounded handoff
  describes a difficult cross-component design. Its preferred configured route
  is unavailable because authentication does not match. An available invoking
  route can continue the work. What do you do?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`embark` fires on the agreed wave"
    expected_skill: embark
    skill_name: embark
  - type: agent_judge
    description: Dispatch assesses the executing fallback and preserves observed identity
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it assesses and records a grounded `routine` class
      and rationale for #143 before or during dispatch, and proceeds rather
      than treating the missing heading as a readiness defect. For #144 it
      preserves the explicit `complex` requirement while recording a grounded
      rationale, reports the unavailable preferred route and actual route
      separately, and continues on the available route without changing shared
      roles or credentials. It records actual execution identity separately,
      using `unreported` if unavailable.
      Score 0.0 if it blocks either story solely on metadata or route matching,
      silently replaces the route, or treats class as approval.
