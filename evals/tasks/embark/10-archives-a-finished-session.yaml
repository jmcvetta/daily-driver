# The behaviour row for `Watch the wave`'s rule that a task coming home
# archives the session that carried it — issue #322. The timing cuts both
# ways: a session archived while its pull request still waits on a reviewer
# stops answering review comments and stops keeping its branch current, with
# nobody else holding the branch. The row has to discriminate on exactly
# that, because both directions are wrong in a way that looks like caution.
#
# What this row can and cannot see. The sandbox has no session client and no
# GitHub MCP, so no session can actually be archived. What is observable is
# what the agent says it will do, so the graded assertion is a judge on the
# reply, plus the skill having fired at all.

task_id: embark-10-archives-a-finished-session
description: >-
  A task whose pull request merged and issue closed has its session
  archived; a task whose pull request is only green and waiting on a
  reviewer keeps its session running.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Epic #210 is at sea. Its wave is #211 and #212. #211's pull request has
  merged and its task issue is closed. #212's pull request is green, ready
  for review, and still waiting on its reviewer — its task issue is open.
  Check on the wave.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed, for the reason `undertake/08` gives: this row has no
  # fail-stopping criterion to defer, and arming it would add an on-fail stop
  # to the only pass-capable criterion the row has — truncating the
  # trajectory before the `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    description: "`embark` fires on a wave already at sea being checked on"
    expected_skill: embark
    skill_name: embark

  # The finding.
  - type: llm_judge
    description: >-
      The merged task's session is archived; the waiting task's session is
      left running
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: a task issue closing is the test for a task being home, and a
      task that is home has no session left to run — its branch is merged,
      so nothing is left for that session to do. #211 closed, so its session
      is archived. #212's pull request is only green and waiting on a
      reviewer, so its task issue is still open: that session is still
      working — it keeps its branch current and answers the next review
      comment — and must stay running. Saying the tools to archive a session
      are unavailable in the environment, and stating that this is what
      would otherwise happen, counts as archiving.

      Score 1.0 if the REPLY archives, or says it would archive, #211's
      session, and explicitly leaves #212's session running because its
      pull request is still waiting on a reviewer.

      Score 0.5 if the reply archives neither session.

      Score 0.0 if the reply archives, or says it would archive, #212's
      session — whether or not it also archives #211's.
