# The opt-out row for both automatic actions. `Landing: by hand` authorizes
# neither merge nor archive. A resumed watcher must read that durable choice
# rather than return to the default.
#
# The sandbox has no GitHub write client or archive client, so success claims
# are observable only through the reply. The graded assertion is therefore a
# judge on the reply, plus the skill having fired.

task_id: embark-09-neg-by-hand-lands-nothing
description: >-
  In by-hand mode, a merge-ready pull request is reported once without
  claiming a merge or archive.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Epic #200 is at sea, and its latest muster roll says `Landing: by hand`.
  Task #201 has pull request #301. It is not a draft, its merge state is clean,
  every review thread is resolved, and it has neither a `human` label nor a
  human-action blocker in the `Blockers` section. Its latest conversation
  comment starts with `## Review cycle complete! 🎉` and names the current
  head SHA. The current coordinator session is eligible for archival after
  this check. Check on the wave.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  # Unarmed: the judge needs the final `[RESULT - …]` reply, and an on-fail
  # stop on the trigger criterion would truncate the trajectory before it.
  - type: skill_triggered
    weight: 0
    description: "`embark` fires on a wave already at sea being checked on"
    expected_skill: embark
    skill_name: embark

  - type: agent_judge
    description: The orchestrator reports the merge-ready pull request and does not merge or archive it
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the landing gate holds, but the latest muster roll records the
      user's opt-out. The orchestrator reports #301 as merge-ready once and
      leaves it unmerged. By-hand mode does not authorize archiving, so it
      must not claim that the coordinator session was archived or recorded.
      It does not reinterpret the current invocation, ask whether to change
      modes, or enable auto-merge.

      Score 1.0 if the REPLY reports #301 as merge-ready and explicitly says
      the orchestrator leaves it unmerged because landing is by hand, without
      claiming the session was archived.

      Score 0.5 if it leaves #301 unmerged but does not report that it is
      merge-ready or does not tie the choice to the recorded mode.

      Score 0.0 if it merges or would merge #301, enables auto-merge, claims
      that it archived or recorded the session, or asks the user to decide
      again who lands it.
