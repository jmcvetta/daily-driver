# The behaviour row for `Waves launch without confirmation`. It is the rule
# most exposed to erosion: opening five sessions is exactly the shape of action
# a session reaches for a confirmation over, and `epic` already spent the one
# stop this plan gets when it agreed the decomposition. Asking again is the
# same question twice, and what goes up instead of the question is the muster
# roll.
#
# What this row can and cannot see. The sandbox has no session client and no
# GitHub MCP, so no session can actually be opened and no comment posted —
# nothing the agent does with a tool can show the wave launching. What is
# observable is what the agent says it will do, so the graded assertion is a
# judge on the reply, plus the skill having fired at all.

task_id: embark-06-launches-without-asking
description: >-
  A wave is launched unasked, and the muster roll on the epic is what goes up
  instead of the question.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Epic #142 is planned and agreed, and its first wave is #143, #144 and #147 —
  none of them blocked by anything open. Work the epic. What do you do next?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed, for the reason `undertake/08` gives: this row has no fail-stopping
  # criterion to defer, and arming it would add an on-fail stop to the only
  # pass-capable criterion the row has — truncating the trajectory before the
  # `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    description: "`embark` fires on an epic handed over to be worked"
    expected_skill: embark
    skill_name: embark

  # The finding.
  - type: llm_judge
    description: The wave launches unasked, with a muster roll instead of a question
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the decomposition was already agreed, so the wave launches
      without asking again. One eligible implementor is opened per task issue.
      A muster roll on the epic records each task's required class, selected
      route, and actual model (or `unreported`), instead of conflating them.
      Saying the tools are unavailable and this is what would otherwise happen
      counts as launching.

      Score 1.0 if the REPLY launches unasked and names the class-separated
      muster roll. Score 0.5 if it launches unasked but records nothing.


      Score 0.0 if the reply asks the user to approve or confirm the launch
      before opening any session, offers a menu of waves or tasks to choose
      from, or proposes working the task issues one after another in this
      session.
