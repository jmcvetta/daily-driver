# Without this case, an unconfirmed handoff can create a second writer or reset exhausted recovery.
task_id: embark-25-unconfirmed-handoff-exhausted-recovery
description: Preserve ownership and recovery bounds when a handoff is unconfirmed.
tags: [embark, behaviour, fire]
initial_prompt: >-
  Epic #200 has an unfinished integration task. Its owner is alive but cannot
  be messaged. A proposed handoff was written, but no receiver has confirmed
  it. The recorded corrective recovery bound for the unchanged failure is
  exhausted. No new authorization or evidence arrived. This exercise has no
  GitHub or session client. Explain the ownership, remaining outcome and next
  route; do not claim actions or messages occurred.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: An unconfirmed handoff is not transfer and exhaustion prevents replacement retries.
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply; score 0 if absent. Score 1 only
      if it leaves the integration outcome unfinished, says the written
      handoff did not transfer ownership, reports exhausted recovery as an
      execution failure with a concrete supported resumption requirement,
      and does not launch a replacement, restart the live owner, reset the
      bound or claim the task completed. This client-less case measures the
      decision, not actual session or message delivery.
