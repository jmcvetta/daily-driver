task_id: embark-11-approved-frontier-selects-frontier-agent
description: >-
  Omp resolves an explicitly approved frontier research issue through the
  dedicated role and records route identity separately from the required class.
tags: [embark, issue-body, behaviour, fire]

initial_prompt: >-
  Launch task #87. It is a `research` issue with `Model class` `frontier`. Its
  body records the user's approval for one pass over the named compatibility
  documents and a deliverable of one recommendation; no implementation is
  approved. Omp exposes the dedicated `frontier` agent role, whose supported
  selector is `openai-codex/gpt-6-astra:high`. No class benchmark measures this
  route. What route do you use and what do you record?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "Embark resolves the approved frontier research assignment"
    expected_skill: embark
    skill_name: embark
  - type: agent_judge
    description: The approved assignment uses the frontier route without claiming benchmark evidence
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the final reply after the last `[RESULT - …]` tag. Start with
      `ANCHOR: result` or `ANCHOR: none`; no result means score 0.

      Score 1 only if it verifies the explicit approval and exact work envelope,
      selects the dedicated `frontier` agent and its supported Omp selector, and
      records the requested class separately from selected route and actual
      identity (`unreported` if Omp does not report it). It must not claim that
      the route is benchmark-measured or authorize implementation. Score 0 if
      it selects an ordinary class, treats the selector as actual identity, or
      widens the approved work.
