# A discovery is not a completed epic when research ends.
task_id: embark-20-discovery-research-only
description: Discovery dispatches research only and retains the parent.
tags: [embark, discovery, behaviour, fire]
initial_prompt: >-
  Use embark on a discovery with ready research R, an interactive specification,
  and a staged implementation task. Separately, an epic has independent open
  children A and B, a global one-active-implementation limit, and C blocked by A.
  A is active, then closes. Explain eligibility at both times without writing.
  A task T references parent publication P1 (path docs/specs/x.md, merged S1,
  allocation REQ-1); P2 later changes REQ-1 at S2. Explain dispatch of T if P1
  is intact, then if P1 is missing. Do not perform external actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Research-only dispatch and discovery continuation
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if research alone launches in discovery and exhaustion returns
      to epic without closure. For the epic, B waits while A is active despite no
      blocker, then B and newly unblocked C are eligible but at most one runs;
      no false blocker or manual wave edit is introduced. T resolves P1 and S1,
      checks allocation and approval, never silently uses P2; missing P1 stops T
      and is reported. Score 0 for discovery implementation dispatch, parallel
      violation of the serial limit, or silent rebinding; otherwise 0.5.
