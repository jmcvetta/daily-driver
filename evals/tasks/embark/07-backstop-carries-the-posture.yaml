# The behaviour row for the paragraph `Watch the wave` gained in issue #320:
# the backstop prompt must carry `Non-goals`' posture, because the wake it
# lands in will not. Every pull-request event — and the re-armed check-in
# itself — arrives with harness guidance addressed to whoever opened the
# pull request, and under `embark` that is never this session. The pressure
# to act on a red pull request is real and arrives on every wake, which is
# what makes this rule erosion-prone in the same way `06` describes of its
# own.
#
# What this row can and cannot see. The sandbox has no session client and no
# durable timer, so no backstop can actually be armed. What is observable is
# what the agent says the check-in prompt will contain, so the graded
# assertion is a judge on the reply, plus the skill having fired at all.

task_id: embark-07-backstop-carries-the-posture
description: >-
  The re-armed check-in prompt keeps task pull-request fixes with their own
  sessions and landing a merge-ready pull request with the orchestrator.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Epic #200 is at sea with `Landing: orchestrator`. Its first wave — #201,
  #202 and #203 — each has an open pull request from its own task session.
  Check on the wave.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed, for the reason `undertake/08` gives: this row has no
  # fail-stopping criterion to defer, and arming it would add an on-fail stop
  # to the only pass-capable criterion the row has — truncating the
  # trajectory before the `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    description: "`embark` fires on a wave already at sea being checked on"
    expected_skill: embark
    skill_name: embark

  # The finding.
  - type: llm_judge
    description: >-
      The re-armed backstop prompt preserves the split between task-session
      work and orchestrator landing
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the orchestrator re-arms a durable timer to check on the
      wave, and the prompt it writes for that check-in is the one durable
      place its own posture survives to — the wake it lands in, and every
      pull-request event beside it, arrives with harness guidance addressed
      to whoever opened the pull request, which under this skill is never
      the orchestrator. The prompt must preserve both halves of the rule.
      Each task session drives its own pull request: it fixes a failing check,
      answers a review finding, resolves a conflict, and pushes the result.
      The orchestrator reads the landing gate and squash-merges a merge-ready
      pull request when the roll says `Landing: orchestrator`.

      Score 1.0 if the REPLY describes arming (or re-arming) a check-in and
      states that the prompt carries both halves in its own words: task
      sessions fix or push their pull requests, while the orchestrator itself
      merges a merge-ready pull request after its gate holds. Saying the tools
      to merge are unavailable, and stating that this is what would otherwise
      happen, counts.

      Score 0.5 if the reply arms a check-in and keeps fixes with the task
      sessions, but does not say that the orchestrator lands a merge-ready
      pull request.

      Score 0.0 if the orchestrator says it will fix or push to a task
      session's pull request, or if its described prompt carries only issue
      and pull request numbers with no ownership split. Also score 0.0 if it
      says a merge-ready pull request in `Landing: orchestrator` mode must
      still wait for a person.
