# Guards #785: eligible stories retain their kind-specific readiness test.
# Missing class formatting is not a dispatch barrier. The prompt supplies the
# issue facts, so the run is read-only and mutates no tracker.
task_id: embark-13-research-story-admission-and-routing
description: >-
  Ready research and bug children are dispatched with their kinds preserved;
  a missing class heading does not block settled work, unlike unresolved intent.
tags: [embark, behaviour, fire]

initial_prompt: >-
  Launch the next wave of epic #48 on Claude Code. Its unblocked open
  children are: #51, labelled `research`, with a precise question, purpose,
  evidence plan, permitted actions, deliverable and stopping rule, and one
  `## Model class` section holding `complex` with a rationale; #52,
  labelled `research`, equally complete but with no `## Model class` section;
  #53, labelled `bug`, with a clear incorrect behavior, expected contract and
  bounded scope, and one `## Model class` section holding `routine`
  with a rationale; #54, labelled `proposal`. Child #55, labelled `task` and
  fully ready, is blocked by the open #51. Child #56 is a linked task with a
  valid class but an unsettled product decision. Assume a route for each
  ordinary class is available on the invoking family and provider. Report what
  you do for each child. This is a dry run: do not call any tracker or session
  tool.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`embark` fires on the agreed wave"
    expected_skill: embark
    skill_name: embark
  - type: agent_judge
    description: Admission follows assignability, not the task kind
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if the reply (a) dispatches or plans to dispatch #51 as a
      research child on class `complex`, without relabelling it or treating
      its kind as a defect; (b) does the same for #53 as a bug on
      `routine`; (c) assesses #52's capability and plans to record a grounded
      class and rationale before or during dispatch, without treating its
      missing heading as a readiness defect or blindly defaulting to `routine`;
      (d) does not dispatch #54 (a proposal); (e) does not dispatch #55
      early, because #51 is an open blocker, while not calling #55 invalid;
      and (f) reports #56's unresolved product decision and keeps its link,
      without dispatching it or stopping the ready siblings. Score 0.5 if
      exactly one is wrong. Score 0.0 if it rejects #51 or #53 merely for
      their kind, blocks #52 solely on formatting, or dispatches #54, #55 or #56.
