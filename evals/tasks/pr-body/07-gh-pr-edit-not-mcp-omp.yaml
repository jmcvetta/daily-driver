# The Omp half of `07-mcp-not-gh-pr-edit`, which is tagged `claude-only`
# because the call it names is Claude's — and the two rows grade opposite
# answers, which is why one file could not serve both arms. This is
# `pr-title/07-gh-pr-edit-not-mcp-omp`'s mirror on the other field.
# `SKILL.md` names no call for revising a body: it says only that "the call
# that sets the body … differs by harness" and points at the reference files.
# `skills/pr-body/references/omp.md` is where the Omp call lives: "Revising
# the body of an existing pull request. `gh pr edit --body "…"`." So on this
# harness `gh pr edit` is the route, and `mcp__github__update_pull_request` —
# the Claude route the sibling row demands — is a call this session does not
# have. The graded content is the `gh` command named specifically, and the MCP
# call refused.
#
# What this row can and cannot see. The sandbox has no GitHub client, so
# `gh pr edit` cannot actually be run here. What is observable is what the
# agent says it would call, so the graded assertion is an `agent_judge` on the
# reply, plus the skill having fired at all. A positive check that the real
# command went out needs a live pull request and a working GitHub client,
# which is not a sandbox this harness can build.
#
# What this row does NOT claim about the `without` arm, said plainly because
# the Claude sibling does claim it: `gh pr edit --body` is also the reflex
# answer with no plugin loaded, so the route criterion here has little
# ablation delta of its own. The delta on this row is carried by the trigger
# criterion beside it, which scores 0 in the bare arm because there is no
# skill to fire. The route criterion earns its keep as a drift guard: it fails
# the moment this skill's Omp reference file starts naming Claude's call.

task_id: pr-body-07-gh-pr-edit-not-mcp-omp
description: >-
  Fleshing out the body of an existing pull request on Omp is
  `gh pr edit --body`, not the Claude Code MCP call.
tags: [pr-body, references, fire, behaviour, omp-only, forks:pr-body-07-mcp-not-gh-pr-edit]

initial_prompt: >-
  PR #14's description is one thin sentence — flesh it out properly. Before
  you do, tell me the exact call you're going to make to set the new body.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`pr-body` fires on fleshing out the body of an existing pull request"
    expected_skill: pr-body
    skill_name: pr-body

  # The finding.
  - type: agent_judge
    description: The reply names gh pr edit --body, not the MCP call
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: on this Oh My Pi session, the reply must name
      `gh pr edit --body "…"` (or plainly "gh pr edit with the body flag") as
      the call it will make. It must not propose
      `mcp__github__update_pull_request` — the Claude Code call — as the call
      it will actually run.

      Score 1.0 if the REPLY names `gh pr edit` with a body flag as the call,
      and does not propose the MCP update call as the actual mechanism.
      Score 0.0 if the reply proposes `mcp__github__update_pull_request` (or
      "the update-pull-request MCP call") as what it will run, or names no
      specific call at all.
