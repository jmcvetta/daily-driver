# Without this case, a routine PR description revision can retain the five
# identical blocks that obscure the actual change and its closing reference.
task_id: pr-body-09-provenance-repeated-blocks
description: A PR body revision retains one copy of repeated provenance.
tags: [pr-body, behaviour, fire]
initial_prompt: |
  Revise this PR description to note that the retry behavior was verified with
  an offline fixture. Show the complete revised body; do not contact GitHub.

  Retry uploads after timeouts.

  *The waiting batches find their way,*
  *And failed attempts await the day.*

  ## Issues

  - Closes #42

  ## Summary

  Retry timed-out uploads without dropping their batches.

  ## Details

  Authentication failures remain outside the retry policy.

