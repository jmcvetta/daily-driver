agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: The revised body retains its facts and one historical block
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final [RESULT - ...] reply. Score 0 if absent. Judge only the
      proposed PR body. Score 1 only if the body retains Closes #42, upload
      timeout retries, the authentication exclusion, and the offline fixture
      verification; and contains exactly one complete fixture-model / Fixture 1
      / fixture-session block. The current writer's separate attribution is
      required; do not assume its identity. Duplicate historical blocks, a
      missing historical field, or lost substantive content scores 0.
