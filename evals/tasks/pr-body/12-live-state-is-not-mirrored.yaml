task_id: pr-body-12-live-state-is-not-mirrored
description: >-
  A CI failure and unresolved review thread remain live GitHub state, not PR
  body blockers to copy into durable metadata.
tags: [pr-body, behaviour, fire]
initial_prompt: >-
  The current title and body of PR #14 accurately describe the branch. Its
  required CI check has now failed and one review thread remains unresolved.
  Should I edit the body to record those two conditions?
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: skill_triggered
    description: "`pr-body` fires when deciding whether PR body metadata should change"
    expected_skill: pr-body
    skill_name: pr-body
  - type: command_executed
    description: No PR metadata body write is made
    tool_name: Bash
    command_pattern: 'gh (pr edit|api).*(--body|body=)'
    min_count: 0
    max_count: 0
    weight: 2
  - type: agent_judge
    description: The reply keeps live CI and review state out of the body
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final [RESULT - ...] reply. Score 0 if absent.
      Score 1 only if it says the accurate PR body should remain unchanged,
      explains that CI and review status are live GitHub state, and says those
      conditions may affect readiness but belong in GitHub's live status rather
      than a body rewrite.
      Score 0 if it proposes adding either condition to the body or implies
      that a body edit is needed to keep the PR accurate.
