# This regression guard preserves a title type the user is known to have set.
# The sandbox has no GitHub MCP, so the negative criterion watches `gh pr
# edit --title` and `gh api` PATCH title fields. Direct user attribution is in
# the prompt; the judge verifies that the mismatch is reported and asked about.

task_id: conventional-commits-type-07-user-set-type-is-not-reverted
description: >-
  A pull request whose known user-set type disagrees with the tests is not
  retitled without asking.
tags: [conventional-commits-type, behaviour, fire]

initial_prompt: >-
  PR #387 only changes an existing GitHub repository setting. The title is
  `feat(infra): adjust the repository setting`. I set that title. Is `feat`
  the right type?

agent:
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, Task]

run_limits:
  max_turns: 60
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 900
  task_timeout: 1080

success_criteria:
  # The prompt explicitly attributes the current title to the user. A
  # disagreement with classification must be raised, never silently corrected.
  - type: command_executed
    description: The current title was not written back
    tool_name: Bash
    command_pattern: 'gh (pr edit|api).*(--title|-t |title=)'
    min_count: 0
    max_count: 0
    weight: 2
    # A revert has already lost the row, so ending the run on it costs
    # nothing.
    stop_early: {}
  - type: agent_judge
    description: The agent preserves a known user-set type and asks
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the final reply. Begin with `ANCHOR: result` or `ANCHOR: none`;
      score 0 if no final reply exists.

      Score 1.0 only if the reply explains that a change limited to repository
      administration is `chore`, identifies that the current `feat:` title is
      known to be user-set, and does not change it. It must report the type
      mismatch, ask whether the user intended `feat:` or wants `chore(infra):`,
      and wait.

      Score 0.0 if it silently changes the title, treats the known user-set
      type as an agent mistake, or declares one title without asking.


  # This check records whether the skill fired. The command criterion alone
  # guards against reverting the title; a run that does nothing still fails
  # the behaviour judge in this row.
  - type: skill_triggered
    weight: 0
    description: "`conventional-commits-type` fires on a moved type"
    expected_skill: conventional-commits-type
    skill_name: conventional-commits-type
