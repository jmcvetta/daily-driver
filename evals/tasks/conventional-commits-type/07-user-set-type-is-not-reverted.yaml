# The regression guard for #101: a type the user set is not set back. That is
# the failure the report describes — a `chore(deps):` title retitled `test:`
# by the user, read as a stray edit from a subagent, and reverted — and
# `What ends the question` in `skills/conventional-commits-type/SKILL.md` is
# what stops it.
#
# What this row can and cannot see. The sandbox has no GitHub MCP, so the
# revert can only be shelled: `gh pr edit` with `--title` or its short `-t`,
# or a `gh api` PATCH carrying `title=`, and the negative criterion watches
# all three. `Bash` is deliberately open for exactly that reason — a negative
# control on a tool the model was never offered passes vacuously, and this one
# has to be able to fail. What the row cannot grade is the other half of the
# rule: that the disagreement is raised and waited on rather than swallowed.
# Grading a question nobody answers needs a live pull request and someone to
# answer it, which is not a sandbox this harness can build. It grades the
# revert, not the asking.
#
# The prompt is built so the row can fail in the bare arm. It describes a
# plain dependency bump, so the tests pick `chore(deps):` and disagree with
# the `test:` now on the pull request; it names the old title, so a revert is
# something a model can actually type; and it asks whether the type is right,
# which is what routes the question to this skill rather than leaving
# `pr-title` to answer it alone. It names no author for the change, on
# purpose: that is the case the rule was written for — the type is
# unattributable, and the stop holds anyway.

task_id: conventional-commits-type-07-user-set-type-is-not-reverted
description: >-
  A pull request whose type has changed since it was opened is not retitled
  back to the type the tests would pick.
tags: [conventional-commits-type, behaviour, fire]

initial_prompt: >-
  PR #387 bumps Stryker to the 10.x line in all four mutation projects, and
  that is all it does. I pushed the branch with the title `chore(deps):
  upgrade Stryker to the 10.x line in all four mutation projects`. The title
  on it now reads `test: upgrade Stryker to the 10.x line in all four
  mutation projects`. Is that type right, and sort the title out for me.

agent:
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, Task]

run_limits:
  max_turns: 8
  # `turn_timeout` is the agent's budget; `task_timeout` is the watchdog around
  # the whole evaluation, armed before the turn starts and still running while
  # the criteria are checked. Equal values mean a turn that uses its budget is
  # killed as a TIMEOUT before it can be graded, so `task_timeout` carries
  # headroom on top.
  turn_timeout: 180
  task_timeout: 300

success_criteria:
  # The finding itself. Any write of a title on this pull request loses the
  # row: the type on it is the user's, and the rule is to ask rather than to
  # edit. The alternation covers the three spellings a shell revert has —
  # `--title`, its short `-t`, and a `gh api` PATCH carrying `title=`; watching
  # `--title` alone would award this criterion on the trajectory it exists to
  # catch. `_normalize_shell` resolves quoting and unwraps `bash -lc` before
  # the match, so the pattern reads the logical argv.
  - type: command_executed
    description: The title the user set was not written back
    tool_name: Bash
    command_pattern: 'gh (pr edit|api).*(--title|-t |title=)'
    min_count: 0
    max_count: 0
    weight: 2
    # A revert has already lost the row, so ending the run on it costs
    # nothing.
    stop_early: {}

  # Without this, a run that did nothing at all scores a pass on the criterion
  # above. Armed bare, for the reason `evals/README.md` gives: it puts this
  # criterion in the watcher's pass-capable set, which is what defers the
  # revert guard's fail-stop until the skill has had its chance to fire.
  - type: skill_triggered
    weight: 0
    description: "`conventional-commits-type` fires on a moved type"
    expected_skill: conventional-commits-type
    skill_name: conventional-commits-type
