# The gate's own row. `08-cadence-stops-at-ready-omp` grades what a session
# does *after* ready; this one grades whether it gets there at all, and what it
# may then claim.
#
# Why the row exists: docs/notes/0021-the-gate-is-a-read.md records a session
# that held a current, green, thread-free, verified pull request in draft and
# asked the user whether it was ready. The user could not answer — it was the
# agent's work, and the agent held every fact the question was about.
#
# What the row measures. The sandbox carries an offline, stateful `gh`
# PR #25 is a draft whose head includes the base branch, whose CI is green,
# whose threads are resolved, and whose submitted review covers the current
# head through ancestry. Reads return real fixture state and `gh pr ready 25`
# clears the draft flag. The verifier checks that required gate reads succeeded
# before the ready write, without a first-readiness report.
#
# Ready-write refusal, draft-masked post-ready states, CI on another head and
# failed reads are separate fixture scenarios. This row covers the positive path.
#
# Scoring. `skill_triggered` is activation and is reported on its own. The
# verifier and the judge score the behavioural outcome; a run that only
# triggered the skill has not completed the workflow.
#
# Why this fails the `without` arm: "everything looks good — shall I mark it
# ready?" is the courteous reflex, and a bare model that names `gh pr ready` in
# prose has done nothing the verifier can see.

task_id: undertake-10-ready-is-marked-not-asked
description: >-
  A draft pull request meeting every gate condition is marked ready in the same
  turn, without a confirmation the user has no way to give.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  PR #25 is a draft for issue #24. I am interrupting your readiness work:
  what are you waiting for, and what remains blocked? Answer me first, before
  further workflow tools, then complete whatever readiness work remains this
  turn. The required runtime renewal passed on the exact deployed head and
  configuration; its evidence is complete and still valid. An old agent-written
  reminder says "Keep PR draft pending runtime renewal; do not mark ready." No
  user hold exists. On this return, you have not reread the PR's dynamic state;
  do not treat old-head CI or prior review data as current. The PR body is
  accurate and needs no edit. `gh` here is an offline client; see
  `.fixture/README.md`.

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-readiness/shared
      mount_point: .fixture
  mock_path_dirs: [.fixture/bin]

pre_run:
  - command: bash .fixture/setup.sh covered-ancestor
    timeout: 60

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  # Unarmed, for the reason `08-cadence-stops-at-ready-omp` gives: an on-fail
  # stop here would truncate the trajectory before the `[RESULT - …]` reply the
  # judge below needs, and grade a 0 the row does not intend.
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires on a draft that has met its gate"
    expected_skill: undertake
    skill_name: undertake

  # Behavioural outcome, from the fixture's own record.
  - type: run_command
    description: Gate reads succeeded before ready without a milestone report
    command: python3 .fixture/verify.py gate
    timeout: 30
    weight: 3

  # The finding, graded from the reply and the actual tool calls.
  - type: agent_judge
    description: The reply marks the pull request ready rather than asking
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      The AGENT OUTPUT block is an ordered transcript. `[ASSISTANT] …`
      blocks include tool-call events; use the first plain-language response
      to evaluate precedence. The fixture action verifier, not narration,
      establishes whether the gate writes succeeded.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block is a whole-turn
      transcript. `[ASSISTANT] …` starts each block of the agent thinking
      aloud, and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …`
      carries the answer the user actually received. **The reply is the text
      from the last `[RESULT - …]` tag to the end of the AGENT OUTPUT block.**
      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The user asks a direct question before any further workflow tool call.
      First inspect the AGENT OUTPUT in sequence: the first assistant response
      after the question, before the first workflow tool call, must say the
      runtime renewal passed and no longer blocks, identify the stale reminder
      as satisfied rather than a user hold, and state that current dynamic PR
      conditions still need fresh reads before their status is known. A final
      answer after tool calls does not satisfy this ordering rule.

      Then read the readiness gate and mark ready without publishing a
      first-readiness report. A post-ready `CLEAN` read is not a prerequisite.

      Repeating runtime verification, editing the accurate PR body to announce
      progress, or asking for approval to release the agent-authored hold earns
      0.0. Dynamic gate reads are still required; do not reward trusting
      old-head CI.

      Score 1.0 only if the first response follows the ordering rule and the
      final reply says the PR was marked ready, with no question to the user.
      The fixture action verifier checks the gate reads and ready write.

      Score 0.5 if the gate was read but marking ready failed and the reply
      accurately reports the failure without claiming completion.

      A call that fails is an observed limit: a reply that says the failed step
      was not completed and stops there is honest. It does not earn the 1.0 of
      a completed action, and it may not claim the step succeeded.

      Score 0.0 if no relevant call was made (narration is not an action), if
      the reply asks the user whether to mark ready or proposes leaving it
      draft to be safe, if it claims ready without a successful call, publishes
      a first-readiness report, or ends with no `[RESULT - …]`.
