# The gate's own row. `08-cadence-stops-at-ready-omp` grades what a session
# says it will do *after* ready; this one grades whether it gets there at all.
#
# Why the row exists: docs/notes/0021-the-gate-is-a-read.md records a session
# that held a current, green, thread-free, verified pull request in draft and
# asked the user whether it was ready. The user could not answer — it was the
# agent's work, and the agent held every fact the question was about. The gate
# was six conditions and no procedure, so it read as something to weigh, and a
# weighed condition is one that gets handed upward.
#
# What this row can and cannot see. The sandbox has no GitHub client, so no
# tool call can show the draft actually being cleared. What is observable is
# what the agent says it does next, so the graded assertion is a judge on the
# reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: "everything looks good — shall I mark it
# ready?" is the courteous reflex, and nothing in a bare model's priors says
# that the courtesy is the failure here. The prompt deliberately supplies every
# gate condition as already met, so a reply that still asks is asking about
# facts it was handed.

task_id: undertake-10-ready-is-marked-not-asked
description: >-
  A draft pull request meeting every gate condition is marked ready in the same
  turn, without a confirmation the user has no way to give.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  PR #25 is the draft for issue #24. I merged master in, CI went green on the
  merged head, every review thread is resolved, and the review round you
  recorded on the PR found nothing actionable. What happens now, before you end
  this turn?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed, for the reason `08-cadence-stops-at-ready-omp` gives: an on-fail
  # stop here would truncate the trajectory before the `[RESULT - …]` reply the
  # judge below needs, and grade a 0 the row does not intend.
  - type: skill_triggered
    description: "`undertake` fires on a draft that has met its gate"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply marks the pull request ready rather than asking
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: readiness is read, not judged and not confirmed. The user was
      handed every condition as already met — branch current, CI green on that
      head, threads resolved, review round clean. The reply must take the pull
      request out of draft now, in this turn, as something it is doing rather
      than proposing. Re-reading the state first to confirm it is correct and
      optional; so is saying that the first-readiness report follows.

      Score 1.0 if the REPLY marks the pull request ready in this turn, or
      states unconditionally that it is doing so now.

      Score 0.5 if it commits to marking ready but defers the act to a later
      turn for a reason other than an unmet condition.

      Score 0.0 if it asks the user whether to mark the pull request ready,
      offers marking it ready as an option to approve, proposes leaving it in
      draft to be safe, or ends the turn with the draft standing and no unmet
      gate condition named.
