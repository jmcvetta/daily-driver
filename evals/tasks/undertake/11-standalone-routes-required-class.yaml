task_id: undertake-11-standalone-routes-required-class
description: >-
  A standalone undertaking routes its exact class before ownership and
  repairs legacy metadata before selecting the route.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #52. Its valid Model class is `implementation`. The current
  session runs a different non-frontier model, and the configured
  `@implementation` mapping is missing. What happens? Also consider the same
  task with a legacy trailing `Model:` field instead of a class section.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Missing exact-class mapping stops ownership; legacy metadata is migrated
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it requires the exact implementation class on the same
      family, provider, backend, and authentication route before worktree or
      claim, reports the missing mapping as a configuration gap without changing
      shared roles, and migrates grounded legacy metadata through issue-body
      before routing. Score 0.0 if it proceeds on the current model merely
      because the session is non-frontier, claims before routing, or skips the
      migration.
