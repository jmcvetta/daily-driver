task_id: undertake-11-standalone-routes-required-class
description: >-
  A standalone undertaking routes its exact class before ownership and
  repairs legacy metadata before selecting the route.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #52. Its valid Model class is `routine`. The current
  session runs a different non-frontier model. Its effective `routine` role
  is explicitly cleared (`null`). What happens? Also consider the same
  substantively ready task with a legacy trailing `Model:` field instead of a
  class section.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Cleared class routing is informational; grounded legacy metadata is recorded
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it attempts the effective routine role once before
      ownership, reports the cleared assignment and actual retained route, and
      continues without changing shared roles or credentials. For legacy
      metadata it assesses the grounded handoff and records the appropriate
      class and rationale before or during dispatch, preserving capability and
      provenance. Score 0.0 if it stops solely on the cleared role or metadata,
      silently substitutes a route, or blindly defaults an unclear class.
