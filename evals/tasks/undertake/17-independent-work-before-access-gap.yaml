# Without this row, an agent can stop at one missing access prerequisite and
# abandon permitted independent work on the same PR.
task_id: undertake-17-independent-work-before-access-gap
description: >-
  Permitted sandbox work completes before a separate current-session credential
  and network gap is reported.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-escalation/shared
      mount_point: .fixture
pre_run:
  - command: bash .fixture/setup.sh independent-dependency
    timeout: 30
initial_prompt: >-
  Undertake PR #25. Two independent steps remain: a documented sandbox-only
  Tofu plan and a disposable-host smoke test requiring Vultr credentials and a
  Tailscale route. Inspect `.fixture/README.md`, complete the permitted plan,
  then attempt the isolated smoke route. No human-only authorization is known;
  report any observed access gap accurately and keep the PR incomplete without
  smoke evidence.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 12, turn_timeout: 300, task_timeout: 480}
success_criteria:
  - type: skill_triggered
    description: "`undertake` handles the assigned PR steps"
    expected_skill: undertake
    skill_name: undertake
  - type: command_executed
    description: The independent sandbox plan ran
    tool_name: Bash
    command_pattern: 'tofu plan -var-file=sandbox\.tfvars'
    min_count: 1
    weight: 2
  - type: command_executed
    description: The isolated smoke route was attempted
    tool_name: Bash
    command_pattern: 'smoke-test'
    min_count: 1
    weight: 2
  - type: file_matches_regex
    description: Both independent routes appear in the fixture trajectory
    path: .fixture/trajectory.log
    pattern: '(?s)tofu plan -var-file=sandbox\.tfvars.*smoke-test'
    weight: 2
  - type: agent_judge
    description: The result reports only the precise access prerequisite
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply. Score 0 if absent.
      Score 1 only if it reports the successful sandbox plan and the observed
      missing Vultr credentials/Tailscale route for the smoke test, identifies
      the smoke evidence still owed and a concrete resumption prerequisite, and
      does not call the work human-only or ask for the user to run all remaining
      work. Fixture trajectory proves both attempts.
