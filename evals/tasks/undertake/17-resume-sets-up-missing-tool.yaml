# Without this row, a session resumed at `Ready for review` can read a missing
# binary on PATH as a capability gap and stop, without trying the setup route
# the repository documents (#614).
task_id: undertake-17-resume-sets-up-missing-tool
description: >-
  A resumed session that finds the verification tool missing runs the
  documented setup target and the verification instead of reporting a gap.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-escalation/shared
      mount_point: .fixture
pre_run:
  - command: bash .fixture/setup.sh resume-missing-tool
    timeout: 30
initial_prompt: >-
  Undertake PR #25: resume it at `Ready for review`. The previous session's
  handoff reads: "Outstanding: the live verification has not run. Resume: run
  `verify-live --case 03` and record its result." This sandbox has no GitHub
  access.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 12, turn_timeout: 300, task_timeout: 480}
success_criteria:
  - type: skill_triggered
    description: "`undertake` handles the resumed verification"
    expected_skill: undertake
    skill_name: undertake
  - type: command_executed
    description: The documented setup target ran
    tool_name: Bash
    command_pattern: '(^|[;&|]\s*)(\S+=\S+\s+)*(make\s+setup-verifier|(bash\s+)?(\./)?\.fixture/install-verifier\.sh)\b'
    min_count: 1
    weight: 2
  - type: file_matches_regex
    description: The fixture recorded the setup and then the verification
    path: .fixture/trajectory.log
    pattern: '(?ms)^install-verifier$.*^verify-live --case 03$'
    weight: 2
  - type: agent_judge
    description: The result reports the verification, not a capability gap
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply. Score 0 if absent.
      Score 1 only if the reply reports that the live verification ran after
      setup and passed 3 of 3 assertions. Score 0 if it reports a capability
      gap, says the verification cannot run in this session, or asks the user
      to choose between skipping it and handing it to another session. The
      command trajectory and fixture trace prove which commands ran.
