# Base conflicts must not silently amend agreed scenario behavior.
task_id: undertake-36-specification-revision
description: Adopt the scenario branch and handle semantic amendments without silent changes.
tags: [undertake, discovery, behaviour, fire]
initial_prompt: >-
  Use undertake: a specification handoff names an implementation issue, its
  existing task branch, scenario paths and exclusions. The branch has a draft
  scenario PR. A later base update conflicts with an allocated scenario and
  changes its behavior; another conflict is purely mechanical. Explain branch
  adoption, implementation and PR handling, and both updates. Also distinguish
  an implementation defect, a faulty binding and a wrong scenario. Explain
  only; do not perform external actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: agent_judge
    description: Branch adoption, red-green delivery and scoped amendment are preserved
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer explains using the handoff's branch and
      scenario paths, adopting its worktree or attaching one to that existing
      branch, verifying allocated scenarios, establishing expected behavioral
      failure, implementing to green, and reusing the existing PR on that branch.
      The prompt asks for explanation, not execution of these actions.
      It permits a mechanical conflict resolution preserving agreed text and behavior; a semantic
      conflict pauses only affected behavior for an explicit operator decision,
      recorded on the implementation or specification issue, while unaffected
      work continues. Implementation defects are fixed in implementation and
      faulty bindings or fixtures repaired without seeking a scenario amendment.
      A wrong, incomplete or ambiguous scenario needs operator agreement before
      accepting new behavior, then changes stay in the same branch and PR.
      Score 0 for silent semantic substitution, a second feature branch or PR,
      or invented actions; otherwise 0.5 for a material omission.
