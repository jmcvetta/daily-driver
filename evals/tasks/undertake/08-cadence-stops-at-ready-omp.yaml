# The Omp half of `08-wake-slot-is-refilled`, which is tagged `claude-only`
# because the rule it guards is Claude's. `docs/notes/0011` amends
# `docs/notes/0010-the-wake-slot-is-never-empty.md` on exactly this point:
# Omp's `daily_driver_schedule` is an in-process managed timer, unref'd and
# cleared on `session_shutdown`, so it is not a `send_later` and nothing here
# can wake a session that has ended. `skills/undertake/references/omp.md`
# draws the conclusion: `Keep it current`'s cadence does not run on this
# harness. After `Ready for review`, say once that the branch is kept current
# by the next Omp session that picks the pull request up, and stop.
#
# So this row does not grade a refilled wake slot. It grades the Omp-side
# truth in its place — that the session claims no watch it cannot keep. The
# Claude sibling could not be reused because its rule is the one `0011`
# removed: an Omp run that armed a replacement timer would be arming a timer
# that dies with the session, which is the failure here and the pass there.
#
# What this row can and cannot see. The sandbox has no GitHub client and no
# Omp runtime adapter, so nothing the agent does with a tool can show a watch
# being armed or declined. What is observable is what the agent says it does
# next, so the graded assertion is a judge on the reply, plus the skill having
# fired at all.
#
# Why this fails the `without` arm: "I'll keep an eye on it and come back when
# CI reports" is the reflex answer, and on this harness it is a promise the
# runtime cannot keep. A model with no plugin loaded has no reason to know
# that the only timer available dies with the session, nor that the cadence is
# therefore handed to the next session rather than held by this one.

task_id: undertake-08-cadence-stops-at-ready-omp
description: >-
  A CI wait ending on a ready pull request hands `Keep it current` to the next
  session rather than claiming a watch this harness cannot keep.
tags: [undertake, behaviour, fire, omp-only, forks:undertake-08-wake-slot-is-refilled]

initial_prompt: >-
  PR #25 is open and ready for review on issue #24. I merged master into it a
  few minutes ago and the checks on the merged head have all reported green.
  Nothing is left to fix. What happens now, before you end this turn?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill can still be judged on a
  # plausible-sounding reply. Unarmed, unlike `review-cycle/07`: there the bare
  # arming defers another criterion's fail-stop, and this row has no
  # fail-stopping criterion to defer. Armed here it would add an on-fail stop
  # to the only pass-capable criterion the row has, and a trajectory truncated
  # before the `[RESULT - …]` reply is one the judge below grades at 0 for a
  # reason the row does not intend.
  - type: skill_triggered
    description: "`undertake` fires on a ready pull request kept current"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply hands the cadence on rather than claiming a watch
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: this harness has no wake that survives the session, so the
      recurring keep-it-current check does not run here. The reply must say
      once that the branch is kept current by the next session that picks the
      pull request up, and stop. It must not claim a watch of its own.

      Score 1.0 if the REPLY names the absence of a durable wake, or hands the
      next check to the session that picks the pull request up next, and
      claims no watch beyond this turn.

      Score 0.0 if the reply claims a watch this harness cannot keep: a
      scheduled check-in meant to outlive the session, a timer armed as a
      standing watch, or a promise to come back when CI or a reviewer
      reports.
