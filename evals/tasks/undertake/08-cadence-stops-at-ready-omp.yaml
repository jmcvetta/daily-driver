# The Omp half of `08-wake-slot-is-refilled`, which is tagged `claude-only`
# because the rule it guards is Claude's. `docs/notes/0022-the-merge-is-
# mechanical.md` splits `Keep it current` into the merge and the watch. On
# this harness the watch is a detached hub process —
# `skills/undertake/references/omp.md` names the call — because
# `daily_driver_schedule` is an in-process managed timer, unref'd and cleared
# on `session_shutdown`, and `docs/notes/0011` measured that nothing else
# here can wake a session that has ended. A watch that lives only in the
# session dies with it; the loop survives it.
#
# So this row grades the Omp-side truth in 0022's shape: the session arms a
# watch that survives it rather than one that dies with the session, and it
# does not hand the whole cadence to a future session that may never come.
# The Claude sibling could not be reused because its rule is the wake slot's:
# an Omp run here arms a process instead, and the slot rule stays Claude's.
#
# What this row can and cannot see. The sandbox has no GitHub client and no
# Omp runtime adapter, so nothing the agent does with a tool can show a
# process being started. What is observable is what the agent says it does
# next, so the graded assertion is a judge on the reply, plus the skill
# having fired at all.
#
# Why this fails the `without` arm: "I'll keep an eye on it and come back
# when CI reports" is the reflex answer, and an in-session timer is the
# plausible wrong one — both are watches that die with the session. A model
# with no plugin loaded has no reason to know that the merge is mechanical
# and that a process can run it after the session is gone.

task_id: undertake-08-cadence-stops-at-ready-omp
description: >-
  A ready pull request's keep-current watch on Omp is a detached process the
  session arms, not a timer that dies with the session or a promise to check
  later.
tags: [undertake, behaviour, fire, omp-only, forks:undertake-08-wake-slot-is-refilled]

initial_prompt: >-
  PR #25 is open and ready for review on issue #24. I merged master into it a
  few minutes ago and the checks on the merged head have all reported green.
  Nothing is left to fix. What happens now, before you end this turn?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill can still be judged on a
  # plausible-sounding reply. Unarmed, unlike `review-cycle/07`: there the bare
  # arming defers another criterion's fail-stop, and this row has no
  # fail-stopping criterion to defer. Armed here it would add an on-fail stop
  # to the only pass-capable criterion the row has, and a trajectory truncated
  # before the `[RESULT - …]` reply is one the judge below grades at 0 for a
  # reason the row does not intend.
  - type: skill_triggered
    description: "`undertake` fires on a ready pull request kept current"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply arms a watch that survives the session
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: `Keep it current`'s watch on this harness is a detached hub
      process the session arms at ready — one that runs the mechanical
      base-merge loop after the session is gone — and every turn that lands
      back on the pull request still takes the catch-up look, the
      base-currency read whose BEHIND answer runs `Keep it current`'s merge.

      Score 1.0 if the REPLY arms or names a watch that survives the session —
      a detached hub process running the keep-current loop, or plainly a
      process that merges the base branch after the session ends — whether or
      not it also names the catch-up look.

      Score 0.0 if the reply's only watch dies with the session — an
      in-session timer, a scheduled reminder of the session's own runtime, a
      promise to check again when CI or a reviewer reports — or if it hands
      the cadence to a future session with no watch surviving this one.
