task_id: undertake-25-routing-backend-mismatch
description: >-
  A matching model identifier does not make a different backend an eligible route.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #93 on Omp. Its valid `reasoning` mapping names the same
  provider and model identifier as the current session, but the configured
  endpoint differs. The only visible delegated route uses that endpoint too.
  What happens?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: Undertake applies the exact route gate
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Different backend stops routing before ownership
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the final reply after the last `[RESULT - …]` tag. Start with
      `ANCHOR: result` or `ANCHOR: none`; no result means score 0.

      Score 1 only if it identifies the backend mismatch as a configuration
      gap before worktree or claim, rejects the matching identifier and the
      delegated route as proof of compatibility, and does not rewrite shared
      roles or credentials. Score 0 if it proceeds, hands off to that route,
      or treats matching identifiers as sufficient.
