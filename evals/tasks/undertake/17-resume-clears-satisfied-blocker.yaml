# Without this row, an old PR body and label can stay blocking after the
# branch itself proves that the required human apply and state commit happened.
task_id: undertake-17-resume-clears-satisfied-blocker
description: >-
  Current branch evidence satisfies a Tofu apply blocker, so the blocker and
  PR human label are removed while an unrelated approval blocker remains.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-escalation/shared
      mount_point: .fixture
pre_run:
  - command: bash .fixture/setup.sh resume-applied
    timeout: 30
  - command: >-
      printf '%s\n' 'Tofu apply completed by authorized operator; updated state
      committed as 1a2b3c4; this is current branch evidence.'
      >.fixture/current-state-evidence.txt
  - command: >-
      printf '%s\n' 'Summary' '' 'Blockers' '- Waits on a human apply.'
      '- Required security approval remains pending.'
      >.fixture/pr-body.md
initial_prompt: >-
  Resume PR #25. Read `.fixture/current-state-evidence.txt`: it is authoritative
  current branch evidence that the apply and updated-state commit are present.
  The current PR body incorrectly still says "Waits on a human apply" and the
  PR has labels `human` and `needs-approval`. Revalidate and correct the PR body
  and labels through the documented local stub route. Remove only the satisfied
  apply blocker and `human` label. Keep the valid security-approval blocker and
  `needs-approval` label. The fixture `gh` command records operations only; it
  does not contact GitHub.
agent:
  allowed_tools: [Read, Write, Edit, Grep, Glob, Skill, Bash]
  disallowed_tools: [NotebookEdit, Agent, Task]
run_limits: {max_turns: 14, turn_timeout: 300, task_timeout: 480}
success_criteria:
  - type: skill_triggered
    description: "`undertake` revalidates an existing human blocker on resume"
    expected_skill: undertake
    skill_name: undertake
  - type: command_executed
    description: The stale PR human label is removed
    tool_name: Bash
    command_pattern: 'gh pr edit 25 --remove-label human'
    min_count: 1
    weight: 2
  - type: command_executed
    description: The corrected PR body is published
    tool_name: Bash
    command_pattern: 'gh pr edit 25 --body-file \.fixture/pr-body\.md'
    min_count: 1
    weight: 2
  - type: file_matches_regex
    description: The fixture recorded the precise label and body maintenance operations
    path: .fixture/trajectory.log
    pattern: '(?s)gh pr edit 25 --remove-label human.*gh pr edit 25 --body-file \.fixture/pr-body\.md'
    weight: 2
  - type: file_matches_regex
    description: The published body removes the satisfied apply blocker but keeps approval outstanding
    path: .fixture/published-body.md
    pattern: '(?s)Summary.*Blockers.*Required security approval remains pending.*'
    weight: 2
  - type: file_matches_regex
    description: The published body no longer claims the satisfied apply is outstanding
    path: .fixture/published-body.md
    pattern: 'Waits on a human apply'
    must_match: false
    weight: 2
  - type: agent_judge
    description: The result preserves the unrelated valid blocker
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply. Score 0 if absent.
      Score 1 only if it says the current apply and state-commit evidence
      satisfies the old blocker, removes that blocker and the PR `human` label,
      and keeps the separate security approval requirement and `needs-approval`
      label. The fixture's command and published-body trace must prove both
      updates; a promise to edit is not enough.
