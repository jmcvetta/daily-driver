# This guards the reading, for issue #146's late requirement. `SKILL.md`'s
# `Claim the issue` step says the comment carries the branch, the model, and
# the session — but names no field for any of them, and points at the
# reference files "for the fields that answer both." `references/claude.md`
# is where the exact field paths live: the designated branch is
# `session_context.outcomes[].git_repository.git_info.branches`, the
# repository it pushes to is the sibling `…git_info.repo` on the SAME
# outcome, and the model that actually served the turn is
# `external_metadata.last_served_model` — a different top-level object from
# `session_context.model` / `configured_model`, which answer what the session
# is merely *set* to run. A row that passes without the reference file being
# read is wrong, so the graded content is these specific field paths, not the
# general idea that "the branch and the model get recorded."
#
# What this row can and cannot see. The sandbox has no Claude Code Remote
# tools, so `get_session` cannot actually be called here — there is no real
# session description to read a field from. What is observable is what the
# agent says it will read, so the graded assertion is an `agent_judge` on the
# reply, plus the skill having fired at all. A positive check against a real
# `get_session` payload needs a live Claude Code Remote session, which is not
# a sandbox this harness can build.
#
# Why this fails the `without` arm: a model with no plugin loaded has no
# reason to know this harness exposes a `get_session` call at all, let alone
# its exact shape. Even a model that correctly guesses "read the session
# somehow" has no way to land on this specific nested path —
# `session_context.outcomes[].git_repository.git_info.branches` — or on the
# distinction between `external_metadata.last_served_model` (what actually
# ran) and `session_context.model` (what the session is set to run), which is
# exactly the gap this skill's reference file calls "the half of the record
# worth having."

task_id: undertake-09-session-fields-for-claim
description: >-
  Claiming an assigned issue reads the designated branch and the model that
  served the turn from specific, distinct fields on the session description.
tags: [undertake, references, fire, behaviour, claude-only]

initial_prompt: >-
  I'm handing you issue #52 to build. Before you post the claim comment, walk
  me through exactly which fields you're going to read off the session
  description to fill it in — the branch, and the model.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on an issue handed over to be worked on"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply names the specific session-description field paths
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # The empty tool surface and the permission mode are both load-bearing --
    # see docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose. `AgentJudgeCriterion` defaults to `max_turns: 50`,
    # and with an empty tool surface the judge's own system prompt still tells
    # it to reach for Bash and Read -- so a compliant judge can spend turns on
    # calls it cannot make. `task_timeout` wraps criteria checking, so a judge
    # that overruns cancels the replicate as a TIMEOUT rather than scoring it,
    # and a cancelled replicate shrinks the sample behind a reported mean. Two
    # turns is what a verdict takes: read the pre-attached transcript, call
    # `submit_verdict`. Five is margin, not budget.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must name the designated branch field as (an
      unambiguous paraphrase of) `session_context.outcomes[].git_repository.git_info.branches`
      — a nested field under the outcome matching the repository being
      pushed to, not a bare "branches" field — AND must name the model that
      actually served the turn as `external_metadata.last_served_model`,
      distinguishing it from `session_context.model` / `configured_model`
      (what the session is merely set to run, not what ran).

      Score 1.0 if the REPLY names both specific field paths (branch and
      served-model) with that nesting and that distinction intact.
      Score 0.5 if it correctly identifies one of the two fields with the
      right specificity but gets the other vague or wrong.
      Score 0.0 if the reply describes only generically "reading the
      session" with no specific field paths, or conflates the served model
      with the configured model.
