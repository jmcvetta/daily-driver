task_id: undertake-12-pauses-are-not-completion
description: >-
  A human-action pause, pending CI, or evidenced non-convergence remains
  unfinished; only merged, closed, or explicitly stopped work ends continuation.
tags: [undertake, behaviour, fire]
initial_prompt: >-
  Undertaken draft PR #25 is current but waits for a human infrastructure
  action, CI is pending, and repeated corrections have failed to fix the same
  review defect. Is the undertaking complete, and when may continuation stop?
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 60, turn_timeout: 900, task_timeout: 1200}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires on a paused undertaking"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The reply distinguishes pauses from completion
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply in AGENT OUTPUT. Score 0.0 if absent.
      Score 1.0 only if it says the undertaking is unfinished, names the human
      action, pending CI, and evidenced non-convergence as outstanding conditions,
      and says continuation ends only when the PR is merged, closed, or the user
      explicitly stops it. Score 0.0 if it calls the pauses completion, treats
      repeated failure as approval, or authorizes the human action.
