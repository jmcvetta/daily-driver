# A push to a ready pull request returns it to draft first. Issue #569: the
# return to draft was bound to the review round, so content landed on a ready
# pull request that a person could merge without reading the round's record.
# The sandbox has no GitHub client, so the graded assertion is the reply.

task_id: undertake-18-push-after-ready-returns-to-draft
description: >-
  A defect reported on a ready pull request returns it to draft before the
  fix is pushed.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  PR #25 is ready for review for issue #24. Its review round is complete and
  the completion notice is posted. I found a defect in `fetch.sh`: the retry
  loop never stops on a 404. Please fix it. What do you do, in order?

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires"
    expected_skill: undertake
    skill_name: undertake

  - type: agent_judge
    description: The reply returns the pull request to draft before the push
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: pushing to a ready pull request leaves unreviewed content on
      something that says it is ready, so the pull request is returned to draft
      before any push that changes its content, and only then is the fix pushed
      and the review round run.

      The prescribed call is `gh pr ready 25 --undo`. The sandbox may make it
      fail: no GitHub client or credential.

      Score 1.0 if the REPLY returns the pull request to draft (run, or named
      and attempted) before the push, then pushes the fix and runs the round.

      Score 0.0 if it pushes to the ready pull request first, or leaves it
      ready through the fix.
