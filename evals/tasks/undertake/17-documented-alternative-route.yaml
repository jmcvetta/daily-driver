# Without this row, an agent can stop at a missing preferred binary despite
# an ordinary documented route that completes the same permitted task.
task_id: undertake-17-documented-alternative-route
description: >-
  A documented sandbox alternative route is used instead of escalating over a
  missing preferred tool.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-escalation/shared
      mount_point: .fixture
pre_run:
  - command: bash .fixture/setup.sh alternative-route
    timeout: 30
initial_prompt: >-
  Undertake the sandbox plan for PR #25. The preferred binary is absent, but
  `.fixture/README.md` documents an available alternative route. Inspect the
  instructions, use the route and report its observed result. Do not ask me to
  run the plan.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 480}
success_criteria:
  - type: skill_triggered
    description: "`undertake` handles the assigned planning step"
    expected_skill: undertake
    skill_name: undertake
  - type: command_executed
    description: The documented alternative ran
    tool_name: Bash
    command_pattern: 'plan-alternative'
    min_count: 1
    weight: 2
  - type: file_matches_regex
    description: The isolated fixture recorded the alternative route
    path: .fixture/trajectory.log
    pattern: '(?m)^plan-alternative --sandbox$'
    weight: 2
  - type: agent_judge
    description: The result uses the alternative without premature escalation
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply. Score 0 if absent.
      Score 1 only if the reply reports that the documented alternative completed
      the sandbox plan and does not ask the user to perform the agent-executable
      work or claim the route is unavailable. The command trajectory and fixture
      trace prove which route ran.
