task_id: undertake-04-neg-untracked-ordinary-work
description: >-
  The same work as 01 and 02, with neither an issue nor an invocation. `Open
  the issue` makes the issue optional; it does not make the skill fire on every
  request. This is the row that keeps twelve steps and a review panel off a
  ten-line change.
tags: [trigger-accuracy, undertake, no-fire]

initial_prompt: "Add a retry loop to the release script."

agent:
  # See 01: `disallowed_tools`, not `allowed_tools`, is what stops a denied read
  # of `skills/undertake/SKILL.md` scoring as a fire.
  disallowed_tools: [Read, Write, Edit, NotebookEdit, Glob, Grep, Bash, Agent, Task]

run_limits:
  max_turns: 5
  task_timeout: 300
  turn_timeout: 120

# `expected_skill: none` names no skill in this plugin, so the criterion below
# is a distractor and the row passes only in silence.
success_criteria:
  - type: skill_triggered
    description: "`undertake` does not fire on ordinary work nobody invoked it on"
    expected_skill: none
    skill_name: undertake
    # A misfire has already lost the row, so there is nothing left to pay for.
    stop_early: {}
