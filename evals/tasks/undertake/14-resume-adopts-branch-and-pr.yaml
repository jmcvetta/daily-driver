task_id: undertake-14-resume-adopts-branch-and-pr
description: >-
  An issue that already has an open draft pull request and a stand-down handoff
  naming its branch is a resume: the session adopts that branch and pull
  request over its own designated branch, posts one claim naming the adopted
  branch, and opens no second pull request.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #52. It already has an open draft pull request #60 on branch
  issue-52-strict-parser and a stand-down handoff comment with a `Branch:
  issue-52-strict-parser` line, written by an earlier session. This session's
  harness designated a different, empty branch, claude/fresh-52. Explain which
  branch the worktree attaches, what the claim comment names, and what happens
  at `Open the draft`.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The existing branch and PR are adopted, not replaced
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      The prompt asks for an explanation, not for real actions. Do not require
      or reward executed actions, and do not penalise a reply that truthfully
      says it executed nothing. Equivalent meaning counts; exact phrases are
      not required.

      Score 1.0 if it says all three of: the worktree attaches the existing
      branch `issue-52-strict-parser`, fetched and not recreated from base,
      rather than the designated `claude/fresh-52`; the handoff makes the prior
      claim a resume rather than a collision, so this session still posts its
      own claim naming the adopted branch; and `Open the draft` finds and
      updates (reuses) pull request #60 with no second pull request opened.

      Score 0.5 if it correctly chooses the existing branch and updates or
      reuses pull request #60 without a duplicate, but omits the fetch and
      not-recreated detail, or omits this session's own claim and the
      handoff-based resume reasoning.

      Score 0.0 if it uses `claude/fresh-52`, recreates the task branch from
      base, treats the prior claim as a collision stop, opens a second pull
      request, does not adopt the existing branch and pull request, or gives no
      substantive answer. Any such prohibited action overrides otherwise
      correct details.
