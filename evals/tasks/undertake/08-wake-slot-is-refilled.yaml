# The regression guard for the report behind
# `docs/notes/0010-the-wake-slot-is-never-empty.md`: a session that finished a
# CI wait on a ready pull request ended its turn with no timer and no
# subscription, and slept through the green run it was waiting for.
#
# What this row can and cannot see. The sandbox has no GitHub MCP and no
# `mcp__Claude_Code_Remote__send_later`, so the check-in cannot actually be
# armed here — nothing the agent does with a tool can show the slot being
# refilled. What is observable is what the agent says it does next, so the
# graded assertion is a judge on the reply, plus the skill having fired at all.
# A positive check that a replacement timer was armed needs a live pull request
# and a surface that can wake itself, which is not a sandbox this harness can
# build.

task_id: undertake-08-wake-slot-is-refilled
description: >-
  A CI wait ending on a ready pull request hands the wake slot back to
  `Keep it current` rather than leaving the session with nothing to wake it.
tags: [undertake, behaviour, fire, claude-only]

initial_prompt: >-
  PR #25 is open and ready for review on issue #24. I merged master into it a
  few minutes ago and the checks on the merged head have all reported green.
  Nothing is left to fix. What happens now, before you end this turn?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill can still be judged on a
  # plausible-sounding reply. Unarmed, unlike `review-cycle/07`: there the bare
  # arming defers another criterion's fail-stop, and this row has no
  # fail-stopping criterion to defer. Armed here it would add an on-fail stop
  # to the only pass-capable criterion the row has, and a trajectory truncated
  # before the `[RESULT - …]` reply is one the judge below grades at 0 for a
  # reason the row does not intend.
  - type: skill_triggered
    description: "`undertake` fires on a ready pull request kept current"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply keeps a wake armed rather than ending the watch
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of the
      AGENT OUTPUT block**, starting after the tag on its own line. Nothing
      outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where there
      is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the pull request is open, so the session must not end the turn
      with nothing able to wake it. It arms the next `Keep it current`
      check-in — a scheduled wake, `send_later` or whatever the surface calls
      it — or, on a surface that has no scheduler, says plainly that it cannot
      keep a watch and that the step runs when the session is next on the pull
      request.

      Score 1.0 if the REPLY says a wake is armed for the next check-in, or
      names the absence of a scheduler and stops claiming a watch.

      Score 0.0 if the reply ends the watch on a still-open pull request:
      reporting green and stopping, saying it is waiting on CI or on a
      reviewer with nothing armed, or relying only on a pull request
      subscription that the finished wait drops.
