# Issue #449: a user's stop instruction to a standalone undertaking leaves one
# durable handoff on the task issue, not only the claim comment.
#
# What this row can and cannot see. The sandbox has no GitHub client, so no
# comment is actually posted. What is observable is what the agent says it
# does, so the graded assertion is a judge on the reply, plus the skill
# having fired at all.

task_id: undertake-14-stop-writes-one-handoff
description: >-
  A standalone undertaking with a draft pull request, told to stand down, secures its work and posts one handoff on the task issue without marking the pull request ready.
tags: [undertake, stand-down, behaviour, fire]

initial_prompt: >-
  You are running `undertake` on issue #610 alone, with no orchestrator. Its
  draft PR #611 is open on branch `feat/610-retry`, CI is red, and one review
  thread is unresolved. Stand down: I am putting the machine away.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Unarmed: an on-fail stop would truncate the trajectory before the
  # `[RESULT - …]` reply the judge below needs.
  - type: skill_triggered
    description: "`undertake` fires"
    expected_skill: undertake
    skill_name: undertake

  - type: llm_judge
    description: >-
      The reply secures the work, ends the watch, posts one handoff, and stops
    include_agent_output: true
    include_reference: false
    weight: 2
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: `undertake`'s `The stop`. Told to stop, the undertaking
      (1) commits work in progress to the existing branch and pushes it,
      (2) cancels its wake timer and watchers, (3) posts exactly one comment
      on issue #610 headed `## Handoff —` naming the branch, the pushed head,
      PR #611 as a draft, what is outstanding (red CI, the open thread) and the
      resume action, and (4) stops without marking the PR ready or closing the
      issue. It does not run a fleet `stand-down`.

      Score 1.0 if the REPLY does all four, or states unconditionally that it
      does, including naming the outstanding CI and thread.

      Score 0.5 if it posts a handoff but omits securing the work, or omits
      what is outstanding or the resume action.

      Score 0.0 if it leaves only the claim comment, marks the PR ready,
      closes the issue, or treats the stop as a fleet stand-down.
