# Fails if a Claude resume asks again despite explicit standing permission.
task_id: undertake-14-resume-standing-authorization
description: >-
  Fails if a Claude resume asks again despite explicit standing permission.
tags: [undertake, references, behaviour, fire, claude-only]

initial_prompt: >-
  I am resuming issue #52 in Claude Code. Its draft PR #60 and stand-down
  handoff name `issue-52-strict-parser`. The new session designates
  `claude/fresh-52`. My earlier instruction to this session was: "Whenever I
  resume this task, you have permission to push to its existing branch."
  The session requires explicit user permission before pushing to a branch
  other than its designation; it does not require fresh permission each time.
  Explain which branch and PR you will use and whether anything is needed
  from me before the next push. Do not perform any actions.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires for resumed task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The reply respects the supplied authorization and preserves the resume branch
    include_agent_output: true
    include_reference: false
    weight: 3
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the final `[RESULT - SUCCESS]` or `[RESULT - ERROR]` reply in
      AGENT OUTPUT. Score 0.0 if no final reply exists. The user asks for an
      explanation only; do not require or reward actual pushes or GitHub writes.

      Score 1.0 only if the reply uses the existing explicit standing permission
      without asking again, keeps `issue-52-strict-parser` as the push branch,
      and reuses PR #60. It must not treat the designation mismatch as a
      collision, push to `claude/fresh-52`, open a second PR, or invent a need
      to inspect an unavailable authorization contract before proceeding.
      Score 0.0 if any requirement fails. Branch/PR evidence identifies the
      branch; the earlier user instruction supplies permission.
