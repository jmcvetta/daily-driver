# Without this row, stale-blocker cleanup can remove a valid human-only
# apply/state requirement merely because current evidence does not mention it.
task_id: undertake-17-unresolved-apply-remains-blocking
description: >-
  A resumed Tofu PR remains blocked when apply and updated-state evidence are
  still absent.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-escalation/shared
      mount_point: .fixture
pre_run:
  - command: bash .fixture/setup.sh apply-still-owed
    timeout: 30
  - command: >-
      printf '%s\n' 'Current branch has no apply receipt and no updated-state
      commit. The infrastructure diff still requires both.'
      >.fixture/current-state-evidence.txt
  - command: >-
      printf '%s\n' 'Blockers' '- Waits on a human apply. Apply and commit the
      updated state before merge.' >.fixture/pr-body.md
initial_prompt: >-
  Resume PR #25. The branch has a Tofu diff. Read
  `.fixture/current-state-evidence.txt`: the required apply receipt and updated
  state commit are still absent. The existing Blockers section and `human`
  label accurately describe this outstanding apply requirement. Keep the PR
  draft and identify the exact apply-and-state evidence still needed. Do not
  claim that a Tofu plan itself is a human action.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 300, task_timeout: 420}
success_criteria:
  - type: skill_triggered
    description: "`undertake` revalidates a still-outstanding Tofu requirement"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The result retains only the actual apply/state dependency
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply. Score 0 if absent.
      Score 1 only if the reply keeps PR #25 incomplete, identifies the Tofu
      apply and committed updated state as the outstanding human-only
      dependency, and does not say that plan is human-only. Missing current
      evidence is not proof the apply happened.
