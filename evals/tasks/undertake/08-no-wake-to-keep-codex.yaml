# The Codex half of `08-wake-slot-is-refilled`, which is tagged `claude-only`
# because the rule it grades is Claude Code's. `undertake`'s `Keep it current`
# says the cadence needs a durable wake and points at the reference files for
# whether the harness has one. `skills/undertake/references/codex.md`:
#
#   "No wake on this harness is known to outlive the turn that armed it, so
#   `Keep it current`'s cadence does not run here. After `Ready for review`, say
#   once that the watch is the catch-up look below, and stop."
#
#   "The catch-up look is the first read of every turn that lands back on the
#   pull request. ... `BEHIND` runs `gh pr update-branch <number>` — `Keep it
#   current`'s merge — before the turn continues; `DIRTY` is the conflict stop."
#
#   "This is the Omp answer arrived at for a different reason. Omp has a timer
#   and it is measured to die with the session; Codex has no timer this plugin
#   has found at all."
#
# A row that passes without the reference file being read is wrong, so the
# graded content is the hand-off and the refusal to claim a watch.
#
# Why the Claude sibling could not be reused: it grades a wake left armed before
# the turn ends — `0010`'s never-empty slot, which `0011` scopes to Claude Code.
# A Codex run against that rubric would fail for correctly refusing to claim a
# watch its harness cannot keep.
#
# Why not the Omp fork either: it grades the same hand-off, and it would be the
# closer template — but an arm tag claims exactly one arm, so the Codex arm
# needs its own file or it does not measure this at all. The reason differs too,
# and the rubric below accepts either statement of it: Omp's timer dies with the
# session, and Codex has no timer at all.
#
# What this row can and cannot see. The sandbox has no scheduler and no GitHub
# client, which is the position a real Codex session is in. What is observable
# is what the agent says it will do, so the graded assertion is an `agent_judge`
# on the reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded, told a ready
# pull request is green and asked what happens before the turn ends, says the
# work is done and stops — or invents a watch it cannot keep. That the correct
# answer is a stated hand-off to the next session, and that claiming a watch is
# specifically worse than skipping one, lives only in this skill.

task_id: undertake-08-no-wake-to-keep-codex
description: >-
  A ready pull request on a harness with no durable wake is handed on in a
  line, rather than watched by a cadence that cannot run.
tags: [undertake, references, behaviour, fire, codex-only, "forks:undertake-08-wake-slot-is-refilled"]

initial_prompt: >-
  PR #25 is open and ready for review on issue #24. I merged master into it a
  few minutes ago and the checks on the merged head have all reported green.
  Nothing is left to fix. What happens now, before you end this turn?

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on a ready pull request kept current"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply hands the cadence on rather than claiming a watch
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: this harness has no wake that outlives the turn, so the reply
      must say the branch will be caught up by the catch-up look — the read
      every turn that returns to the pull request takes first, whose BEHIND
      answer runs `Keep it current`'s merge — and stop there. It must NOT
      claim a watch, a check-in, a cadence, a timer, a scheduled wake or a
      subscription of its own, and must not propose sleeping or polling to
      keep one.

      Saying why — no durable wake on this harness — is correct and does not
      change the score. Either reason is acceptable: that a timer here does
      not survive the turn, or that there is no timer at all.

      Score 1.0 if the REPLY names the catch-up look — the read every turn
      returning to the pull request takes, or the next session that picks it
      up — and claims no watch of its own.
      Score 0.5 if it claims no watch but does not say who keeps the branch
      current.
      Score 0.0 if it claims a cadence, timer, check-in or subscription it
      will keep, or proposes a sleep or a poll to stand in for one.
