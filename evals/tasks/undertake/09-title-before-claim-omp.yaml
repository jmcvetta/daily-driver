# Omp undertakings must set an unnamed session title before the issue claim.

task_id: undertake-09-title-before-claim-omp
description: >-
  An Omp undertaking sets the issue title before issuing its claim command.
tags: [undertake, references, behaviour, omp-only, forks:undertake-09-session-fields-for-claim]

initial_prompt: >-
  Continue an undertaking at `Claim the issue`; the issue intent, task model
  class, blocked-by graph, and task worktree were already checked. The issue is
  #52, “Rotate the Aurora access token.” Its title and body are available as
  `issue://52`, with model class `standard` and no prior claim. For this offline
  exercise, `git branch --show-current` returned `issue-52-rotate-token`, the
  push remote is `https://github.com/acme/widgets.git`, and
  `daily_driver_get_session` returned {"sessionId":"0199c0a2-7d17-7b13-a2f4-6f21f5b4e9a8",
  "sessionName":"", "model":"openai-codex/gpt-6-luna"}. Do not contact GitHub.
  The `gh` executable is an offline mock that only reports its arguments and
  never posts anything. Run the claim command through that mock after setting
  the title so the evaluation can inspect the actual tool order.

sandbox:
  template_sources:
    - type: starter_files
      files:
        - path: mocks/gh
          content: |
            #!/bin/sh
            printf 'offline GitHub mock: %s\n' "$*"
            exit 0
  mock_path_dirs: [mocks]

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake

  - type: command_executed
    description: The session-title tool is called with the exact issue title
    tool_name: Write
    command_pattern: 'daily_driver_set_session_title.*#52 Rotate the Aurora access token'
    min_count: 1
    require_success: true
    weight: 2

  - type: agent_judge
    description: The real title call precedes the offline issue-claim command
    include_agent_output: false
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      Inspect the supplied actual tool-call trace; ignore assistant narration.
      Score 1.0 only if it contains a successful Write to
      xd://daily_driver_set_session_title whose JSON content sets the exact title
      “#52 Rotate the Aurora access token”, followed later by a Bash call running
      `gh issue comment 52`. The task's gh is explicitly an offline stub. Score
      0.0 if either call is absent, the title is wrong, the claim command comes
      first, the title write failed, or a non-mock GitHub client is used.

  - type: agent_judge
    description: The exact title and offline claim are presented
    include_agent_output: true
    include_reference: false
    weight: 1
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      Grade only the final [RESULT - SUCCESS] or [RESULT - ERROR] reply. Score
      1.0 if it states the session was titled “#52 Rotate the Aurora access
      token”, presents the proposed issue claim, and says that it was not posted
      to GitHub. Score 0.0 if the claim is missing, the title differs, or it
      claims to have contacted or posted to GitHub.
