# An interactive specification must not become an unattended implementation undertaking.
task_id: undertake-35-specification-stays-interactive
description: Undertake stops and routes specification issues to interactive collaboration.
tags: [undertake, specification, behaviour, fire]
initial_prompt: >-
  Undertake issue #91, which has exactly the specification kind label and asks
  us to settle and publish a canonical specification collaboratively. What is
  the route? Explain only; no GitHub writes, branch or worktree creation.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: Undertake checks issue eligibility
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Interactive specification is not dispatched as implementation
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer stops the unattended undertaking before claim,
      route selection or worktree creation and routes to interactive
      specification collaboration, without calling the issue human-only. It
      must not claim writes occurred or suggest embark dispatch. Score 0 for
      implementation dispatch or a claimed write; otherwise 0.5 for an omission.
