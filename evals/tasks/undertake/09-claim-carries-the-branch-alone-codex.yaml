# The Codex half of `09-session-fields-for-claim`, which is tagged `claude-only`
# because the fields it names are Claude's. `undertake`'s `Claim the issue`
# always carries the branch and adds model and session provenance only where
# the harness has a session call. `skills/undertake/references/codex.md` says
# this harness has no such call, so the claim omits unavailable provenance and
# carries the branch alone.
#
# The branch comes from the harness's own git state: `git branch
# --show-current` names the branch this session works on, and `OWNER/REPO` for
# the branch link comes from the `origin` remote.
#
# A row that passes without the reference file being read is wrong, so the
# graded content is both halves: git as the branch's source, and omission of
# unavailable model and session provenance from the claim.
#
# Why the Claude sibling could not be reused: it grades specific field paths
# off `mcp__Claude_Code_Remote__get_session`, a call a Codex session does not
# have. A Codex run against that rubric would fail for correctly saying there
# is no such call.
#
# Why not the Omp fork either: it grades the same shape — branch from git and
# unavailable provenance omitted — and would be the closer template, but an
# arm tag claims exactly one arm. The Codex arm needs its own file or it does
# not measure this at all.
#
# What this row can and cannot see. The sandbox has no GitHub client and no
# session call, so the prompt supplies the two git results needed to render the
# comment. That makes the exact comment observable without pretending the
# sandbox can post it. The graded assertion is an `agent_judge` on the reply,
# plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded has no claim
# convention to fill in. Asked for the model, it can invent one or publish an
# absence diagnostic. The plugin's rule is narrower: omit unavailable
# provenance from the claim.

task_id: undertake-09-claim-carries-the-branch-alone-codex
description: >-
  A claim comment on a harness with no session call takes the branch from git
  and omits unavailable model and session provenance.
tags: [undertake, references, fire, behaviour, codex-only, "forks:undertake-09-session-fields-for-claim"]

initial_prompt: >-
  I'm handing you issue #52 to build. For this exercise, `git branch
  --show-current` returned `issue-52-retry-uploads`, and the `origin` remote is
  `https://github.com/acme/widgets.git`. Do not post anything. Show me the exact
  issue comment you would use, then explain where its branch and model values
  came from.

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on an issue handed over to be worked on"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: The reply takes the branch from git and omits unavailable provenance
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: on this Codex session there is no call that describes the
      session. The REPLY must show the proposed issue comment. That comment
      must contain the link
      `[issue-52-retry-uploads](https://github.com/acme/widgets/tree/issue-52-retry-uploads)`
      and must not mention unavailable model or session metadata.

      Outside the proposed comment, the reply must explain that the branch
      came from `git branch --show-current`, `OWNER/REPO` came from the
      `origin` remote, and unavailable model and session provenance is omitted
      from the claim.

      Score 1.0 if the proposed COMMENT contains the exact branch link without
      an unavailable metadata diagnostic, and the surrounding REPLY names git
      as the branch source and omission as the model and session treatment.
      Score 0.5 if it gets the comment or the explanation right, but not both.
      Score 0.0 if the comment says the surface supplied no model or session,
      if the reply names a session call to read the model from, or if it states
      a model as though the surface reported it.
