task_id: undertake-12-currency-precedes-current-head-ci
description: >-
  A resumed draft that is behind merges its base first, then assesses CI on the
  resulting head rather than accepting old-head green evidence.
tags: [undertake, behaviour, fire]
initial_prompt: >-
  Resume undertaking issue #24. Draft PR #25 is behind master. The old head was
  green, but merging master will create a new head. What do you assess before
  considering review or readiness?
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: skill_triggered
    description: "`undertake` fires on a resumed draft"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The reply assesses CI only after currency
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], permission_mode: default}
    prompt: |
      Find the final `[RESULT - ...]` reply in AGENT OUTPUT. Score 0.0 if absent.
      Score 1.0 only if it merges or updates the base first, then reads check runs
      and commit statuses for the resulting current head before continuing review
      or readiness. Score 0.0 if it accepts the old green result, treats currency
      as completion, or assesses CI before the merge changes the head.
