# Without this case, an ordinary failed attempt can be treated as a terminal
# blocker even when its diagnostic names an available local repair.
task_id: undertake-24-repairable-verifier-failure
description: A failed local verification is repaired and completed.
tags: [undertake, behaviour, fire]
sandbox:
  template_sources:
    - {type: template_dir, path: ../../fixtures/undertake-escalation/shared, mount_point: .fixture}
pre_run:
  - {command: bash .fixture/setup.sh evidence-repair, timeout: 30}
initial_prompt: >-
  Undertake issue #24's remaining local alpha verification. The handoff is in
  `.fixture/README.md`.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 40, turn_timeout: 600, task_timeout: 1200}
success_criteria:
  - type: command_executed
    description: The local repair runs
    tool_name: Bash
    command_pattern: 'repair-verifier'
    min_count: 1
    weight: 2
  - type: file_matches_regex
    description: The recorder shows the failed attempt, repair, and retry in order
    path: .fixture/trajectory.log
    pattern: '(?ms)^verify-target --target alpha$.*^repair-verifier$.*^verify-target --target alpha$'
    weight: 3
  - type: agent_judge
    description: The result reports the repaired verification
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final result. Score 1 only if it reports that the local alpha
      verification passed after the repair, rather than treating the initial
      failure as an unresolved blocker or asking the user to repair it. Score 0
      otherwise. The recorder establishes the action order.
