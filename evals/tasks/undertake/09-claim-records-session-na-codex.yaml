# The Codex half of `09-session-fields-for-claim`, which is tagged
# `claude-only` because the fields it names are Claude's. `undertake`'s
# `Claim the issue` carries the branch, a one-line `Model:` record, and the
# session — `session: <id>` where the id is reachable by any means the harness
# offers, `session: n/a` where it is not. Codex exposes no session id, so the
# claim records `session: n/a` — the marker, not a diagnostic about the
# missing surface. `skills/undertake/references/codex.md` says so, and sends
# the `Model:` line to what the harness states is serving the turn.
#
# The branch comes from the harness's own git state: `git branch
# --show-current` names the branch this session works on, and `OWNER/REPO` for
# the branch link comes from the `origin` remote.
#
# A row that passes without the reference file being read is wrong, so the
# graded content is both halves: the `Model:` line repeated from what the
# harness states, and `session: n/a` recorded in place of a narrated absence.
#
# Why the Claude sibling could not be reused: it grades specific field paths
# off `mcp__Claude_Code_Remote__get_session`, a call a Codex session does not
# have. A Codex run against that rubric would fail for correctly saying there
# is no such call.
#
# Why not the Omp fork either: it grades the same shape — the claim sourced
# from the adapter's session answer — and would be the closer template, but an
# arm tag claims exactly one arm. The Codex arm needs its own file or it does
# not measure this at all.
#
# What this row can and cannot see. The sandbox has no GitHub client and no
# session surface, so the prompt supplies the git results and the model the
# harness states it is running. That makes the exact comment observable
# without pretending the sandbox can post it. The graded assertion is an
# `agent_judge` on the reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded has no claim
# convention to fill in. Asked for the session, it invents an id, publishes an
# absence diagnostic, or drops the line. The plugin's rule is narrower:
# `session: n/a`, recorded rather than narrated.

task_id: undertake-09-claim-records-session-na-codex
description: >-
  A claim comment on a harness with no session id takes the branch from git,
  records the harness's model, and writes session: n/a.
tags: [undertake, references, fire, behaviour, codex-only, "forks:undertake-09-session-fields-for-claim"]

initial_prompt: >-
  I'm handing you issue #52 to build. For this exercise, `git branch
  --show-current` returned `issue-52-retry-uploads`, the `origin` remote is
  `https://github.com/acme/widgets.git`, and the harness is running model
  `gpt-5.6-sol`. Do not post anything. Show me the exact issue comment you
  would use, then explain where its branch, model, and session values came
  from.

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`undertake` fires on an issue handed over to be worked on"
    expected_skill: undertake
    skill_name: undertake

  # The finding.
  - type: agent_judge
    description: "The reply renders the claim from git, the stated model, and session: n/a"
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the claim records the model and marks the session absent. The
      REPLY must show the proposed issue comment. That comment must contain
      the link
      `[issue-52-retry-uploads](https://github.com/acme/widgets/tree/issue-52-retry-uploads)`,
      a line recording the model as `Model: gpt-5.6-sol`, and a line recording
      the session as `session: n/a` — with no prose around either line about
      where the values came from or about the surface that supplies no session
      id.

      Outside the proposed comment, the reply must explain that the branch
      came from `git branch --show-current`, `OWNER/REPO` came from the
      `origin` remote, the model came from what the harness states it is
      running, and the session id is recorded as `n/a` because Codex exposes
      none.

      Score 1.0 if the proposed COMMENT carries the exact branch link, the
      exact model line, and `session: n/a` — no absence diagnostic, no
      provenance prose — and the surrounding REPLY names those sources. Score
      0.5 if it gets the comment or the explanation right, but not both.
      Score 0.0 if the comment omits the model line or the session line,
      invents a session id, or narrates the missing surface instead of
      recording `n/a`.
