task_id: undertake-29-review-evidence-selection
description: Independent review coverage and content-based staleness examples.
tags: [undertake, behaviour, fire]
initial_prompt: |-
  Apply the undertaking readiness review-evidence predicate to each independent
  case below. The reviews are credible and independent unless stated otherwise.
  All other gates, including CI and finding dispositions, hold. For each case
  say whether review evidence permits readiness and why. Do not perform writes.

  1. A clean agent review covers current head H.
  2. A human approval covers H, published by someone other than the claim author.
  3. A review at S has only rejected findings; the relevant content at H is unchanged.
  4. Review at S, behavioral fix at H; an independent reviewer verified the fix at H.
  5. As 4, but the independent verification reports an unresolved defect.
  6. Review at S, behavioral fix at H; only the author checked the fix.
  7. A clean review at S; H is a base merge and the relevant content is unchanged.
  8. A clean review at S; H changes behavior and has no subsequent review.
  9. A clean independent review at H is published as a durable comment.
  10. A clean review at S; the content at H cannot be compared with S.
  11. A fix at H is independently reviewed by someone other than the claim author.
  12. A review at S is followed by a material scope addition at H; only the old scope was reviewed.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 30, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` owns readiness evidence"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: All fixed examples receive the correct selection and coverage decision
    include_agent_output: true
    include_reference: false
    weight: 3
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |-
      Find the reply after the last `[RESULT - …]` tag. The correct decisions
      permit 1, 2, 3, 4, 7, 9 and 11; block 5, 6, 8, 10 and 12.
      Score 1 only if all twelve decisions are correct and distinguish
      independent review, relevant content changes and unresolved defects.
      Score 0 if it permits a blocked case; otherwise score 0.5 for an
      incomplete or incorrect answer.
