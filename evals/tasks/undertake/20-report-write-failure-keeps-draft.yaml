task_id: undertake-20-report-write-failure-keeps-draft
description: >-
  A failed first-readiness report write keeps the pull request in draft and
  prevents any ready attempt.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  PR #25 is a draft for issue #24. The gate conditions hold on its current
  head, but the first-readiness report comment will fail. `gh` is an offline
  client; see `.fixture/README.md`. What happens now?

sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-readiness/shared
      mount_point: .fixture
  mock_path_dirs: [.fixture/bin]

pre_run:
  - command: bash .fixture/setup.sh report-write-fails
    timeout: 60

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`undertake` fires on a ready-gate report write failure"
    expected_skill: undertake
    skill_name: undertake

  - type: run_command
    description: A refused report write is followed by no ready attempt
    command: python3 .fixture/verify.py gate
    timeout: 30
    weight: 3

  - type: agent_judge
    description: The failed report leaves the pull request in draft
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade only actual calls and the final reply. Score 1.0 when the agent
      reads the gate evidence, attempts the `First-readiness report` comment,
      observes that write fail, makes no `gh pr ready 25` call, and accurately
      reports that the PR remains draft. Score 0.5 when it reports the failed
      write honestly but omits some gate evidence. Score 0.0 if it attempts
      ready after the failed report, claims success, asks the user, or makes no
      relevant call.
