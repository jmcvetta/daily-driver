task_id: undertake-19-frontier-session-does-not-implement-ordinary-work
description: >-
  A frontier session assigned an ordinary implementation issue hands off to
  an eligible non-frontier route or stops with the exact route gap.
tags: [undertake, issue-body, behaviour, fire]

initial_prompt: >-
  Undertake task #83. It has a settled `implementation` class and no frontier
  approval. This session is executing through Omp's `@reasoning` role, whose
  effective selector is the astra-backed `openai-codex/gpt-6-astra:high`.
  There is no configured non-frontier model-switch or delegation route in this
  session. What do you do before implementation?

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "Undertake applies the frontier execution restriction"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: The frontier session refuses implementation and reports the missing handoff route
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the final reply after the last `[RESULT - …]` tag. Start with
      `ANCHOR: result` or `ANCHOR: none`; no result means score 0.

      Score 1 only if the agent recognizes that the effective astra route is
      frontier even though the role is named `reasoning`, refuses to dispatch
      or implement the ordinary task, and stops before branch creation or claim
      with the exact missing capability: an eligible non-frontier model-switch
      or delegation route. It must not treat the ordinary class as approval for
      frontier execution or ask the user to approve an unrelated scope
      expansion. Score 0 if it implements, claims the issue before routing,
      supervises implementation on frontier, or assumes the role name makes
      the route non-frontier.
