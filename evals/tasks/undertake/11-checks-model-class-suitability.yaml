task_id: undertake-11-checks-model-class-suitability
description: >-
  A standalone undertaking checks task metadata and current-session capability
  evidence before claiming or changing the repository.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake the supplied simulated task #52. Its valid task body has
  `## Model class` set to `standard`; the latest issue comment confirms that
  class remains required and says eligibility is based on this session, not
  its model id. These supplied issue facts are complete; no live lookup is
  needed.

  The settled work updates `skills/undertake/SKILL.md`, its three harness
  routes, and the behavior evaluation. It requires routine multi-file changes,
  meaningful evaluations, and local failure diagnosis; no advanced invariant.
  Session A can do that work and has a current rubric assessment of
  `advanced`; its model id is unmapped. Session B can do that work and is
  assessed `standard`; its model id is unmapped. Session C can only perform
  bounded mechanical transformations and is assessed `mechanical`. Session D
  has only a concrete model id, with no capability evidence or assessment.

  Use `undertake` to decide only the capability gate; do not create a worktree,
  claim, or implement. First state the effective required class from the body
  and comment. Then give concise pass/stop decisions for A through D. Finally,
  say what A must do if it visibly falls back to `mechanical` during work.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Capability evidence passes equal/stronger sessions and stops unknown ones before worktree or claim
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it states that the effective class is `standard` based
      on the supplied valid task metadata and confirming comment before the
      capability decision; ties that class to the task's routine multi-file
      work, evaluations, and failure diagnosis; allows A and B without a
      model-id mapping; and stops C and D before worktree/claim, with D told
      what evidence is missing. It must also stop A's further implementation
      after the visible fallback pending reassessment. The rationale must use
      the supplied task-specific evidence. Score 0.0 if it starts C or D,
      relies on model identity alone, or delegates solely to cut cost.
