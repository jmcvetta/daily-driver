task_id: undertake-11-checks-model-class-suitability
description: >-
  A standalone undertaking checks task metadata and current-session capability
  evidence before claiming or changing the repository.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #52, a settled `standard` task.
  The current session has an explicit, rubric-based assessment of `advanced`
  capability for this turn, but its concrete model id has no class mapping.
  Explain what happens before the claim. Then consider a second session with
  a current rubric-based `standard` assessment and an unmapped model id. Finally,
  consider the same task if the session capability is unassessable.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Capability evidence passes equal/stronger sessions and stops unknown ones before worktree or claim
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it says both the advanced and equal-standard sessions
      may undertake directly after validating task metadata, and explains that
      their explicit current-session capability assessments are evidence
      grounded in the shared rubric, not model-id mappings. It must say the
      unassessable session stops before worktree creation, claim, or repository
      changes; model identity alone never establishes eligibility. Score 0.0
      if it demands a provider catalog for the unmapped ids, delegates merely
      to cut cost, or starts an unassessable session.
