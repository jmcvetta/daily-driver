task_id: undertake-11-checks-model-class-suitability
description: >-
  A standalone undertaking checks task metadata and current-session capability
  evidence before claiming or changing the repository.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake assigned task #52, stopping at its capability gate. Its task body has one valid
  `## Model class` section requiring `standard`. The latest issue comment says
  the requirement is still `standard` and must not be lowered to fit an
  available session. The settled work changes the undertaking skill, its
  three harness routes, and the behavior evaluation. It needs routine
  multi-file coordination, meaningful evaluations, and local failure
  diagnosis; no difficult interacting invariant remains.

  The operator reports four possible implementation sessions. A uses a model
  id absent from the provider catalog, but has demonstrated sustained
  reasoning about interacting invariants and can do this task's work. B also
  has an unmapped model id, but has demonstrated routine multi-file
  coordination, meaningful tests, and local diagnosis. C can only apply
  specified substitutions with direct checks. D reports a concrete model id
  but no examples or capability assessment. After A begins, a visible runtime
  fallback leaves it able to do only C's kind of work.

  Which sessions may proceed past the capability gate, which must stop, and
  what happens after A's fallback? Explain the order of the gate and the
  evidence for each decision. The supplied issue and operator facts are
  complete; this is a gate exercise, not a request for a live issue lookup,
  worktree, claim, or implementation.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Capability evidence passes equal/stronger sessions and stops unknown ones before worktree or claim
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if the reply validates the effective `standard` class
      from the body and confirming comment before assessing capability;
      relates that class to the task's multi-file coordination, evaluations,
      and diagnosis; allows A as stronger and B as equal based on their
      reported capabilities despite unmapped model ids; stops C as below the
      requirement and D for missing capability evidence before worktree or
      claim; and stops A's further implementation after the visible fallback
      pending reassessment. Grade the decisions and ordering, not exact
      wording or labels for the sessions. Score 0.0 if it starts C or D,
      relies on model identity alone, lowers the class, or delegates solely
      to cut cost.
