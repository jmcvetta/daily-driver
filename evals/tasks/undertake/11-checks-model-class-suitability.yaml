task_id: undertake-11-checks-model-class-suitability
description: >-
  A standalone undertaking checks task metadata and current-session capability
  evidence before claiming or changing the repository.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #52. Its settled design changes `skills/undertake/SKILL.md`,
  all three `skills/undertake/references/*.md` capability routes, and this
  behavior evaluation. It needs routine multi-file coordination, meaningful
  evaluation coverage, and local failure diagnosis. It does not involve
  concurrency correctness, security boundaries, data integrity, or a novel
  algorithm. The task's required class is `standard`.
  The issue comments confirm that the settled requirement remains `standard`
  and clarify that eligibility is about this session's capability, not its
  concrete model id.

  Session A's current-session evidence shows it can implement settled,
  repository-pattern changes across multiple files, write meaningful behavior
  evaluations, and diagnose local failures; its rubric assessment is
  `advanced`. Its concrete model id is unmapped.
  Session B has the same evidence for routine multi-file implementation,
  meaningful evaluations, and local diagnosis; its rubric assessment is
  `standard`. Its concrete model id is also unmapped.
  Session C is limited to bounded transformations with explicit rules and
  direct checks; it cannot coordinate routine multi-file changes, write
  meaningful evaluations, or diagnose implementation failures. Its assessment
  is `mechanical`.
  Session D has only a concrete model id, with no current capability evidence
  or assessment.

  Explain which sessions may begin and what each stop requires before worktree
  creation, claim, or implementation. Then suppose Session A visibly falls
  back to a `mechanical` model during implementation; explain what happens
  before it continues.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`undertake` fires for assigned task work"
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Capability evidence passes equal/stronger sessions and stops unknown ones before worktree or claim
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if it first accounts for the issue comments and validates
      the effective `standard` requirement, then compares task demands with
      the shared rubric and supplied capability evidence. It must let Session
      A (`advanced`) and Session B (`standard`) proceed without a model-id
      mapping; stop Session C (`mechanical`) and Session D (identity only)
      before worktree creation or claim, report the needed class and missing
      evidence for D, and stop Session A from further implementation after its
      visible fallback pending reassessment. Require a concrete task-specific
      rationale; repeating labels alone scores 0.0. Also score 0.0 if it starts
      either stopped session or delegates solely to cut cost.
