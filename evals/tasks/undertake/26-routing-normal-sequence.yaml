task_id: undertake-26-routing-normal-sequence
description: >-
  Normal routing verification is sequenced without a rejected tool batch.
tags: [undertake, behaviour, fire]

initial_prompt: >-
  Undertake task #95 on Omp. Its family and provider have a valid
  `implementation` mapping. Explain the tool sequence before creating the
  worktree if the mapping requires a model change, if it requires only an effort
  change, and if both model and effort already match.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: Undertake applies the routing policy
    expected_skill: undertake
    skill_name: undertake
  - type: agent_judge
    description: Routing runs alone and normal verification is status
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Find the final reply after the last `[RESULT - …]` tag. Start with
      `ANCHOR: result` or `ANCHOR: none`; no result means score 0.

      Score 1 only if it calls the routing tool alone in its assistant tool
      batch; treats model and effort changes as pending until the next worker
      assistant response verifies actual execution; defers worktree creation,
      claim and implementation until verification; and explains that a matching
      route needs no redundant switch. Normal verification is informative status,
      not an error, rejection or user confirmation. Score 0 if it batches work
      with routing, accepts the setter as proof, treats pending as an error, or
      requires a switch for the already matching route.
