# The Codex half of `05-references-search-not-list`, which is tagged
# `claude-only` because the call it names is Claude's. `SKILL.md` names the
# operation — find Dependabot's open pull requests — and points at the reference
# files for the call. `skills/deps/references/codex.md` names Codex's:
#
#   "Finding what is behind. `gh pr list --search "is:open
#   author:app/dependabot"`. `app/dependabot` is search syntax for a GitHub App
#   rather than a login, so the filter is written into the search query and not
#   into `--author`."
#
# A row that passes without the reference file being read is wrong, so the
# graded content is that the author filter lives inside `--search`, and why a
# plain listing cannot express it.
#
# Why the Claude sibling could not be reused: it grades
# `mcp__github__search_pull_requests`, a call a Codex session does not have.
#
# **This row grades the same rule as the Omp fork, and that is not an
# oversight.** Codex has no GitHub tool of its own, so its route is `gh` in the
# shell exactly as Omp's is. It needs a file of its own regardless: the arms are
# routed by exclusion and an arm tag claims exactly one arm, so a row cannot be
# in the Omp arm and the Codex arm at once. Without this file the Codex arm
# would simply not measure the route at all, which is the silent gap the whole
# arm exists to close.
#
# What this row can and cannot see. The sandbox has no GitHub client, so the
# search cannot actually be run — there are no Dependabot pull requests here.
# What is observable is what the agent says it will do, so the graded assertion
# is an `agent_judge` on the reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded reaches for
# `gh pr list --author dependabot`, which is the obvious spelling and returns
# nothing — Dependabot is an App, and `--author` takes a login. That
# `app/dependabot` is search syntax, and therefore that the filter has to move
# into the query, is stated nowhere but this skill's own reference file.

task_id: deps-05-gh-search-not-list-codex
description: >-
  Finding Dependabot's open pull requests puts the author filter inside a
  `--search` query, because a plain listing cannot express an App author.
tags: [deps, references, fire, behaviour, codex-only, "forks:deps-05-references-search-not-list"]

initial_prompt: >-
  Dependabot has a pile of PRs open on this repo and I want them all rolled
  into one upgrade. Before you run anything, tell me exactly which command
  you're going to use to find them — the command and the query — and why a
  plain pull-request listing won't do it.

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`deps` fires on a bulk upgrade of Dependabot's open pull requests"
    expected_skill: deps
    skill_name: deps

  # The finding.
  - type: agent_judge
    description: The reply puts author:app/dependabot inside a --search query
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must name a `gh pr list --search` (or `gh search
      prs`) call whose QUERY carries the author filter as `author:app/dependabot`
      — and must say why a plain listing will not do it: Dependabot is a GitHub
      App rather than a user, so `--author` cannot name it.

      Score 1.0 if the REPLY puts `app/dependabot` inside the search query and
      gives that reason, in any wording.
      Score 0.5 if it names the search query correctly but does not say why a
      plain listing fails.
      Score 0.0 if it reaches for `gh pr list --author dependabot` (or any
      `--author` spelling), names an MCP call a Codex session does not have, or
      names no specific command at all.
