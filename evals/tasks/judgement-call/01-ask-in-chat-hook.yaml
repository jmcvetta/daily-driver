# This guards the reading, for issue #146's late requirement: which mechanism
# stops the question widget moved out of `SKILL.md` — which only says the
# widget "is closed on both harnesses, each by its own deny adapter" and
# points at the reference files — and into `references/claude.md`, which
# names it: the `PreToolUse` hook `hooks/ask-in-chat.py`, which fires the
# moment the model reaches for `AskUserQuestion`, refuses the call, and tells
# the model to put the question in the chat reply instead. A row that passes
# without the reference file being read is wrong, so the graded content is
# that file name and what it does.
#
# What this row can and cannot see. Whether `hooks/ask-in-chat.py` is actually
# wired into this eval sandbox's hook configuration is not something this row
# controls or can verify — `coder_eval` runs the plugin's skills, not
# necessarily its hooks. So this row does not depend on the hook actually
# firing and denying a real `AskUserQuestion` call; it grades what the agent
# says about the mechanism when a genuine trade-off survives `judgement-call`'s
# own gate and has to be asked. A positive check that the hook actually fired
# needs the hook itself wired into the harness under test, which this row
# does not assume.
#
# Why this fails the `without` arm: a model with no plugin loaded has every
# reason to reach for `AskUserQuestion` for a genuine two-way trade-off — that
# is what the tool is for — and no reason at all to know that this repository
# denies it via a named hook file, let alone that file's name. "I asked with
# the widget" or a bare "I'm asking in the chat instead" without naming the
# mechanism is the honest answer with no plugin in context.

task_id: judgement-call-01-ask-in-chat-hook
description: >-
  A genuine trade-off survives the gate and gets asked in the chat reply; the
  reply names the hook that forces prose over the question widget.
tags: [judgement-call, references, fire, behaviour, claude-only]

initial_prompt: >-
  Before you write the report, I genuinely don't have a preference: JSON or
  CSV output, your call — go ahead and ask me which, and tell me in your
  answer why you're not going to pop up the question widget for it.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 8
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`judgement-call` fires at the moment a genuine trade-off is put to the user"
    expected_skill: judgement-call
    skill_name: judgement-call

  # The finding.
  - type: agent_judge
    description: The reply names the hook that denies the question widget
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # The empty tool surface and the permission mode are both load-bearing --
    # see docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose. `AgentJudgeCriterion` defaults to `max_turns: 50`,
    # and with an empty tool surface the judge's own system prompt still tells
    # it to reach for Bash and Read -- so a compliant judge can spend turns on
    # calls it cannot make. `task_timeout` wraps criteria checking, so a judge
    # that overruns cancels the replicate as a TIMEOUT rather than scoring it,
    # and a cancelled replicate shrinks the sample behind a reported mean. Two
    # turns is what a verdict takes: read the pre-attached transcript, call
    # `submit_verdict`. Five is margin, not budget.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must ask the JSON-vs-CSV question in plain prose
      (not merely invoke a question-widget tool with nothing said in the
      reply), and it must name the actual mechanism that keeps the widget
      closed on this repository: a `PreToolUse` hook, named
      `hooks/ask-in-chat.py` (or unambiguously described as that specific
      hook file), that intercepts `AskUserQuestion` and redirects the
      question into the chat reply.

      Score 1.0 if the REPLY asks the question in prose and names that
      specific hook file (or an unambiguous paraphrase naming it as a
      `PreToolUse` hook file for this exact purpose).
      Score 0.5 if it asks in prose and correctly says the widget is
      disabled/blocked here, but does not name the hook file.
      Score 0.0 if the reply relies on the question widget with no prose
      question, or gives no specific reason the widget was avoided.
