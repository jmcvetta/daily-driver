# Approval of a decomposition cannot approve changed scenario behavior.
task_id: specification-02-approval-and-amendment
description: Product agreement, decomposition agreement and scenario amendment remain distinct.
tags: [specification, behaviour, fire]
initial_prompt: >-
  Use specification: an independent reviewer approved our implementation PR,
  and I approved a proposed decomposition, but I have not agreed to a scenario
  changing the previously agreed retention period. Can the separate
  specification issue be completed? Also distinguish correcting a typo from
  changing retention. Explain only; do not write or claim external actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: Specification workflow is consulted
    expected_skill: specification
    skill_name: specification
  - type: agent_judge
    description: Separate approval and amendment boundaries are preserved
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer refuses to treat reviewer or decomposition
      approval as operator agreement to the retention change, pauses affected
      behavior for an explicit operator decision while unaffected work may
      continue, and distinguishes a meaning-preserving typo from a behavioral
      amendment. The decision is recorded on the implementation task or its
      specification issue; after agreement the scenarios change in the same
      task branch and PR. A separate specification issue completes when the
      operator has agreed to the scenarios and the handoff records the
      implementation task issue, task branch, scenario paths, and applicable
      allocation or exclusions; it does not wait for implementation or merge.
      Score 0 for silent approval, a merged-document prerequisite, or claimed
      external actions; otherwise 0.5 for a material omission.
