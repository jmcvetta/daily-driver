# An unresolved product decision must not masquerade as agreed scenario behavior.
task_id: specification-01-interactive-draft
description: Interactive scenario authoring preserves unresolved product decisions and the implementation handoff.
tags: [specification, behaviour, fire]
initial_prompt: >-
  Use specification to collaborate on offline editing in a supported TypeScript
  repository without an acceptance harness. Conflict resolution is undecided.
  A separate specification issue and implementation task are planned. Explain
  the next steps, branch establishment, agreement and handoff; propose concise
  candidate scenarios for review without deciding conflict behavior. Do not
  write files or claim actions.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: Specification workflow is consulted
    expected_skill: specification
    skill_name: specification
  - type: agent_judge
    description: Scenario agreement and implementation handoff retain unresolved intent
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer explains leaving conflict resolution for the
      operator without inventing behavior, establishing or adopting the
      implementation task branch via task-worktree, invoking atdd for the
      missing harness, and proposing concise scenarios for interactive operator
      review. It explains recording agreement and exclusions on the issue and
      completing the separate specification issue once agreement and a handoff
      naming the implementation task issue, task branch, scenario paths and
      applicable allocation or exclusions are recorded. Do not require these
      future actions to have occurred: the prompt forbids writing files.
      Implementation and merge are not prerequisites. Score 0 for invented
      agreement, claimed actions, or a separately merged document prerequisite;
      otherwise 0.5 for a material omission.
