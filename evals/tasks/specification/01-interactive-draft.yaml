# A draft with unresolved product decisions must not masquerade as a complete specification.
task_id: specification-01-interactive-draft
description: Interactive drafting keeps unresolved decisions on the issue and uses stable textual requirements.
tags: [specification, behaviour, fire]
initial_prompt: >-
  Use specification to collaborate on an offline editing specification. The
  operator has not decided conflict resolution. The repository establishes a
  local draft API. Explain the next steps and the document contract; do not
  write files or claim an approval or merge.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: Specification workflow is consulted
    expected_skill: specification
    skill_name: specification
  - type: agent_judge
    description: Unresolved intent stays outside the authoritative specification
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the answer keeps conflict resolution on the issue for
      the operator, does not invent it, and says a document with an omission
      preventing implementation is not ready. It names docs/specs/<feature>.md,
      stable requirement IDs and acceptance criteria, textual authority over
      summaries and diagrams, independent review and explicit operator approval
      and merge. Score 0 if it claims an external action occurred or treats
      agent review as approval; otherwise score 0.5 for a material omission.
