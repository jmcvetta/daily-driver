# This guards the rule issue #161 reversed. `issue-deps` used to state the
# evidence, name the edge, and *ask*; it now writes the edge and reports the
# write, and stops only where the edge contradicts something the user has
# said. So the graded behaviour is two things at once: a write actually
# attempted, and a reply that reports it rather than requesting permission for
# it.
#
# The prompt is the firing moment the skill names — a dependency discovered
# while planning work — and the evidence is a statement about the code (a
# function that does not exist yet), not a shared subject. Both halves of the
# evidence test are therefore satisfied in the prompt itself, which is what
# leaves the write as the only correct move.
#
# What this row can and cannot see. Like `01`, this sandbox is `SKILL.md`'s
# `Which client` branch 2: no `gh` on the PATH, `GITHUB_TOKEN` / `GH_TOKEN`
# present. Whether the write lands against the live repository is not
# something this row controls — the token may not carry write access, and the
# same #191 -> #199 edge is what `01` writes, so a duplicate refusal
# (*"Target issue has already been taken"*) is an ordinary outcome here. The
# pair is shared with `01` on purpose: between them the suite names one live
# relationship rather than two. The judge below therefore grades the report,
# not the write's success, and accepts a reported failure as long as the edge
# and its evidence are named.
#
# The reporting rule asks for both ends *by repository and number*, and the
# prompt says "in this repo", so a fully-qualified `owner/repo#191` on both
# ends is more than the prompt invites. The judge therefore grades the
# repository as identifiable rather than as qualified on each end — named once
# for both ends is enough. That is the most this prompt can fairly ask, and it
# is still more than a bare `#191` with no repository named anywhere, which is
# the reporting defect `The traps` warns about.
#
# Why this fails the `without` arm: a model with no plugin, told about a
# dependency while planning, explains the ordering in prose and moves on. It
# has no reason to reach for a GitHub issue-dependency graph at all, let alone
# to resolve this repository's fallback script, and every reason to ask before
# mutating somebody's tracker.

task_id: issue-deps-02-write-the-edge-without-asking
description: >-
  A dependency discovered while planning is written to the graph and reported,
  rather than proposed and held for confirmation.
tags: [issue-deps, fire, behaviour]

initial_prompt: >-
  I'm planning the work on issue #191 in this repo. Its fix has to call the
  config loader that #199 adds, and that function doesn't exist yet — #191
  can't be written until #199 lands. `gh` isn't installed in this environment.
  Tell me how you want to sequence this before I start.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still score on a
  # command typed for an unrelated reason. Left unarmed for the reason
  # `01` gives: there is no fail-stopping criterion here for a bare arm to
  # defer.
  - type: skill_triggered
    description: "`issue-deps` fires on a dependency discovered while planning"
    expected_skill: issue-deps
    skill_name: issue-deps

  # Half the finding: the edge is written, and it is written from the blocked
  # side, which is the only side REST accepts it from.
  - type: command_executed
    description: The blocked-by edge is written without waiting for confirmation
    tool_name: Bash
    command_pattern: 'add\s+[''"]?(?:[\w.-]+/[\w.-]+)?#?191[''"]?\s+[''"]?(?:[\w.-]+/[\w.-]+)?#?199'
    min_count: 1
    weight: 2

  # The other half: the write is reported rather than requested.
  - type: agent_judge
    description: The reply reports the edge it wrote, and does not ask permission to write it
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must report a blocked-by edge it has already acted
      on — #191 blocked by #199, both ends named by number, the repository
      they are in identifiable rather than assumed, and the evidence the edge
      came from (#191's fix calls a function #199 adds). It must NOT ask the
      user for permission to write that edge, and must not offer to write it
      later or present it as a proposal awaiting a yes.

      The repository is identifiable either way: `owner/repo#191`, or a bare
      `#191` where the reply says once which repository both ends are in. A
      reply that names no repository at all fails that half.

      A reply that reports the write as having FAILED — a duplicate edge, a
      refusal, a missing token — still satisfies the rule, provided it names
      the edge and the evidence and did not ask first.

      Three things make up a complete report: both ends named by number, the
      repository identifiable, and the evidence.

      Score 1.0 if the reply supplies all three and treats the write as
      already attempted.
      Score 0.5 if it treats the write as already attempted but supplies only
      one or two of the three.
      Score 0.0 if the reply asks for permission to write the edge, offers it
      as a proposal, or reports no edge at all.
