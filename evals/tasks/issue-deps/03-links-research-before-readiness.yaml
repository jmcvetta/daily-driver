# Membership is truthful before dispatch readiness. Both research issues can
# be linked; missing class metadata prevents dispatch, not membership.
# The prompt supplies the facts and the run writes no edge.
task_id: issue-deps-03-links-research-before-readiness
description: >-
  A classed and a classless research issue can both be linked; the latter
  remains undispatchable until its required model class is supplied.
tags: [issue-deps, behaviour, fire]

initial_prompt: >-
  Make #769 and #770 sub-issues of epic #662 in this repo. Both are labelled
  `research` and neither is blocked. #769 states its question, purpose,
  evidence plan, permitted actions, deliverable and stopping rule, and holds
  one `## Model class` section with `complex` and a rationale. #770 is
  equally complete but has no `## Model class` section. Say what you do for
  each issue. This is a dry run: do not call any tracker tool or write any
  edge, and describe the decision you would make.

agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]

run_limits:
  max_turns: 60
  turn_timeout: 900
  task_timeout: 1200

success_criteria:
  - type: skill_triggered
    weight: 0
    description: "`issue-deps` fires on a parent write"
    expected_skill: issue-deps
    skill_name: issue-deps
  - type: agent_judge
    description: Membership follows evidence while dispatch requires a class
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      FIRST, FIND THE REPLY. The agent output is a whole-turn transcript; the
      reply starts after the last `[RESULT - …]` tag and runs to the end.
      Begin the rationale with `ANCHOR: result` or `ANCHOR: none`. If no result
      tag exists, write `ANCHOR: none` and score 0.0.

      Score 1.0 only if the reply links both #769 and #770 as sub-issues of
      #662 while keeping their `research` kind, and names #770's missing
      model class as a dispatch-readiness defect without defaulting it to
      `routine`, relabelling, inventing scope, or dispatching either issue.
      Score 0.5 if it links both but omits the dispatch defect. Score 0.0 if
      it refuses either truthful link, invents a class, or dispatches work.
