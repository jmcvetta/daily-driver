task_id: issue-03-update-preserves-valid-requirements
description: >-
  Updating a task body preserves what is valid: the affected part of the
  specification changes, the rest stays, unrelated text is not reflowed, and
  the readiness test runs again. The existing body is supplied in the prompt
  because the sandbox has no GitHub to read it from.
tags: [issue, behaviour, fire]

initial_prompt: >-
  Here is a task issue body:

  ---

  ## Outcome

  The sync job retries a failed upload instead of dropping the batch on the
  floor.

  ## Scope

  Change `sync/uploads.py` only. Non-goal: no retry for auth failures — those
  re-authenticate once and fail loudly.

  ## Design

  Three retries with fixed 5-second delay, in `upload_batch`.

  ## Verification

  `tests/test_uploads.py::test_retry_on_timeout` covers the happy path; a
  retry test does not exist yet and is part of this task.

  ## Model class

  `standard`

  The design is settled and the existing retry path supplies the local pattern.

  ---

  Update it: the fixed delay is wrong — the service owner has confirmed the
  delay must be exponential backoff. Do not post anything; show me the exact
  updated body.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`issue-body` fires on a body being revised"
    expected_skill: issue-body
    skill_name: issue-body

  - type: agent_judge
    description: The update changes the affected requirement and preserves the rest
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the REPLY proposes an updated task body. The design section
      must say exponential backoff. The outcome, scope and non-goal, verification,
      and valid `Model class` section must survive unchanged in substance.
      Valid requirements dropped, reworded into different requirements, or a
      trailing concrete `Model:` line are preservation failures.

      Score 1.0 if only the design changes and all valid requirements survive.
      Score 0.5 if the design changes correctly but a valid requirement is
      reworded beyond substance. Score 0.0 if a valid requirement is gone, the
      class section is gone, a concrete `Model:` remains, or there is no body.
