# Without this case, issue revisions can invent a paid-run approval prerequisite.
task_id: issue-21-campaign-bound-survives-update
description: A task revision retains a specified campaign bound without inventing approval.
tags: [issue, behaviour, fire]
initial_prompt: >-
  Revise this task issue body to add an offline report-format check. Keep the
  other requirements and show the body without posting it.

  Run the alpha evaluation campaign.

  *Two cases are named*
  *A measured result returns*
  *The record holds both*

  ## Summary

  Run one metered alpha campaign of two cases and record the result.

  ## Model class

  `implementation`

  The target and campaign bound are specified.

  ## Detail

  Use the configured alpha route once, for two cases. Retain the source of the
  assignment and report the result. Do not expand the target or case count.

  ---
  Model: fixture-model
  Harness: Omp 18.8.4
  session: fixture-session
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: The revision preserves scope without inventing an extra paid-run gate
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final reply. Score 1 only if it includes an updated task body
      with the offline report-format check, one metered alpha run of two cases,
      the target and count restriction, assignment-source retention, and the
      existing attribution. It must not require a separate paid-run grant or
      treat its own handoff as proof of user approval. Score 0 otherwise.
