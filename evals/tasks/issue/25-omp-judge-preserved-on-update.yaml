task_id: issue-25-omp-judge-preserved-on-update
description: A task revision resolves the implicit Omp judge without losing supplied requirements.
tags: [issue, behaviour, fire]
initial_prompt: >-
  Revise this existing task issue body to add a check that the recorded run
  includes each case outcome. Do not post it or run commands. Show the exact
  updated body and whether it is ready for unattended execution.

  Existing body:

  Run the focused Omp GPT 6 Luna evaluation and record the outcomes.

  *One subject runs alone*
  *The record holds each result*
  *Boundaries stay in place*

  ## Human brief

  Run only `tasks/issue/01-open-a-task-issue.yaml` against the Omp Luna
  experiment. Claude judging is not authorized. The assignment authorizes
  one run and its recording; reruns are allowed only after repairing a failed
  case and must stay within the same bounds.

  ## Model class

  `routine`

  The selected subject, task, and run bounds are fixed.

  ## Detail

  Use `make evals-run-omp-gpt-6-luna TASKS='tasks/issue/01-open-a-task-issue.yaml'`
  with `REPEATS=1 JOBS=1`. Preserve the recorded run identifier and the
  requested and observed subject and judge identities. The Omp experiment
  selects `openai-codex/gpt-6-luna`; its task criterion pins the semantic
  judge to Claude Code / `claude-sonnet-5`. The Makefile's unset `JUDGE`
  retains that task-pinned judge. The validated `omp-gpt-6.1-sol` judge is
  compatible with this no-tools semantic criterion. Do not change scope,
  execution bounds, rerun restrictions, attribution, or authorization.

  ---
  Model: fixture-model
  Harness: Omp 19.1.1
  Session: fixture-session

  Repository evidence: `evals/experiments/omp-gpt-6-luna.yaml` selects only
  the subject; `Makefile` documents the unset-JUDGE behavior and separate
  `JUDGE=` selector; `evals/judges/omp-gpt-6.1-sol.yaml` marks that non-Claude
  judge validated. No Claude use is authorized for this task.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 15, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: The revised handoff names a judge and preserves the valid requirements
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade only the final reply. Begin rationale with `ANCHOR: result` or
      `ANCHOR: none`; score 0 if no final result exists. The updated body must
      add the case-outcome check and explicitly use
      `JUDGE=omp-gpt-6.1-sol` (or another evidenced compatible validated
      non-Claude judge) in the execution command and required recording/rerun
      path. A bare target is not ready. Keep the original task, Omp Luna
      subject, single repeat, one job, one authorized run, repair-only reruns,
      attribution and requested/observed identity reporting. Preserve the
      `routine` class and trailing provenance. Do not add an approval gate or
      The revised body may instead leave judge selection to the operator only
      if the body itself says the command is not ready for unattended
      execution; a warning outside the body does not satisfy this condition.
      Score 1 only if every condition holds; 0.5 if useful but one minor
      condition is missing; 0 if the default route is presented as authorized
      or ready, or valid requirements or provenance are lost.
