task_id: issue-05-bug-body-gets-no-task-contract
description: >-
  The body contract is defined for `task` alone. A bug issue's body is
  written under the rules that already govern it and acquires no task
  sections, no model metadata, no generic template. `issue-body` still
  fires — it owns every body — and imposes nothing.
tags: [issue, behaviour, fire]

initial_prompt: >-
  Open a bug issue: the login endpoint returns a 500 when the email address
  contains a plus sign. Do not post anything; show me the exact issue body
  you would open.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`issue-body` fires on a bug body being written"
    expected_skill: issue-body
    skill_name: issue-body

  - type: agent_judge
    description: The bug body carries no invented task sections or model class
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the REPLY proposes a bug issue body. It must record the bug —
      what happens and under what input. The task contract is defined for
      `task` issues alone, so the body must NOT carry `Model class`, a trailing
      `Model:` line, or a generic task template.

      Score 1.0 if the body records the bug plainly and carries no model
      metadata or invented task machinery. Score 0.5 if it records the bug but
      adds harmless boilerplate. Score 0.0 if it adds `Model class`, `Model:`,
      task machinery, or no body.
