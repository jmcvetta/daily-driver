# Without this case, a writer can omit attribution from a new reply because
# an earlier reply in the same thread already names the same writer.
task_id: issue-20-provenance-separate-comments
description: Separate comments each carry their author's attribution.
tags: [issue, behaviour, fire]
initial_prompt: |
  Draft two separate comments for an issue thread. The first reports that the
  offline reproduction fails on macOS. The second reports that it also fails
  on Linux. Show the exact text of each comment separately. Do not post them.
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: Both independently authored comments carry attribution
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final [RESULT - ...] reply. Score 0 if absent. Score 1 only if
      there are two separately identified draft comments, the first reports
      macOS and the second reports Linux, and each comment independently
      contains a complete provenance block with Model:, Harness:, and session:
      lines. Do not assume the writer's identity. Score 0 if attribution is
      shared outside the two drafts or missing from either one.
