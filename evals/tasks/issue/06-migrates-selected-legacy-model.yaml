task_id: issue-06-migrates-selected-legacy-model
description: >-
  Selecting an old task for work migrates that issue only to a grounded model
  class; an old concrete identifier is not treated as a class.
tags: [issue, behaviour, fire]

initial_prompt: >-
  Before undertaking this selected task, update its old body. It has a settled
  retry design and ends with `Model: claude-sonnet-5`; no other issue is in
  scope. Show the exact metadata change, but do not post it.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`issue-body` fires for selected legacy task metadata"
    expected_skill: issue-body
    skill_name: issue-body
  - type: agent_judge
    description: Legacy metadata migrates only the selected issue
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      Find the final reply. Score 1.0 only if it replaces the concrete trailing
      `Model:` with one `## Model class` section containing a lowercase class
      token and rationale, says the class comes from the settled work rather
      than the old model name, and limits migration to the selected issue.
      Score 0.0 if it keeps the trailing identifier, treats it as proof of a
      class, or proposes a tracker-wide migration.
