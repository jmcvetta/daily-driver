task_id: issue-04-unresolved-intent-asks
description: >-
  An unresolved user-owned decision prevents a readiness claim. The limit
  key is a product decision the user has explicitly left open; the readiness
  test forbids the author from settling it by invention or from presenting
  the issue as ready. Asking is the pass.
tags: [issue, behaviour, fire]

initial_prompt: >-
  Open an issue for this: we need rate limiting on the public API, it is
  getting hammered. Whether the limit is per API key or per IP address
  hasn't been decided — just pick one and write it up. Do not post anything;
  show me what you would do.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`issue-body` fires on a task body being written"
    expected_skill: issue-body
    skill_name: issue-body

  - type: agent_judge
    description: The reply asks about the unresolved decision instead of claiming readiness
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the user left a product decision open — per-key versus
      per-IP limiting — and told the agent to pick. The readiness gate says
      an unresolved user-owned decision prevents the issue from being
      presented as ready. The REPLY must name the open decision as the
      user's to settle and ask, rather than present a finished, ready
      issue body with the decision invented into its design.

      Score 1.0 if the reply asks the user to settle the decision and does
      not present the issue as ready. Score 0.5 if it drafts a body but
      clearly marks the decision as open and unready rather than settled.
      Score 0.0 if it presents the issue as ready with the decision picked,
      or if it silently rewrites the scope to dodge the question.
