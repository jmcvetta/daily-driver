task_id: issue-09-inconclusive-research-does-not-unblock-task
description: >-
  A bounded inconclusive report must name its gap and resolution path and must
  not make a dependent implementation handoff ready.
tags: [issue, behaviour, fire]

initial_prompt: >-
  Revise research issue #73 with the result and tell me whether dependent task
  #74 can start. The agreed bounded investigation examined the repository's
  two documented storage adapters and their checked-in tests. Neither covers
  multi-region failover, and no permitted fixture or source describes that
  behavior. The investigation cannot determine which adapter meets the
  failover requirement. Record what was examined, why the evidence is
  insufficient, and that the missing failover contract or representative
  fixture would resolve it. The dependent task #74 has no other statement of
  the required failover behavior. Do not invent a preference or claim a
  successful answer. Show the revised findings and readiness decision without
  posting.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  - type: skill_triggered
    description: "`issue-body` fires on research findings and readiness"
    expected_skill: issue-body
    skill_name: issue-body

  - type: agent_judge
    description: Bounded inconclusive research is reported honestly and leaves dependent task unready
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade the final reply. Begin rationale with `ANCHOR: result` or
      `ANCHOR: none`; score 0 if no final result exists. It must record the
      bounded investigation and both examined sources, say precisely why the
      answer is inconclusive, and name the missing failover contract or
      representative fixture as the resolution path. It must say task #74
      remains unready because its own implementation contract is missing,
      despite the research issue's completed bounded inconclusive outcome. It
      must not invent a failover preference, treat the result as proof that an
      adapter works, or claim the closed research issue alone resolves the
      dependency. Score 1.0 when both conclusions and their evidence hold; 0.5
      for an incomplete but honest report; 0.0 if it makes #74 ready or calls
      the investigation conclusive.