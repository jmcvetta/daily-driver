# A specification issue must not inherit unattended task metadata or proposal completion.
task_id: issue-23-specification-interactive-contract
description: A specification issue preserves its collaborative workspace and merged-document completion.
tags: [issue, specification, behaviour, fire]
initial_prompt: >-
  Draft a specification issue for offline editing. The operator still needs to
  decide conflicts. Include purpose and known constraints, and explain when it
  is ready and complete. Do not post or invent the decision.
agent:
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Write, Edit, NotebookEdit, Bash, Agent, Task]
run_limits: {max_turns: 8, turn_timeout: 180, task_timeout: 400}
success_criteria:
  - type: skill_triggered
    weight: 0
    description: Issue body contract is consulted
    expected_skill: issue-body
    skill_name: issue-body
  - type: agent_judge
    description: Specification is interactive and requires an approved merged document
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 2
    max_turns: 4
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Score 1 only if the draft retains conflict resolution as an open operator
      decision on a specification issue, has no implementation model class,
      allows interactive agent work but not unattended dispatch, and requires
      explicit operator approval, operator merge of the canonical document and
      a recorded handoff for completion. Proposal acceptance alone is not that
      completion. Score 0 for invented product decisions or claims of posting;
      otherwise score 0.5 for a material omission.
