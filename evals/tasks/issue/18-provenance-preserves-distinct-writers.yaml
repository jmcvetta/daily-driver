# Without this case, an issue revision can repeat a historical writer or erase
# a different writer while removing duplicate provenance.
task_id: issue-18-provenance-preserves-distinct-writers
description: Issue body revision preserves distinct provenance in order.
tags: [issue, behaviour, fire]
initial_prompt: |
  Revise this existing bug issue body to say that the failure also occurs on
  Linux. Keep the existing report and show the complete updated body. Do not
  contact GitHub.

  Uploads fail on timeout.

  The job drops a batch after a timeout. Observed on macOS.

  ---
  Model: fixture-model-a
  Harness: Fixture 1
  session: fixture-session-a

  ---
  Model: fixture-model-b
  Harness: Fixture 2
  session: fixture-session-b

  ---
  Model: fixture-model-a
  Harness: Fixture 1
  session: fixture-session-a
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]
run_limits: {max_turns: 10, turn_timeout: 300, task_timeout: 600}
success_criteria:
  - type: agent_judge
    description: The body preserves distinct provenance without repeated historical attribution
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: claude-sonnet-5, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Find the final [RESULT - ...] reply. Score 0 if absent. Judge the complete
      proposed issue body, not explanations outside it. Score 1 only if it
      retains the timeout and macOS facts, adds Linux, and contains exactly one
      complete fixture-model-a / Fixture 1 / fixture-session-a block and one
      complete fixture-model-b / Fixture 2 / fixture-session-b block, in that
      order. A separate block for the current writer is permitted and required;
      its identity must not be invented by this judge. Any extra duplicate of a
      fixture tuple, missing field, reversed history, or missing report scores 0.
