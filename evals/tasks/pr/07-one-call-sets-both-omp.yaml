# The Omp half of `07-one-call-sets-both`, which is tagged `claude-only`
# because the call it names is Claude's. `pr`'s own `SKILL.md` says an
# existing pull request gets "Update both title and body of existing PR" but
# never says how many calls that takes. Only the reference files say it is
# one, and `skills/pr/references/omp.md` names the Omp call: "Updating an
# existing pull request as a whole — title and body together. `gh pr edit`,
# called once both are decided." A row that passes without the reference file
# being read is wrong, so the graded content is that single-invocation fact.
# It is easy to get wrong for the same reason on both harnesses:
# `pr-title/references/omp.md` names only `gh pr edit --title` and
# `pr-body/references/omp.md` names only `gh pr edit --body`, so reading
# either sibling alone suggests two separate invocations.
#
# Why the Claude sibling could not be reused: it grades one
# `mcp__github__update_pull_request` call, a call an Omp session does not
# have. An Omp run against that rubric would fail for naming its own correct
# route.
#
# What this row can and cannot see. The sandbox has no GitHub client, so
# `gh pr edit` cannot actually be run here — there is no real pull request #14
# to update. What is observable is what the agent says it will do, so the
# graded assertion is an `agent_judge` on the reply, plus the skill having fired
# at all. A positive check that one real command went out rather than two
# needs a live pull request and a working GitHub client, which is not a
# sandbox this harness can build.
#
# Why this fails the `without` arm: a model with no plugin loaded, asked to
# fix a stale title and a thin body, has every reason to run two ordinary
# `gh pr edit` invocations — one scoped to the title, one to the body, which
# is how the command is typically used one flag at a time. The convention that
# collapses both into a single invocation, once both are decided, is stated
# nowhere but this skill's own reference file.

task_id: pr-07-one-call-sets-both-omp
description: >-
  An existing pull request needing both a new title and a new body is updated
  in one `gh pr edit` invocation carrying both flags, not two.
tags: [pr, references, fire, behaviour, omp-only, forks:pr-07-one-call-sets-both]

initial_prompt: >-
  PR #14 is already open on this branch. The title's wrong and the body's
  gone stale — fix both. Before you do it, tell me exactly which GitHub
  call(s) you're going to make.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`pr` fires on an existing pull request updated as a whole"
    expected_skill: pr
    skill_name: pr

  # The finding.
  - type: agent_judge
    description: The reply sets title and body in one gh pr edit invocation
    include_agent_output: true
    include_reference: false
    weight: 2
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must say it will make ONE `gh pr edit` invocation
      (or plainly "edit the pull request once" / "a single edit call")
      carrying both the new title and the new body together, once both are
      decided.

      Score 1.0 if the REPLY commits to a single edit invocation setting both
      fields together.
      Score 0.0 if the reply proposes two separate invocations (one
      `gh pr edit --title`, then one `gh pr edit --body`), or does not commit
      to a specific call at all.
