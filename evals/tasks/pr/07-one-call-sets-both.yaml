# This guards the reading, for issue #146's late requirement: `pr`'s own
# `SKILL.md` says an existing pull request gets "Update both title and body of
# existing PR" but never says how many calls that takes. Only
# `references/claude.md` says it is one: "Updating an existing pull request as
# a whole — title and body together. `mcp__github__update_pull_request`,
# called once both are decided." A row that passes without the reference file
# being read is wrong, so the graded content is that sentence entire — the
# MCP call, and one of it. The count alone is both easy to get right unaided
# and easy to get wrong for the wrong reason: `pr-title`'s own reference file
# mentions only `title` and `pr-body`'s mentions only `body` — reading either
# sibling alone suggests two separate calls.
#
# What this row can and cannot see. The sandbox has no GitHub MCP, so
# `mcp__github__update_pull_request` cannot actually be called here — there is
# no real pull request #14 to update. What is observable is what the agent
# says it will do, so the graded assertion is an `agent_judge` on the reply,
# plus the skill having fired at all. A positive check that one real API call
# went out rather than two needs a live pull request and the GitHub MCP,
# which is not a sandbox this harness can build.
#
# Why this fails the `without` arm: a model with no plugin loaded, asked to
# fix a stale title and a thin body on an existing GitHub pull request, has
# every reason to reach for `gh pr edit`, and no reason at all to know this
# repository routes the update through `mcp__github__update_pull_request`
# instead. That routing is stated nowhere but this skill's own reference
# file, and it is the half of the rule the bare arm cannot guess.
#
# The rubric graded the wrong half until #158 ran it. It asked only whether
# the reply committed to ONE call rather than two, and a single
# `gh pr edit` invocation carrying both `--title` and `--body` is a perfectly
# ordinary unaided answer — so the bare arm scored 1.000 on the finding while
# the treated arm scored 0.400, a spread of -0.600. "One call, not two" is
# content a model produces unaided; "the MCP call, not `gh`" is not. The rule
# below now requires both halves, which is what the sibling rows
# `pr-title/07` and `pr-body/07` already required, and what their clean
# spreads (+0.733 and +0.867 in the same run) come from.
#
# Measured after the rewrite, five replicates per arm: the finding went from
# -0.600 to +0.200, and the row from -0.400 to +0.133. The sign is fixed and
# the row is still weak, because the rule is only as good as what reaches it:
# `pr` does not fire here at all, so four of five treated replicates proposed
# `gh pr edit`, raw `curl`, or nothing specific, and never read the reference
# file that names the MCP call. The rubric is no longer the thing holding
# this row down. The trigger is.

task_id: pr-07-one-call-sets-both
description: >-
  An existing pull request needing both a new title and a new body is updated
  in one call carrying both fields, not two separate calls.
tags: [pr, references, fire, behaviour, claude-only]

initial_prompt: >-
  PR #14 is already open on this branch. The title's wrong and the body's
  gone stale — fix both. Before you do it, tell me exactly which GitHub
  call(s) you're going to make.

agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`pr` fires on an existing pull request updated as a whole"
    expected_skill: pr
    skill_name: pr

  # The finding.
  - type: agent_judge
    description: The reply sets title and body in one update_pull_request call
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`: it spawns a Claude Code SDK agent on the
    # same route as the agent under test, so it grades on the subscription
    # rather than needing an `ANTHROPIC_API_KEY` this project does not have.
    # The empty tool surface and the permission mode are both load-bearing --
    # see docs/notes/0014-the-judge-runs-on-the-subscription.md.
    # Bounded on purpose. `AgentJudgeCriterion` defaults to `max_turns: 50`,
    # and with an empty tool surface the judge's own system prompt still tells
    # it to reach for Bash and Read -- so a compliant judge can spend turns on
    # calls it cannot make. `task_timeout` wraps criteria checking, so a judge
    # that overruns cancels the replicate as a TIMEOUT rather than scoring it,
    # and a cancelled replicate shrinks the sample behind a reported mean. Two
    # turns is what a verdict takes: read the pre-attached transcript, call
    # `submit_verdict`. Five is margin, not budget.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule has two halves, and BOTH must hold. The reply must name
      `mcp__github__update_pull_request` — the GitHub MCP call — and it must
      make exactly ONE of them, carrying both the new title and the new body
      together.

      A plausible naming variant of the MCP call is acceptable ("the GitHub
      MCP update-pull-request tool", "update_pull_request"). `gh pr edit` is
      NOT a variant of it: it is the other tool.

      What matters is the call the reply proposes to ACTUALLY RUN. A reply
      naming `gh pr edit` only to rule it out — "not `gh pr edit`; one
      `update_pull_request` call carrying both fields" — proposes the MCP
      call, and scores on that rather than on the mention.

      Score 1.0 if the REPLY names the MCP call as the mechanism and commits
      to a single one of it setting both fields together.
      Score 0.5 if it names the MCP call as the mechanism but proposes two of
      them, one per field.
      Score 0.0 if the reply proposes `gh pr edit` as the actual mechanism —
      including a single invocation carrying both `--title` and `--body` —
      or names no specific call at all.
