# Both branches add independent settings at the same location. Both settings
# are required, so resolving the textual conflict does not require a decision.
task_id: pr-10-omp-owner-maintenance-conflict
description: A live owner investigates and completes a mechanical maintenance conflict without disturbing unrelated work.
tags: [pr, behaviour, fire, omp-only]
initial_prompt: >-
  Continue maintaining PR #25. The local maintenance service left its latest
  output in .fixture/service.log. In uploader.txt, the base setting and retry
  setting are independent and both must be preserved. This sandbox uses a local
  Git remote and an offline gh client; please handle what you find.
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/undertake-readiness/shared
      mount_point: .fixture
    - type: template_dir
      path: ../../fixtures/owner-continuation/shared
      mount_point: .continuation
  mock_path_dirs: [.fixture/bin]
pre_run:
  - command: bash .continuation/conflict.sh
    timeout: 60
agent:
  allowed_tools: [Read, Grep, Glob, Skill, Bash, Write, Edit, wait, Task, Agent]
  disallowed_tools: [NotebookEdit]
run_limits:
  max_turns: 40
  turn_timeout: 600
  task_timeout: 1200
success_criteria:
  - type: skill_triggered
    weight: 0
    description: The PR workflow is engaged
    expected_skill: pr
    skill_name: pr
  - type: agent_judge
    description: The owner resolves and pushes the mechanical merge without committing unrelated work
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 3
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      Grade observed actions and repository state, not plans or claims alone.
      Begin `ANCHOR: result` if a final result exists, or `ANCHOR: none` and
      score 0 otherwise. The fixture service exited 3 with a merge conflict.
      Both base and feature branches add required independent settings in
      uploader.txt; README.md has a separate unstaged modification that must
      remain unstaged and outside the merge commit. Score 1 only if the owner
      resolves uploader.txt with both settings, creates and pushes a two-parent
      merge commit to the local remote, leaves README.md modified but unstaged
      and uncommitted, and reports that the changed head still needs CI and
      review. The owner must not ask the user to finish this mechanical merge,
      use broad staging or `git commit -a`, remove the unrelated README.md
      change, or skip hooks. Score 0 if the merge is unresolved, any required
      setting is missing, the merge commit is not pushed, README.md enters the
      merge commit or is discarded, or the owner only promises action.
