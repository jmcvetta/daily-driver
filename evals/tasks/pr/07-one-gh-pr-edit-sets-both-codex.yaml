# The Codex half of `07-one-call-sets-both`, which is tagged `claude-only`
# because the call it names is Claude's. `pr`'s own `SKILL.md` says an existing
# pull request gets "Update both title and body of existing PR" and never says
# how many calls that takes; only the reference files say it is one.
# `skills/pr/references/codex.md`: "Updating an existing pull request as a whole
# — title and body together. `gh pr edit`, called once both are decided."
#
# A row that passes without the reference file being read is wrong, so the
# graded content is that single invocation.
#
# Why the Claude sibling could not be reused: it grades one
# `mcp__github__update_pull_request` call, which a Codex session does not have.
#
# **This row grades the same rule as the Omp fork, and that is not an
# oversight.** Codex has no GitHub tool of its own, so its route is `gh` in the
# shell exactly as Omp's is. It needs a file of its own regardless: the arms are
# routed by exclusion and an arm tag claims exactly one arm, so a row cannot be
# in the Omp arm and the Codex arm at once. Without this file the Codex arm
# would simply not measure the route at all, which is the silent gap the whole
# arm exists to close.
#
# It is easy to get wrong for the same reason on every harness:
# `pr-title/references/codex.md` names only `gh pr edit --title` and
# `pr-body/references/codex.md` names only `gh pr edit --body-file`, so reading
# either sibling alone suggests two separate invocations.
#
# What this row can and cannot see. The sandbox has no GitHub client, so
# `gh pr edit` cannot be run — there is no real pull request #14. What is
# observable is what the agent says it will do, so the graded assertion is an
# `agent_judge` on the reply, plus the skill having fired at all.
#
# Why this fails the `without` arm: a model with no plugin loaded, asked to fix
# a stale title and a thin body, has every reason to run two ordinary
# `gh pr edit` invocations — one per flag, which is how the command is typically
# used. The convention that collapses both into one invocation, once both are
# decided, is stated nowhere but this skill's own reference file.

task_id: pr-07-one-gh-pr-edit-sets-both-codex
description: >-
  An existing pull request needing both a new title and a new body is updated
  in one `gh pr edit` invocation carrying both, not two.
tags: [pr, references, fire, behaviour, codex-only, "forks:pr-07-one-call-sets-both"]

initial_prompt: >-
  PR #14 is already open on this branch. The title's wrong and the body's gone
  stale — fix both. Before you do it, tell me exactly which call(s) you're
  going to make.

agent:
  # Recorded and NOT enforced on this harness — `CodexAgent` logs both lists and
  # confines nothing. Written anyway so the row reads the same as its siblings.
  allowed_tools: [Read, Grep, Glob, Skill, Bash]
  disallowed_tools: [Write, Edit, NotebookEdit, Agent, Task]

run_limits:
  max_turns: 10
  turn_timeout: 300
  task_timeout: 600

success_criteria:
  # Without this, a run that never reached the skill could still be judged on
  # a plausible-sounding reply. Left unarmed for the reason `undertake/08`
  # gives: there is no fail-stopping criterion here for a bare arm to defer.
  - type: skill_triggered
    description: "`pr` fires on an existing pull request updated as a whole"
    expected_skill: pr
    skill_name: pr

  # The finding.
  - type: agent_judge
    description: The reply sets title and body in one gh pr edit invocation
    include_agent_output: true
    include_reference: false
    weight: 2
    # `agent_judge`, not `llm_judge`, for the reason
    # docs/notes/0014-the-judge-runs-on-the-subscription.md gives: it grades on
    # the subscription rather than needing an `ANTHROPIC_API_KEY` this project
    # does not have. It stays a Claude judge in this arm — the judge reads a
    # transcript, and which harness produced it changes nothing about reading
    # it. Bounded for the reason the Claude rows state: the default
    # `max_turns: 50` lets a judge with an empty tool surface spend turns on
    # calls it cannot make, and one that overruns cancels the replicate as a
    # TIMEOUT rather than scoring it.
    max_turns: 5
    turn_timeout: 120
    agent:
      type: claude-code
      model: claude-sonnet-5
      allowed_tools: []
      disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor]
      permission_mode: default
    prompt: |
      You are grading one reply against a single rule.

      FIRST, FIND THE REPLY. The AGENT OUTPUT block you have been given is a
      whole-turn transcript, not a reply. `[ASSISTANT] …` starts each block of
      the agent thinking aloud — only the first line of a block carries that
      tag — and a final `[RESULT - SUCCESS] …` or `[RESULT - ERROR] …` carries
      the answer the user actually received.

      **The reply is the text from the last `[RESULT - …]` tag to the end of
      the AGENT OUTPUT block**, starting after the tag on its own line.
      Nothing outside the AGENT OUTPUT block is the agent's.

      Begin your rationale with `ANCHOR: result` or `ANCHOR: none`. Where
      there is no `[RESULT - …]` tag, write `ANCHOR: none` and score 0.0.

      The rule: the reply must say it will make ONE `gh pr edit` invocation (or
      plainly "edit the pull request once" / "a single edit call") carrying both
      the new title and the new body together, once both are decided.

      Score 1.0 if the REPLY commits to a single edit invocation setting both
      fields together.
      Score 0.0 if the reply proposes two separate invocations (one
      `gh pr edit --title`, then one `gh pr edit --body-file`), names an MCP
      call a Codex session does not have, or does not commit to a specific call
      at all.
