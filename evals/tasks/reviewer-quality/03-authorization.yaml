task_id: reviewer-quality-03-authorization
description: Review a change to project export access checks.
tags: [omp-only, reviewer-quality]
skip: true
reference:
  directory: references/03-authorization
sandbox:
  template_sources:
    - type: template_dir
      path: ../../fixtures/reviewer-quality/shared
      mount_point: .fixture
    - type: template_dir
      path: ../../fixtures/reviewer-quality/cases/03-authorization
      mount_point: .case
    - type: template_dir
      path: ../../fixtures/reviewer-quality/shared/routes
      mount_point: routes
pre_run:
  - command: bash .fixture/setup.sh 03-authorization
    timeout: 30
initial_prompt: >-
  First read `xd://daily_driver_set_session_title`, then invoke it with
  `{"title":"Reviewer-quality case 03"}`. Next read `.review-brief`,
  `.review-diff`, and `.review-current-diff`. Dispatch exactly one reviewer
  task for this local-only review; do not publish to GitHub or dispatch again.
  In the reviewer task, require it first to read and invoke its own
  `xd://daily_driver_get_session`. Its raw result must be exactly one JSON
  object with `reviewer_reported_identity` (returned model ID or `unreported`),
  `verdict` (`clear` or `defects`), and `findings` (objects with `location`,
  `trigger`, `impact`, and `severity`). The identity is harness-selected, not
  proof of backend-served identity. Include the brief and local diff verbatim.
  Return the reviewer's raw JSON unchanged as your final response. Do not write
  files, review or invent findings, or use a fallback.
success_criteria:
  - type: agent_judge
    description: Review finding accuracy and impact
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    weight: 1
    max_turns: 5
    turn_timeout: 120
    agent: {type: claude-code, model: omp-gpt-6.1-sol, allowed_tools: [], disallowed_tools: [Bash, Read, Glob, Grep, Write, Edit, NotebookEdit, WebFetch, WebSearch, Task, Agent, Skill, Monitor], permission_mode: default}
    prompt: |
      Key: `exports.py` reverses the owner check and raises PermissionError
      when `user.id == project.owner_id`, while allowing other users to archive
      the project. Trigger: owners cannot export and non-owners can export.
      Impact: unauthorized disclosure of project archives. Valid location:
      `exports.py`, the conditional in `export_project`. Expected verdict:
      report this defect. Score only if trigger, impact, and location match.
      Return exactly {score: 0|1, rationale: string, findings: [strings]}.
      Findings use TP:authorization, FN:authorization, FP:<evidence>, or
      UNEXPECTED_VALID:<evidence>. Consolidate duplicates. An unkeyed finding
      with credible code evidence is UNEXPECTED_VALID, not FP. Ignore style.
