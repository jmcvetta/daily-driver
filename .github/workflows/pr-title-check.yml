# Enforce Conventional Commits on the PR *title*, which squash-merge turns
# into the master commit subject release-please parses.
#
# `squash_merge_commit_title = "PR_TITLE"` in infra/github/repository.tf is
# what makes this the only place the convention is required: working commits
# on a branch stay prose, and the title is what reaches master. So the type in
# the title is the only thing that decides whether merging cuts a tag, and
# what kind.
#
# The types below are release-please's, not this action's. The action defaults
# to the `conventional-commit-types` (Angular) list, which is a near-miss: it
# omits `feature`, a type release-please treats as a synonym for `feat` in
# both DefaultVersioningStrategy (minor bump) and the changelog preset
# (visible, under "Features"). The list here is instead the default `types` of
# `conventional-changelog-conventionalcommits`, which is what release-please
# writes notes with while release-please-config.json declares no
# `changelog-sections`.
#
# Rejecting anything outside that list is the point, and both ways a rejected
# title fails are silent. `wip:` and `hotfix:` match no entry in the preset, so
# release-please parses the commit and then drops it from the changelog,
# releasing nothing. A *miscased* type is worse, because it half-works: the
# changelog lowercases the type before matching it (`findTypeEntry`) while
# `DefaultVersioningStrategy` compares `commit.type === 'feat'` literally, so
# `Feat:` renders a correct-looking "Features" entry and bumps a **patch** — a
# feature shipped as a patch release, with no error anywhere.
#
# This check is permanent. The pull request title is the only input
# release-please reads, and the failure modes above are silent, so there is no
# version of this repository that stops wanting it guarded.
#
# It is nonetheless a check rather than a *required* context until the branch
# protection configuration names it. Branch protection requires this context
# alongside `CI Success` and `preview`. Which contexts are required is a
# branch-protection decision, made in infra/github/branch_protection.tf, not
# here.
name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      # A push cannot change the title, so this looks redundant. It is not:
      # status checks are resolved per head SHA, so without a run on the new
      # commit `validate-title` reads as "expected" on the merge box against
      # the commit that will actually merge.
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Listed visible-in-the-changelog first (feat..revert), then the
          # seven release-please recognizes but hides. Comments cannot go
          # inside this block: the action splits it on newlines and trims,
          # with no comment handling, so a comment line becomes a type that
          # matches nothing and is printed back to the contributor in the
          # "Available types" list on failure.
          types: |
            feat
            feature
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          # A scope is optional and stays that way. This repository releases
          # one package, so there is nothing a scope could route to — and
          # release-please routes by the paths a commit touches in any case,
          # never by scope.
          requireScope: false
