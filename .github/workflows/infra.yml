# Parse infra/github/*.tf before a person does.
#
# Nothing else in this repository reads those files: the stack is applied by
# hand, because CI holds no GitHub-admin credentials and so cannot run `plan`.
# Without this workflow the first thing to parse the configuration would be
# someone mid-`tofu apply` against live branch protection. `make check-infra`
# moves that discovery here, and needs no credentials: `tofu init
# -backend=false` fetches the provider without touching state or the GitHub
# API.
#
# It is its own workflow rather than a leg of ci.yml so that `paths:` below
# can gate it. That block is GitHub's own filter, evaluated before a runner is
# allocated, so a change to skills/ starts nothing here at all — no job, no
# skipped check, no toolchain download. The cost being avoided is two
# downloads, on every push, for a directory that changes a few times a year.
#
# The filter is the leg's real input set rather than its directory: `tofu
# validate` reads infra/**, and the root Makefile holds the `check-infra`
# command line.
#
# Safe to gate this way only because `infra` is not a required check. Branch
# protection requires `CI Success`, `validate-title`, and `preview`; ci.yml
# carries no `paths:` filter for exactly this reason: a path-filtered workflow
# does not report a skipped check, it reports nothing, and a required check
# that never reports leaves every pull request pending forever. So requiring
# this one means dropping the filter first. Nothing checks that.
name: Infra

on:
  push:
    branches: [master]
    # Repeated under pull_request: GitHub Actions does not read YAML anchors.
    # A drift between the two halves is invisible on a pull request and
    # surfaces later as a merge to master that skipped the leg the pull
    # request ran.
    paths:
      - infra/**
      - Makefile
  pull_request:
    paths:
      - infra/**
      - Makefile

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from infra/github/.opentofu-version, which is also
      # what a version manager reads on a laptop, so CI and a developer
      # install the same OpenTofu from the same pin.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: infra/github/.opentofu-version
          # The default wrapper replaces `tofu` with a script that swallows
          # exit codes to republish them as step outputs, which would make a
          # failing `fmt -check` or `validate` report green.
          tofu_wrapper: false

      - name: tofu fmt, init and validate
        run: make check-infra

      # After the step above, and only works there. `check-infra` runs `tofu
      # init`, which rewrites .terraform.lock.hcl in place; this step asks git
      # what that rewrite changed. Run first, it would diff a clean checkout
      # against itself and pass every time.
      #
      # A lock file that init would rewrite is not a pin anyone is reading:
      # every init offers a diff nobody meant to make, and the habit is to
      # commit it unread. Initialising against the registry records an `h1:`
      # hash for every platform the provider publishes, so a lock carrying one
      # platform's hash is rewritten on the next init, on any machine. This
      # step fails on that and prints the diff, which is the fix.
      - name: Lockfile staleness check
        run: |
          if ! git diff --quiet -- infra/github/.terraform.lock.hcl; then
            echo "::error::infra/github/.terraform.lock.hcl is stale. See the diff below." >&2
            git diff -- infra/github/.terraform.lock.hcl >&2
            exit 1
          fi
