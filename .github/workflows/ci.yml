# Continuous integration.
#
# `CI Success` is a required status on master. It always runs one job and
# selects component checks from the changed paths.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: .github/ci-filters.yml
          predicate-quantifier: some-with-excludes
      - name: Validate component selection
        env:
          FILTER_PLUGIN: ${{ steps.filter.outputs.plugin }}
          FILTER_RUNTIME: ${{ steps.filter.outputs.runtime }}
          FILTER_EVAL: ${{ steps.filter.outputs.eval }}
          FILTER_ISSUE: ${{ steps.filter.outputs.issue }}
          FILTER_OMP: ${{ steps.filter.outputs.omp }}
          FILTER_SHARED: ${{ steps.filter.outputs.shared }}
          FILTER_UNKNOWN: ${{ steps.filter.outputs.unknown }}
        run: |
          set -euo pipefail
          for output in "$FILTER_PLUGIN" "$FILTER_RUNTIME" "$FILTER_EVAL" \
            "$FILTER_ISSUE" "$FILTER_OMP" "$FILTER_SHARED" "$FILTER_UNKNOWN"; do
            case "$output" in
              true|false) ;;
              *) printf 'invalid component filter output: %s\n' "$output" >&2; exit 1 ;;
            esac
          done
      - name: Validate CI selection
        run: make check-ci-scope
      - name: Validate repository step references
        run: make check-step-names
      - name: Validate release path classification
        run: make check-release-paths
      - name: Install the Claude Code CLI
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.plugin == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate plugin content
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.plugin == 'true'
        run: make check-plugin-validity
      - name: Ensure ShellCheck
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.runtime == 'true'
        run: shellcheck --version >/dev/null 2>&1 || sudo apt-get install -y shellcheck
      - name: Install Worktrunk
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/worktrunk-installer.sh"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$installer" \
            https://github.com/max-sixty/worktrunk/releases/download/v0.80.0/worktrunk-installer.sh
          echo '53b606fa48b84169180f8881a61f5c31c770645e1d51328032aa5aeb4f2e155a  '"$installer" | sha256sum --check -
          WORKTRUNK_UNMANAGED_INSTALL="$RUNNER_TEMP/worktrunk/bin" sh "$installer"
          echo "$RUNNER_TEMP/worktrunk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/worktrunk/bin/wt" --version
      - name: Validate runtime behavior and fixtures
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.runtime == 'true'
        run: make check-runtime
      - name: Install uv
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.eval == 'true' || steps.filter.outputs.omp == 'true'
        run: |
          set -euo pipefail
          curl -LsS --retry 5 --retry-delay 2 --retry-all-errors https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate eval tooling and fixtures
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.eval == 'true'
        run: make check-eval-tooling
      - name: Validate issue and infrastructure rules
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.issue == 'true'
        run: make check-issue-infra
      - name: Install Omp
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.omp == 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://omp.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Omp is on PATH
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.omp == 'true'
        run: omp --version
      - name: Validate Omp integration
        if: steps.filter.outputs.shared == 'true' || steps.filter.outputs.unknown == 'true' || steps.filter.outputs.omp == 'true'
        run: make check-omp-plugin check-omp-eval-guard-live check-omp-agent-settle
