# CI Success is the required aggregate status. Selection always runs; only selected checks install tools or run commands.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install selector dependencies
        run: npm ci
      - name: Plan changed checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-select.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install Claude Code CLI
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-plugin') || contains(fromJSON(steps.plan.outputs.checks), 'check-skills') || contains(fromJSON(steps.plan.outputs.checks), 'check-agents') || contains(fromJSON(steps.plan.outputs.checks), 'check-claude-dependency')
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Ensure ShellCheck
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-scripts')
        run: shellcheck --version >/dev/null 2>&1 || sudo apt-get install -y shellcheck
      - name: Install Worktrunk
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-git-sync') || contains(fromJSON(steps.plan.outputs.checks), 'check-task-worktree-fixture') || contains(fromJSON(steps.plan.outputs.checks), 'check-worktrunk-install')
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/worktrunk-installer.sh"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$installer" \
            https://github.com/max-sixty/worktrunk/releases/download/v0.80.0/worktrunk-installer.sh
          echo '53b606fa48b84169180f8881a61f5c31c770645e1d51328032aa5aeb4f2e155a  '"$installer" | sha256sum --check -
          WORKTRUNK_UNMANAGED_INSTALL="$RUNNER_TEMP/worktrunk/bin" sh "$installer"
          echo "$RUNNER_TEMP/worktrunk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/worktrunk/bin/wt" --version
      - name: Install uv
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-eval-arms') || contains(fromJSON(steps.plan.outputs.checks), 'check-agent-judges') || contains(fromJSON(steps.plan.outputs.checks), 'check-evals-judge') || contains(fromJSON(steps.plan.outputs.checks), 'check-evals-preflight') || contains(fromJSON(steps.plan.outputs.checks), 'check-evals-provenance') || contains(fromJSON(steps.plan.outputs.checks), 'check-omp-agent-settle')
        run: |
          curl -LsS --retry 5 --retry-delay 2 --retry-all-errors https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Omp
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-plugin') || contains(fromJSON(steps.plan.outputs.checks), 'check-omp-eval-guard-live') || contains(fromJSON(steps.plan.outputs.checks), 'check-omp-agent-settle')
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://omp.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate CI selection
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-ci-scope')
        run: make check-ci-scope
      - name: Validate repository step references
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-step-names')
        run: make check-step-names
      - name: Validate release path classification
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-release-paths')
        run: make check-release-paths
      - name: Validate plugin manifest
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-plugin')
        run: make check-plugin
      - name: Validate skills
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-skills')
        run: make check-skills
      - name: Validate agents
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-agents')
        run: make check-agents
      - name: Validate manifests
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-manifests')
        run: make check-manifests
      - name: Validate manifest fixtures
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-manifest-fixtures')
        run: make check-manifest-fixtures
      - name: Validate Claude dependency
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-claude-dependency')
        run: make check-claude-dependency
      - name: Validate constitution hooks
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-constitution')
        run: make check-constitution
      - name: Validate Ask in chat hook
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-ask-in-chat')
        run: make check-ask-in-chat
      - name: Validate Omp extension
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-extension')
        run: make check-omp-extension
      - name: Validate model class roles
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-model-class-roles')
        run: make check-model-class-roles
      - name: Validate Omp guard differential
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-guard-differential')
        run: make check-omp-guard-differential
      - name: Validate Omp cache refresh
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-cache-clean')
        run: make check-omp-cache-clean
      - name: Validate Git sync
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-git-sync')
        run: make check-git-sync
      - name: Validate task worktree fixtures
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-task-worktree-fixture')
        run: make check-task-worktree-fixture
      - name: Validate Worktrunk installation
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-worktrunk-install')
        run: make check-worktrunk-install
      - name: ShellCheck scripts
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-scripts')
        run: make check-scripts
      - name: Validate Omp agent adapter
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-agent')
        run: make check-omp-agent
      - name: Validate Omp eval guard
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-eval-guard')
        run: make check-omp-eval-guard
      - name: Validate Codex agent adapter
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-codex-agent')
        run: make check-codex-agent
      - name: Validate eval fixtures
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-eval-fixtures')
        run: make check-eval-fixtures
      - name: Validate model classes grader
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-model-classes-grader')
        run: make check-model-classes-grader
      - name: Validate eval arms
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-eval-arms')
        run: make check-eval-arms
      - name: Validate agent judges
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-agent-judges')
        run: make check-agent-judges
      - name: Validate eval judge
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-evals-judge')
        run: make check-evals-judge
      - name: Validate eval preflight
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-evals-preflight')
        run: make check-evals-preflight
      - name: Validate eval provenance
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-evals-provenance')
        run: make check-evals-provenance
      - name: Validate eval results
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-evals-results')
        run: make check-evals-results
      - name: Validate model telemetry
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-model-telemetry')
        run: make check-model-telemetry
      - name: Validate Omp eval setup
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-evals-setup-omp')
        run: make check-evals-setup-omp
      - name: Validate issue labels
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-labels')
        run: make check-labels
      - name: Validate label fixtures
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-labels-fixtures')
        run: make check-labels-fixtures
      - name: Validate Omp plugin integration
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-plugin')
        run: make check-omp-plugin
      - name: Validate live Omp eval guard
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-eval-guard-live')
        run: make check-omp-eval-guard-live
      - name: Validate Omp agent settlement
        if: contains(fromJSON(steps.plan.outputs.checks), 'check-omp-agent-settle')
        run: make check-omp-agent-settle
