# Continuous integration.
#
# `CI Success` is a required status on master. It always runs and checks both
# shared change detection and every selected validation job.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      runtime: ${{ steps.filter.outputs.runtime }}
      eval: ${{ steps.filter.outputs.eval }}
      issue: ${{ steps.filter.outputs.issue }}
      omp: ${{ steps.filter.outputs.omp }}
      shared: ${{ steps.filter.outputs.shared }}
      unknown: ${{ steps.filter.outputs.unknown }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: .github/ci-filters.yml
          predicate-quantifier: some-with-excludes

  repository-checks:
    name: Repository-wide checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Validate CI selection and result contract
        run: make check-ci-scope
      - name: Validate repository step references
        run: make check-step-names

  plugin-validity:
    name: Plugin validity
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Ensure ShellCheck
        run: shellcheck --version >/dev/null 2>&1 || sudo apt-get install -y shellcheck
      - name: Validate plugin manifests and scripts
        run: make check-plugin-validity

  runtime:
    name: Runtime behavior
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate runtime behavior and fixtures
        run: make check-runtime

  eval-tooling:
    name: Eval tooling
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsS --retry 5 --retry-delay 2 --retry-all-errors https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate eval tooling and fixtures
        run: make check-eval-tooling

  issue-infra:
    name: Issue-rule consistency
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.issue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate issue and infrastructure rules
        run: make check-issue-infra

  omp-integration:
    name: Omp integration
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.omp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Omp
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors https://omp.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsS --retry 5 --retry-delay 2 --retry-all-errors https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Omp is on PATH
        run: omp --version
      - name: Validate Omp integration
        run: make check-omp-plugin check-omp-agent-settle

  ci-success:
    name: CI Success
    needs: [changes, repository-checks, plugin-validity, runtime, eval-tooling, issue-infra, omp-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify selected jobs succeeded
        env:
          DETECTION: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.repository-checks.result }}
          PLUGIN_SELECTED: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.plugin == 'true' }}
          PLUGIN_RESULT: ${{ needs.plugin-validity.result }}
          RUNTIME_SELECTED: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.runtime == 'true' }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          EVAL_SELECTED: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.eval == 'true' }}
          EVAL_RESULT: ${{ needs.eval-tooling.result }}
          ISSUE_SELECTED: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.issue == 'true' }}
          ISSUE_RESULT: ${{ needs.issue-infra.result }}
          OMP_SELECTED: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.unknown == 'true' || needs.changes.outputs.omp == 'true' }}
          OMP_RESULT: ${{ needs.omp-integration.result }}
        run: node scripts/check-ci-scope.mjs --aggregate
