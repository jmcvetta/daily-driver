# Temporary #508 smoke probe: force checkout setup failure.
name: Release Projection

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: release-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-projection:
    name: Release Projection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            feature
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          requireScope: false
      - id: checkout
        if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@does-not-exist
        with:
          fetch-depth: 0
      - if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') && steps.checkout.outcome == 'success' }}
        uses: jmcvetta/projected-releases-action@v0
