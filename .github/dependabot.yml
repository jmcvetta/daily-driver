# What is pinned, and so can go stale silently, is the actions the workflows
# call, the OpenTofu provider the infra stack locks, and the npm dev
# dependencies in package-lock.json. The Claude Code CLI that validates the
# plugin is installed unpinned by ci.yml on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # infra/github/.terraform.lock.hcl; CI does not check that file for drift.
  - package-ecosystem: terraform
    directory: /infra/github
    schedule:
      interval: weekly

  # package-lock.json, at the repository root. Only the CI selector script
  # imports these dev dependencies. CI fails a bump that breaks it, but not
  # one that quietly changes which checks it selects, so read those PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
