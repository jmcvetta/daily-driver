  - 'hooks/inject-constitution.py'
  - 'hooks/hooks.json'
  - 'rules/constitution.md'
  - 'evals/**/*.yaml'
  - 'evals/**/*.yml'
  - 'evals/**/*.md'
  - 'evals/**/*.sh'
  - 'evals/**/*.py'
check-ask-in-chat:
