check-worktrunk-install:
  - 'scripts/check-worktrunk-install.sh'
  - 'scripts/ensure-worktrunk.sh'
check-scripts:
  - 'skills/*/scripts/*.sh'
  - 'scripts/*.sh'
  - 'evals/fixtures/*/shared/*.sh'
check-pr-keep-current:
  - 'scripts/test-pr-keep-current.py'
  - 'scripts/pr-keep-current.sh'
check-model-telemetry:
  - 'scripts/check-model-telemetry.py'
  - 'scripts/model-telemetry.py'
  - 'scripts/fixtures/model-telemetry-*.txt'
check-labels:
  - 'scripts/check-labels.py'
  - 'skills/issue-labels/SKILL.md'
  - 'infra/github/labels.tf'
check-infra:
  - 'infra/**'
check-checkov:
