# Each retained Make target owns only the files and fixtures it reads.
# Makefile recipes, top-level structure and execution wiring are handled by the selector.
check-step-names:
  - 'scripts/check-step-names.py'
  - '**/*.md'
  - '**/*.yaml'
  - '**/*.yml'
  - '!CHANGELOG.md'
check-release-paths:
  - 'scripts/check-release-paths.py'
  - 'release-please-config.json'
check-plugin:
  - '.claude-plugin/**'
  - 'CLAUDE.md'
  - '.claude/CLAUDE.md'
check-skills:
  - 'skills/**'
check-agents:
  - 'agents/**'
check-manifests:
  - 'scripts/check-manifests.py'
  - 'scripts/stanza.py'
  - 'skills/**'
  - 'agents/**'
  - 'rules/*.md'
  - '.claude-plugin/**'
  - '.omp-plugin/plugin.json'
  - 'package.json'
  - 'template/.claude/settings.json'
  - '.claude/settings.json'
  - 'README.md'
  - 'docs/**/*.md'
check-claude-dependency:
  - 'scripts/check-claude-dependency.sh'
check-constitution:
